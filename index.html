<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Dr Wessel's">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fafaf9">
<link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' fill='%2392400e'/><text x='90' y='115' font-family='Georgia,serif' font-size='80' fill='%23fef3c7' text-anchor='middle' font-style='italic'>A</text></svg>">
<title>Dr Wessel's Aesthetics</title>
<style>
/* ===== Fonts: load only what's needed ===== */
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600;700&family=Caveat:wght@600&display=swap');

/* ===== Reset ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; font-family: 'Inter', sans-serif; background: #f5f5f4; color: #1c1917; -webkit-font-smoothing: antialiased; -webkit-user-select: none; user-select: none; }
input, textarea { -webkit-user-select: text; user-select: text; font-family: inherit; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, textarea { font-size: 16px; /* prevents iOS zoom */ }

/* ===== Root layout ===== */
#app { height: 100vh; height: 100dvh; display: flex; flex-direction: column; background: #fafaf9; }
.screen { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: env(safe-area-inset-bottom); }
.screen-body { padding-bottom: calc(40px + env(safe-area-inset-bottom)); }

/* ===== Typography ===== */
.serif { font-family: 'Cormorant Garamond', Georgia, serif; }
.caveat { font-family: 'Caveat', cursive; }
.label { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; font-weight: 500; color: #78716c; }
.accent { color: #92400e; }
.amber-label { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; font-weight: 500; color: #92400e; }

/* ===== Header ===== */
.top-bar { display: flex; align-items: center; justify-content: space-between; padding: max(env(safe-area-inset-top), 12px) 24px 12px; }
.top-bar .back { font-size: 15px; color: #92400e; font-weight: 500; padding: 4px 8px; margin-left: -8px; }
.top-bar .title { font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; color: #78716c; }
.top-bar .title-center { text-align: center; }
.top-bar .title-center .name { font-size: 14px; color: #1c1917; font-weight: 600; margin-top: 2px; }
.top-bar .action { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: #92400e; font-weight: 500; padding: 4px 8px; margin-right: -8px; }
.top-bar .action.disabled { color: #d6d3d1; }
.top-bar .spacer { width: 32px; }

.page-header { padding: 16px 24px 16px; }
.page-header h1 { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 34px; font-weight: 400; color: #1c1917; line-height: 1.1; }
.page-header .date { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: #92400e; font-weight: 500; margin-bottom: 4px; }

/* ===== Brand header ===== */
.brand { font-family: 'Cormorant Garamond', serif; font-weight: 300; font-size: 44px; color: #1c1917; line-height: 1; }
.brand em { font-style: italic; color: #92400e; font-weight: 400; }

/* ===== Cards & surfaces ===== */
.card { background: white; border: 1px solid #e7e5e4; border-radius: 16px; padding: 20px; }
.card.amber { background: #fffbeb; border-color: #fcd34d; }
.row { display: flex; align-items: center; gap: 12px; }

/* ===== Buttons ===== */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 14px 20px; border-radius: 999px; font-size: 12px; font-weight: 500; letter-spacing: 0.15em; text-transform: uppercase; }
.btn-primary { background: #92400e; color: #fafaf9; }
.btn-primary:active { background: #78350f; }
.btn-primary.disabled { background: #d6d3d1; color: #fafaf9; }
.btn-dark { background: #1c1917; color: #fafaf9; }
.btn-dark:active { background: #0c0a09; }
.fab { position: absolute; bottom: calc(24px + env(safe-area-inset-bottom)); right: 24px; background: #92400e; color: #fafaf9; border-radius: 999px; padding: 12px 22px; box-shadow: 0 8px 20px rgba(0,0,0,0.15); display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 500; letter-spacing: 0.15em; text-transform: uppercase; z-index: 5; }
.icon-btn { width: 40px; height: 40px; border-radius: 999px; background: #1c1917; color: #fafaf9; display: flex; align-items: center; justify-content: center; }

/* ===== Input fields ===== */
.input { width: 100%; background: white; border: 1px solid #d6d3d1; border-radius: 12px; padding: 13px 16px; font-size: 15px; color: #1c1917; font-weight: 500; outline: none; transition: border-color 0.15s; }
.input:focus { border-color: #92400e; }
.input-with-icon { position: relative; }
.input-with-icon svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #a8a29e; pointer-events: none; }
.input-with-icon .input { padding-left: 44px; }
.textarea { min-height: 80px; resize: vertical; font-family: inherit; }
.field { margin-bottom: 16px; }
.field .label { display: block; margin-bottom: 8px; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

/* ===== Stats strip ===== */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 16px; }
.stat { background: white; border: 1px solid #e7e5e4; border-radius: 12px; padding: 12px; }
.stat.amber { background: #fffbeb; border-color: #fcd34d; }
.stat .n { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 500; color: #1c1917; }
.stat.amber .n { color: #78350f; }
.stat .l { font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase; color: #78716c; margin-top: 2px; }
.stat.amber .l { color: #92400e; }

/* ---- Today screen: enlarged typography (user request) ---- */
.today-screen .page-header .date { font-size: 13px; }
.today-screen .page-header h1 { font-size: 40px; }
.today-screen .label { font-size: 13px; }
.today-screen .input { font-size: 18px; }
.today-screen .stat .n { font-size: 28px; }
.today-screen .stat .l { font-size: 11px; }
.today-screen .list-name { font-size: 24px; }
.today-screen .list-meta { font-size: 15px; }
.today-screen .empty-body { font-size: 15px; }
.today-screen .avatar { width: 72px; height: 72px; font-size: 24px; }   /* recorded-treatment tiles, matching the Clients list */

/* ===== Lists ===== */
.list-item { padding: 16px 24px; border-bottom: 1px solid #e7e5e4; display: flex; align-items: center; gap: 16px; }
.list-item:last-child { border-bottom: none; }
.list-item:active { background: #f5f5f4; }
.avatar { width: 48px; height: 48px; border-radius: 999px; background: linear-gradient(135deg, #fde68a, #d6d3d1); display: flex; align-items: center; justify-content: center; font-family: 'Cormorant Garamond', serif; color: #44403c; font-size: 16px; font-weight: 500; flex-shrink: 0; overflow: hidden; }
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
/* Clients list: larger avatar / photo tiles (user request) */
#client-list .avatar { width: 72px; height: 72px; font-size: 24px; }
#client-list .list-item { padding-right: 34px; }   /* clear the A–Z rail */
/* Sticky alphabet section headers + vertical A–Z jump rail (Clients page) */
.cl-sec { position: sticky; top: 0; z-index: 3; background: #f0efed; color: #92400e; font-family: 'Cormorant Garamond', serif; font-weight: 700; font-size: 18px; letter-spacing: .06em; padding: 3px 24px; border-bottom: 1px solid #e7e5e4; }
.az-rail { position: fixed; right: 2px; top: 50%; transform: translateY(-50%); z-index: 20; display: flex; flex-direction: column; align-items: center; padding: 7px 3px; border-radius: 999px; background: rgba(255,255,255,0.94); border: 1px solid #ece8e3; -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); box-shadow: 0 2px 12px rgba(0,0,0,0.12); }
.az-letter { font-size: 12px; line-height: 1; font-weight: 700; color: #92400e; width: 20px; height: 17px; display: flex; align-items: center; justify-content: center; background: transparent; }
.az-letter.az-off { color: #d6d3d1; }
.az-letter:active { color: #1c1917; transform: scale(1.35); }
.consent-thumb { cursor: pointer; padding: 0; }
.consent-thumb svg { width: 26px; height: 26px; }

/* Full-screen consent-photo viewer */
.cv-overlay { position: fixed; inset: 0; z-index: 1000; background: rgba(12,10,9,0.97); display: flex; flex-direction: column; }
.cv-bar { display: flex; align-items: center; justify-content: space-between; padding: max(env(safe-area-inset-top),12px) 16px 12px; flex-shrink: 0; }
.cv-btn { color: #fafaf9; font-size: 13px; font-weight: 500; letter-spacing: .05em; padding: 8px 14px; border-radius: 999px; background: rgba(255,255,255,0.14); display: flex; align-items: center; gap: 6px; }
.cv-btn:active { background: rgba(255,255,255,0.28); }
.cv-btn svg { width: 16px; height: 16px; }
.cv-scroll { flex: 1; overflow: auto; -webkit-overflow-scrolling: touch; display: flex; align-items: center; justify-content: center; padding: 8px; }
.cv-scroll.zoomed { display: block; }
.cv-img { display: block; max-width: 100%; max-height: 100%; }
.cv-scroll.zoomed .cv-img { max-width: none; max-height: none; }
.cv-zoom { position: absolute; bottom: calc(20px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 2px; background: rgba(28,25,23,0.88); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-radius: 999px; padding: 4px; }
.cv-zoom button { min-width: 46px; height: 46px; padding: 0 12px; border-radius: 999px; color: #fafaf9; font-size: 22px; font-weight: 500; display: flex; align-items: center; justify-content: center; }
.cv-zoom button.mid { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }

/* Full-screen before/after comparison (two panes side by side) */
.cmp-overlay { position: fixed; inset: 0; z-index: 1000; background: rgba(12,10,9,0.97); display: flex; flex-direction: column; }
.cmp-title { color: #fafaf9; font-family: 'Cormorant Garamond', serif; font-size: 18px; font-weight: 500; text-align: center; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cmp-panes { flex: 1; display: flex; min-height: 0; gap: 2px; }
.cmp-pane { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.cmp-chips { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; padding: 8px 6px; flex-shrink: 0; }
.cmp-chip { font-size: 11px; letter-spacing: .03em; color: rgba(250,250,249,0.6); background: rgba(255,255,255,0.1); border-radius: 999px; padding: 5px 11px; }
.cmp-chip.active { background: #fde68a; color: #78350f; font-weight: 600; }
.cmp-img { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 6px; }
.cmp-img img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }

/* Tappable product rows on the Summary page + the client-breakdown pop-up */
.bd-row:active { background: #faf9f7; }
.bd-overlay { position: fixed; inset: 0; z-index: 1000; background: rgba(12,10,9,0.55); display: flex; align-items: flex-end; justify-content: center; }
.bd-sheet { background: #fafaf9; width: 100%; max-width: 560px; max-height: 86vh; border-radius: 24px 24px 0 0; display: flex; flex-direction: column; box-shadow: 0 -8px 40px rgba(0,0,0,0.25); }
.bd-head { display: flex; align-items: flex-start; gap: 12px; padding: 20px 22px 14px; border-bottom: 1px solid #e7e5e4; flex-shrink: 0; }
.bd-head .bd-titles { flex: 1; min-width: 0; }
.bd-head .bd-product { font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 500; line-height: 1.1; display: flex; align-items: center; gap: 9px; }
.bd-head .bd-range { font-size: 13px; color: #78716c; margin-top: 3px; }
.bd-close { width: 38px; height: 38px; border-radius: 999px; background: #e7e5e4; color: #57534e; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 20px; }
.bd-close:active { background: #d6d3d1; }
.bd-list { overflow: auto; -webkit-overflow-scrolling: touch; padding: 6px 22px 0; }
.bd-client { display: flex; align-items: center; gap: 10px; padding: 13px 0; border-bottom: 1px solid #f0efed; }
.bd-client[data-cid] { cursor: pointer; }
.bd-client[data-cid]:active { background: #f5f5f4; }
.bd-client .bd-go { flex-shrink: 0; color: #c4bfba; font-size: 22px; line-height: 1; margin-left: 2px; }
.bd-client .bd-name { flex: 1; min-width: 0; font-size: 17px; font-weight: 600; }
.bd-client .bd-sub { font-size: 13px; color: #a8a29e; margin-top: 2px; }
.bd-amt { text-align: right; flex-shrink: 0; }
.bd-client .bd-charge { font-size: 16px; font-weight: 600; }
.bd-client .bd-profit { font-size: 13px; margin-top: 2px; }
.bd-foot { display: flex; align-items: center; gap: 10px; padding: 16px 22px calc(20px + env(safe-area-inset-bottom)); border-top: 2px solid #e7e5e4; flex-shrink: 0; }
.bd-foot .bd-name { flex: 1; min-width: 0; font-size: 16px; font-weight: 700; }
.bd-foot .bd-charge { font-size: 16px; font-weight: 700; }
.bd-foot .bd-profit { font-size: 13px; font-weight: 700; margin-top: 2px; text-align: right; }

/* Edit pencil on appointment rows (sits beside the tap-to-start area) */
.appt-edit-btn { width: 40px; height: 40px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: #a8a29e; flex-shrink: 0; }
.appt-edit-btn:active { background: #e7e5e4; color: #78716c; }
.appt-edit-btn svg { width: 18px; height: 18px; }
.appt-start { flex: 1; min-width: 0; display: flex; align-items: center; gap: 16px; text-align: left; background: none; padding: 0; }
.cv-zoom button:active { background: rgba(255,255,255,0.18); }
.list-content { flex: 1; min-width: 0; }
.list-name { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 500; color: #1c1917; }
.list-meta { font-size: 12px; color: #78716c; margin-top: 2px; }
.list-meta .dot { display: inline-block; width: 3px; height: 3px; border-radius: 999px; background: #d6d3d1; margin: 0 6px; vertical-align: middle; }
.badge-incomplete { display: inline-block; vertical-align: middle; margin-left: 8px; padding: 2px 8px; border-radius: 999px; font-size: 10px; letter-spacing: 0.04em; text-transform: uppercase; font-weight: 600; background: #fef3c7; color: #92400e; border: 1px solid #fcd34d; }

/* ===== Empty state ===== */
.empty { padding: 60px 24px; text-align: center; color: #78716c; }
.empty svg { width: 40px; height: 40px; color: #d6d3d1; margin: 0 auto 12px; }
.empty-title { font-family: 'Cormorant Garamond', serif; font-size: 20px; color: #44403c; margin-bottom: 6px; }
.empty-body { font-size: 13px; line-height: 1.5; max-width: 240px; margin: 0 auto; }

/* ===== Tab bar ===== */
/* Menu styled to match the Summary "gradient-hero" bar: same amber gradient,
   off-white/gold text, Cormorant Garamond serif labels. */
.tab-bar { flex-shrink: 0; background: linear-gradient(135deg, #78350f, #92400e); padding: calc(8px + env(safe-area-inset-top)) 16px 8px; display: flex; justify-content: space-around; align-items: center; box-shadow: 0 4px 14px rgba(120,53,15,0.3); }
.tab { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 12px; color: rgba(250,250,249,0.62); }
.tab.active { color: #fde68a; }
.tab svg { width: 22px; height: 22px; }
.tab .l { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 14px; letter-spacing: 0.02em; font-weight: 500; line-height: 1; }
.tab-plus { width: 48px; height: 48px; border-radius: 999px; background: #fef3c7; color: #92400e; display: flex; align-items: center; justify-content: center; margin-bottom: -16px; box-shadow: 0 6px 12px rgba(0,0,0,0.2); }

/* ===== Treatment detail area rows ===== */
.area-row { display: grid; grid-template-columns: 1fr 1fr; align-items: baseline; border-bottom: 1px dotted #e7e5e4; padding: 8px 0; column-gap: 12px; }
.area-label { font-size: 14px; color: #44403c; font-weight: 600; }
.area-label.muted { color: #a8a29e; }
.area-value { font-size: 14px; color: #1c1917; font-weight: 600; }
.area-value.muted { color: #a8a29e; font-weight: 400; }
.area-input { width: 56px; text-align: right; font-size: 14px; font-weight: 600; background: transparent; border: none; outline: none; border-bottom: 1px dashed #d6d3d1; padding: 2px 0; }
.area-input:focus { border-bottom-color: #92400e; }
.other-row { display: grid; grid-template-columns: 1fr 1fr; align-items: baseline; column-gap: 12px; border-bottom: 1px dotted #e7e5e4; padding: 8px 0; }
.other-left { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.other-prefix { font-size: 14px; color: #78716c; flex-shrink: 0; }
.other-label-input { flex: 1; min-width: 0; font-family: 'Cormorant Garamond', serif; font-size: 15px; font-style: italic; background: transparent; border: none; outline: none; border-bottom: 1px dashed #d6d3d1; padding: 2px 0; color: #1c1917; }
.other-label-input::placeholder { color: #d6d3d1; font-style: normal; }
.other-label-input:focus { border-bottom-color: #92400e; }
.other-units { display: flex; align-items: baseline; gap: 1px; flex-shrink: 0; }
.other-units .u { font-size: 14px; font-weight: 600; color: #1c1917; }
.other-units .u.u-empty { color: #d6d3d1; }

/* ===== Billing ===== */
.billing { margin-top: 16px; padding-top: 16px; border-top: 1px solid #d6d3d1; }
.billing .rate-row { display: flex; align-items: baseline; justify-content: space-between; padding: 4px 0; font-size: 14px; }
.billing .rate-row .muted { color: #78716c; }
.rate-edit-btn { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #1c1917; }
.rate-edit-btn:active { opacity: 0.6; }
.rate-edit-btn .edit-hint { font-size: 10px; color: #a8a29e; }
.rate-badge { font-size: 8px; letter-spacing: 0.15em; text-transform: uppercase; font-weight: 600; padding: 3px 6px; border-radius: 3px; }
.rate-badge.override { color: #92400e; background: #fef3c7; }
.rate-badge.client { color: #047857; background: #d1fae5; }
.rate-input { width: 64px; text-align: right; font-size: 14px; font-weight: 600; background: #fef3c7; border: 1px solid #fcd34d; border-radius: 4px; padding: 2px 6px; color: #78350f; outline: none; }
.rate-context { font-family: 'Cormorant Garamond', serif; font-size: 11px; font-style: italic; color: #78716c; text-align: right; margin-top: 4px; }
.total-charge { margin: 12px -20px -20px; padding: 16px 20px; background: #fef3c7; border-radius: 0 0 16px 16px; display: flex; justify-content: space-between; align-items: baseline; border-top: 1px dotted #d6d3d1; }
.total-charge .big { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 500; color: #1c1917; }
.total-charge .big .cents { font-size: 16px; color: #78716c; }

/* ---- Treatment page: enlarged, bold typography (user request) ---- */
.tx-screen .label,
.tx-screen .amber-label { font-size: 13px; font-weight: 700; }
.tx-screen .top-bar .title-center .name { font-size: 16px; font-weight: 700; }
.tx-screen .input,
.tx-screen .textarea { font-size: 18px; font-weight: 700; }
.tx-screen .area-label,
.tx-screen .area-value,
.tx-screen .area-label.muted,
.tx-screen .area-value.muted { font-size: 18px; font-weight: 700; }
.tx-screen .area-input { font-size: 18px; font-weight: 700; width: 68px; }
.tx-screen .other-prefix,
.tx-screen .other-units .u,
.tx-screen .other-units .u.u-empty { font-size: 18px; font-weight: 700; }
.tx-screen .other-label-input { font-size: 19px; font-weight: 700; }
.tx-screen .billing .rate-row,
.tx-screen .billing .rate-row .muted { font-size: 18px; font-weight: 700; }
.tx-screen .rate-edit-btn { font-size: 18px; font-weight: 700; }
.tx-screen .rate-edit-btn .edit-hint { font-size: 13px; font-weight: 700; }
.tx-screen .rate-context { font-size: 14px; font-weight: 700; }
.tx-screen .rate-badge { font-size: 10px; font-weight: 700; }
.tx-screen .total-charge .big { font-size: 36px; font-weight: 700; }
.tx-screen .total-charge .big .cents { font-size: 22px; font-weight: 700; }
.tx-screen .notice { font-size: 13px; font-weight: 600; }
.tx-screen .photo-empty-title { font-size: 24px; }

/* ---- Summary (End of Day) + Settings pages: enlarged type (user request) ---- */
.eod-screen .label,
.settings-screen .label { font-size: 13px; }
.eod-screen .chip { font-size: 13px; padding: 7px 14px; }
.eod-screen .input { font-size: 17px; }
.eod-screen .empty-body { font-size: 15px; }
.eod-screen .gradient-hero .big { font-size: 48px; }
.eod-screen .gradient-hero .big .cents { font-size: 24px; }
.eod-screen .gradient-hero .meta { font-size: 14px; }
.settings-screen .btn { font-size: 14px; }
.settings-screen .rate-input { font-size: 17px; width: 76px; }
.settings-screen .notice { font-size: 14px; }

/* ---- Cream/brown reading scheme (user request) ----
   Warm cream page surface with softened warm-brown body text, matching the
   comfortable feel of the Treatment page. Cards stay white so they still pop,

<body>
<div id="app"></div>

<script>
// ================================================================
//   DATA LAYER — localStorage persistence
// ================================================================
const STORAGE_KEY = 'drwessels_aesthetics_v1';
const APP_BUILD = '2026-06-07 · lanree-file-fix';   // bump on each change; shown in Settings to confirm the loaded version

const DEFAULT_DATA = {
  clinicRates: {
    Botox: { cost: 0, rate: 15, unit: 'unit', label: 'u' },
    Xeomin: { cost: 0, rate: 11, unit: 'unit', label: 'u' },
    Relfydess: { cost: 0, rate: 16, unit: 'unit', label: 'u' },
    'Botox Review': { cost: 0, rate: 0, unit: 'unit', label: 'u' },
    'Xeomin Review': { cost: 0, rate: 0, unit: 'unit', label: 'u' },
    'Relfydess Review': { cost: 0, rate: 0, unit: 'unit', label: 'u' },
    Filler: { cost: 0, rate: 580, unit: 'ml', label: 'ml' },
    SkinVive: { cost: 0, rate: 0, unit: 'ml', label: 'ml' },
    Keloid: { cost: 0, rate: 120, unit: 'session', label: 'session' },
    Consultation: { cost: 0, rate: 90, unit: 'session', label: 'session' }
  },
  clients: [],
  treatments: [],
  appointments: []
};

// Products billed as a single flat fee per session (no unit counting / facial
// areas), as opposed to the per-unit toxins and per-ml Filler. The treatment
// editor shows these a simplified "flat fee" billing card instead of areas.
const FLAT_FEE_PRODUCTS = ['Keloid', 'Consultation'];
function isFlatFeeProduct(p) { return FLAT_FEE_PRODUCTS.includes(p); }

// Per-ml products (single standard area, decimal step). Filler → Lips, SkinVive → Cheeks.
const ML_PRODUCTS = ['Filler', 'SkinVive'];
function isMlProduct(p) { return ML_PRODUCTS.includes(p); }
function mlAreaName(p) { return p === 'SkinVive' ? 'Cheeks' : 'Lips'; }

// Review products bill per-unit like Botox but are allowed to save at 0 units
// without the "Save anyway?" confirm — used to record a no-charge follow-up.
const REVIEW_PRODUCTS = ['Botox Review', 'Xeomin Review', 'Relfydess Review'];
function isReviewProduct(p) { return REVIEW_PRODUCTS.includes(p); }
// Maps a toxin to its no-charge follow-up Review product. Drives the "+ Review"
// chip on the most recent treatment in the profile timeline (a review is typically
// done ~2 weeks after the treatment). Only these three toxins have a review product.
const REVIEW_CHILD = { Botox: 'Botox Review', Xeomin: 'Xeomin Review', Relfydess: 'Relfydess Review' };
// Add a number of days to an ISO yyyy-mm-dd date, returning a local-date ISO string
// (built from local Y/M/D parts, matching todayISO() — avoids UTC drift in NZ).
function addDaysISO(iso, days) {
  const [y, m, d] = String(iso).split('-').map(Number);
  const dt = new Date(y, m - 1, d + days);
  const mm = String(dt.getMonth() + 1).padStart(2, '0');
  const dd = String(dt.getDate()).padStart(2, '0');
  return `${dt.getFullYear()}-${mm}-${dd}`;
}

// Each treatment holds up to four photos. None are annotated (drawing was removed
// from the Treatment slot). Photo image data lives in IndexedDB, keyed by the id
// stored in t.photos[slot]. Legacy t.strokes data is kept but no longer rendered/editable.
// NOTE: display labels were renamed in place (user request) without changing the
// internal `key`s, so labels and keys intentionally no longer line up 1:1. Keys are
// kept stable so already-stored photos stay in their tiles (t.photos[key]) and the
// grid positions in viewTreatment are unchanged.
const PHOTO_SLOTS = [
  { key: 'before',    label: 'Before',        annotate: false },
  { key: 'treatment', label: '2-week review', annotate: false },
  { key: 'review',    label: 'Dynamic Photo', annotate: false },
  { key: 'dynamic',   label: 'Treatment',     annotate: false }
];
const ANNOTATED_SLOT = null;  // no slot is annotated; drawing is disabled

// Upgrade a record from the legacy single-photo model (t.photoId) to per-slot
// photos. The old photo had the injection-site annotations, so it maps to the
// Treatment slot. Idempotent.
function migrateTreatment(t) {
  if (!t || typeof t !== 'object') return t;
  if (!t.photos || typeof t.photos !== 'object') {
    t.photos = { before: null, treatment: (t.photoId || null), review: null };
  }
  // Backfill any slot keys this record predates (e.g. 'dynamic' added later).
  for (const s of PHOTO_SLOTS) if (!(s.key in t.photos)) t.photos[s.key] = null;
  delete t.photoId;
  if (!Array.isArray(t.strokes)) t.strokes = [];
  // Reconcile records whose recorded total exceeds the itemised areas. iDatabase
  // sometimes stored a "Total iu" that didn't match its own area breakdown (e.g. 80
  // recorded but Glabella+Frontalis only sum to 52, with nothing in "Other"). The
  // stored total is authoritative — it's what was billed — so the unaccounted units
  // go into an "Other" row. Without this the profile (stored total) and the treatment
  // page (recomputed from areas) disagree, and saving the tx would overwrite the real
  // total with the smaller area sum. For correctly-entered records the two already
  // match, so diff is 0 and nothing changes. Skipped for flat-fee / per-ml products.
  if (!isFlatFeeProduct(t.product) && !isMlProduct(t.product) && typeof t.totalUnits === 'number') {
    const areaSum = ['Glabella', 'Frontalis', "Crow's feet", 'Masseters']
      .reduce((s, k) => s + (parseFloat(t.areas && t.areas[k]) || 0), 0);
    if (!Array.isArray(t.others)) t.others = [];
    const otherSum = t.others.reduce((s, o) => s + (parseFloat(o.units) || 0), 0);
    const diff = Math.round((t.totalUnits - (areaSum + otherSum)) * 100) / 100;
    if (diff > 0) t.others.push({ label: 'Other', units: diff });
  }
  return t;
}
function migrateAllTreatments(data) {
  if (data && Array.isArray(data.treatments)) data.treatments.forEach(migrateTreatment);
  return data;
}

// Ensure clinicRates has every default product (older saves predate Keloid /
// Consultation) and that each entry has a `cost` field (the per-unit cost to the
// clinic, added alongside the existing `rate` = charge to the client). loadData's
// shallow merge lets a saved clinicRates fully replace the default, so without
// this older data would be missing the new products and the cost column.
function migrateClinicRates(data) {
  if (data && typeof data === 'object') {
    if (!data.clinicRates || typeof data.clinicRates !== 'object') {
      data.clinicRates = structuredClone(DEFAULT_DATA.clinicRates);
    } else {
      for (const [p, def] of Object.entries(DEFAULT_DATA.clinicRates)) {
        if (!data.clinicRates[p]) data.clinicRates[p] = { ...def };
        else if (data.clinicRates[p].cost === undefined) data.clinicRates[p].cost = 0;
      }
    }
    // Review follow-ups consume the parent toxin's product, so their cost-per-unit
    // should match it (Botox Review→Botox, etc.) — otherwise reviews show $0 cost
    // and no loss, instead of the "units × cost" loss the Lanree sheet records.
    // Backfill when the review cost is still 0/blank; a user-set value is preserved.
    const REVIEW_PARENT = { 'Botox Review': 'Botox', 'Xeomin Review': 'Xeomin', 'Relfydess Review': 'Relfydess' };
    for (const [rev, parent] of Object.entries(REVIEW_PARENT)) {
      const r = data.clinicRates[rev], pr = data.clinicRates[parent];
      if (r && pr && pr.cost && !r.cost) r.cost = pr.cost;
    }
  }
  return data;
}

// ================================================================
//   EXCEL (.xlsx) APPOINTMENT IMPORT — minimal, dependency-free.
//   An .xlsx is a ZIP of XML; we unzip with the browser's built-in
//   DecompressionStream (works offline, no library) and read the
//   Lanree day-sheet tabs.
// ================================================================
async function xlsxInflateRaw(bytes) {
  const stream = new Response(bytes).body.pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

async function xlsxOpen(arrayBuffer) {
  if (typeof DecompressionStream === 'undefined') {
    throw new Error('This browser can’t read .xlsx files — please update Safari/iOS.');
  }
  const bytes = new Uint8Array(arrayBuffer);
  const dv = new DataView(arrayBuffer);
  let eocd = -1;
  for (let i = bytes.length - 22; i >= 0; i--) { if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; } }
  if (eocd < 0) throw new Error('Not a valid .xlsx file (no ZIP directory found).');
  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const files = {};
  for (let n = 0; n < count && p + 46 <= bytes.length; n++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true);
    const compSize = dv.getUint32(p + 20, true);
    const nameLen = dv.getUint16(p + 28, true);
    const extraLen = dv.getUint16(p + 30, true);
    const commentLen = dv.getUint16(p + 32, true);
    const localOff = dv.getUint32(p + 42, true);
    const name = new TextDecoder().decode(bytes.subarray(p + 46, p + 46 + nameLen));
    files[name] = { method, compSize, localOff };
    p += 46 + nameLen + extraLen + commentLen;
  }
  return { bytes, dv, files };
}

async function xlsxRead(zip, name) {
  const f = zip.files[name];
  if (!f) return null;
  const lo = f.localOff;
  const nameLen = zip.dv.getUint16(lo + 26, true);
  const extraLen = zip.dv.getUint16(lo + 28, true);
  const start = lo + 30 + nameLen + extraLen;
  const comp = zip.bytes.subarray(start, start + f.compSize);
  const out = f.method === 0 ? comp : await xlsxInflateRaw(comp);
  return new TextDecoder().decode(out);
}

function xlsxParseXml(text) {
  const doc = new DOMParser().parseFromString(text, 'text/xml');
  if (doc.getElementsByTagName('parsererror').length) throw new Error('Malformed spreadsheet XML.');
  return doc;
}

// "16 May 26" -> "2026-05-16"; null if the tab name isn't a date.
function parseSheetDate(label) {
  const m = (label || '').trim().match(/^(\d{1,2})\s+([A-Za-z]{3,})\s+(\d{2,4})$/);
  if (!m) return null;
  const months = { jan:0, feb:1, mar:2, apr:3, may:4, jun:5, jul:6, aug:7, sep:8, oct:9, nov:10, dec:11 };
  const mon = months[m[2].slice(0, 3).toLowerCase()];
  if (mon === undefined) return null;
  let yr = parseInt(m[3], 10); if (yr < 100) yr += 2000;
  return `${yr}-${String(mon + 1).padStart(2, '0')}-${String(parseInt(m[1], 10)).padStart(2, '0')}`;
}

// Column A holds the slot time as a decimal (9.3 = 9:30, 13.45 = 13:45).
function formatSlotTime(num) {
  if (isNaN(num)) return '';
  const hour = Math.floor(num);
  let min = Math.round((num - hour) * 100);
  if (min >= 60) min = min % 60;
  let h12 = hour % 12; if (h12 === 0) h12 = 12;
  return `${h12}:${String(min).padStart(2, '0')}${hour >= 12 ? 'pm' : 'am'}`;
}

// Parse a stored appointment time string to minutes-since-midnight, or NaN.
// Handles both the import display form ("9:30am", "1:45pm") and a bare 24h
// "13:45". Used for sorting and to seed the <input type="time"> when editing.
function parseApptTime(str) {
  const m = /(\d{1,2}):(\d{2})\s*(am|pm)?/i.exec(str || '');
  if (!m) return NaN;
  let h = parseInt(m[1], 10), min = parseInt(m[2], 10);
  const ap = (m[3] || '').toLowerCase();
  if (ap === 'pm' && h < 12) h += 12;
  if (ap === 'am' && h === 12) h = 0;
  return h * 60 + min;
}
// "13:45" (from <input type="time">) -> "1:45pm" display form (matches imports).
function formatTime24(hhmm) {
  const m = /^(\d{1,2}):(\d{2})$/.exec(hhmm || '');
  if (!m) return '';
  const h = parseInt(m[1], 10), min = parseInt(m[2], 10);
  let h12 = h % 12; if (h12 === 0) h12 = 12;
  return `${h12}:${String(min).padStart(2, '0')}${h >= 12 ? 'pm' : 'am'}`;
}
// Display time -> "HH:MM" for <input type="time">. '' if unparseable.
function timeTo24h(display) {
  const t = parseApptTime(display);
  if (isNaN(t)) return '';
  return `${String(Math.floor(t / 60)).padStart(2, '0')}:${String(t % 60).padStart(2, '0')}`;
}
// Sort appointments within a day by time (timeless ones sink to the bottom),
// using the stored import order only as a tiebreak.
function byApptTime(a, b) {
  const ta = parseApptTime(a.time), tb = parseApptTime(b.time);
  const na = isNaN(ta), nb = isNaN(tb);
  if (na && nb) return (a.order || 0) - (b.order || 0);
  if (na) return 1;
  if (nb) return -1;
  return ta - tb || (a.order || 0) - (b.order || 0);
}

// Names that aren't real client appointments (e.g. the clinic's own stock-usage
// row). Compared case-insensitively against the exact cell value. Add more here.
const APPT_NAME_EXCLUDE = ['wessel'];

// One day-sheet -> [{ time, name, treatment, notes }] for each booked slot.
function extractAppointments(sheetXml, shared) {
  const doc = xlsxParseXml(sheetXml);
  const rowEls = doc.getElementsByTagName('row');
  const rows = [];
  for (let i = 0; i < rowEls.length; i++) {
    const cells = {};
    const cEls = rowEls[i].getElementsByTagName('c');
    for (let j = 0; j < cEls.length; j++) {
      const c = cEls[j];
      const col = (c.getAttribute('r') || '').replace(/[0-9]/g, '');
      const vEls = c.getElementsByTagName('v');
      let val = vEls.length ? vEls[0].textContent : '';
      if (c.getAttribute('t') === 's') val = shared[parseInt(val, 10)] || '';
      cells[col] = val;
    }
    rows.push({ rnum: parseInt(rowEls[i].getAttribute('r'), 10) || 0, cells });
  }
  rows.sort((a, b) => a.rnum - b.rnum);
  const appts = [];
  for (const { cells } of rows) {
    const name = (cells.B || '').trim();
    const timeNum = parseFloat(cells.A);
    if (!name || isNaN(timeNum)) continue;   // a booked slot has a numeric time (col A) + a name (col B)
    if (APPT_NAME_EXCLUDE.includes(name.toLowerCase())) continue; // skip non-client rows (e.g. stock usage)
    const treatment = (cells.D || '').trim();
    appts.push({
      time: formatSlotTime(timeNum),
      name,
      treatment: treatment.toLowerCase() === 'open' ? '' : treatment,
      notes: (cells.C || '').trim()
    });
  }
  return appts;
}

// Parse every dated day-sheet from the workbook, oldest -> newest.
async function parseLanreeAppointments(arrayBuffer) {
  const zip = await xlsxOpen(arrayBuffer);

  const ssXml = await xlsxRead(zip, 'xl/sharedStrings.xml');
  const shared = [];
  if (ssXml) {
    const siEls = xlsxParseXml(ssXml).getElementsByTagName('si');
    for (let i = 0; i < siEls.length; i++) {
      const tEls = siEls[i].getElementsByTagName('t');
      let s = ''; for (let j = 0; j < tEls.length; j++) s += tEls[j].textContent;
      shared.push(s);
    }
  }

  const wbXml = await xlsxRead(zip, 'xl/workbook.xml');
  const relsXml = await xlsxRead(zip, 'xl/_rels/workbook.xml.rels');
  if (!wbXml || !relsXml) throw new Error('Could not read the workbook structure.');
  const rel = {};
  const relEls = xlsxParseXml(relsXml).getElementsByTagName('Relationship');
  for (let i = 0; i < relEls.length; i++) rel[relEls[i].getAttribute('Id')] = relEls[i].getAttribute('Target');

  const days = [];
  const shEls = xlsxParseXml(wbXml).getElementsByTagName('sheet');
  for (let i = 0; i < shEls.length; i++) {
    const name = shEls[i].getAttribute('name');
    const iso = parseSheetDate(name);
    if (!iso) continue;
    // r:id is namespaced; getAttribute('r:id') works in most browsers, but fall
    // back to scanning attributes for the relationship id if it returns null.
    let rid = shEls[i].getAttribute('r:id');
    if (!rid) {
      const attrs = shEls[i].attributes;
      for (let k = 0; k < attrs.length; k++) {
        if (attrs[k].localName === 'id') { rid = attrs[k].value; break; }
      }
    }
    let target = rel[rid] || '';
    if (!target) continue;
    if (!target.startsWith('xl/')) target = 'xl/' + target.replace(/^\//, '');
    const xml = await xlsxRead(zip, target);
    if (!xml) continue;
    days.push({ dateISO: iso, dateLabel: name.trim(), appts: extractAppointments(xml, shared) });
  }
  days.sort((a, b) => a.dateISO.localeCompare(b.dateISO));
  return days;
}

// Render the per-day picker that appears after a Lanree workbook is parsed.
// Reads from module-global _pendingXlsx (the parsed days, each with a
// .selected boolean); recounts existing app appointments each render so the
// "already in app" badges stay live as the underlying data changes.
function renderXlsxPicker() {
  const panel = document.getElementById('xlsx-confirm');
  if (!panel) return;
  if (!_pendingXlsx || !_pendingXlsx.length) { panel.style.display = 'none'; panel.innerHTML = ''; return; }
  const today = todayISO();
  const existingByDate = {};
  for (const a of state.data.appointments) existingByDate[a.date] = (existingByDate[a.date] || 0) + 1;

  const rows = _pendingXlsx.map(d => {
    const existing = existingByDate[d.dateISO] || 0;
    const isEmptySheet = d.appts.length === 0;
    const blocked = existing > 0 || isEmptySheet;
    const checked = d.selected && !blocked;
    const isPast = d.dateISO < today;
    const sub = isEmptySheet
      ? 'No bookings in sheet'
      : (existing > 0 ? `${d.appts.length} in sheet · ${existing} already in app — skipped` : `${d.appts.length} appt${d.appts.length === 1 ? '' : 's'} in sheet`);
    return `
      <label style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f5f5f4;${blocked ? 'opacity:0.5;' : 'cursor:pointer;'}">
        <input type="checkbox" class="xlsx-day-check" data-iso="${escapeHtml(d.dateISO)}" ${checked ? 'checked' : ''} ${blocked ? 'disabled' : ''} style="width:20px;height:20px;flex-shrink:0;">
        <div style="flex:1;min-width:0;">
          <div style="font-size:15px;font-weight:600;color:#1c1917;">${escapeHtml(d.dateLabel)}${isPast ? ' <span style="font-size:12px;color:#a8a29e;font-weight:400;">· past</span>' : ''}</div>
          <div style="font-size:12px;color:${existing > 0 ? '#b45309' : '#78716c'};">${sub}</div>
        </div>
      </label>`;
  }).join('');

  const checkedCount = _pendingXlsx.filter(d => d.selected && !(existingByDate[d.dateISO] > 0) && d.appts.length > 0).length;

  panel.innerHTML = `
    <div style="font-size:14px;color:#78350f;font-weight:700;margin-bottom:10px;">Pick day-sheets to import</div>
    <div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;">
      <button class="chip" data-xlsx-preset="future">Today onward</button>
      <button class="chip" data-xlsx-preset="all">All empty</button>
      <button class="chip" data-xlsx-preset="none">None</button>
    </div>
    <div style="max-height:340px;overflow-y:auto;margin-bottom:12px;padding-right:4px;">${rows}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
      <button class="btn" id="xlsx-cancel" style="background:#f5f5f4;color:#1c1917;font-weight:600;">Cancel</button>
      <button class="btn" id="xlsx-go" style="background:#92400e;color:#fafaf9;font-weight:600;${checkedCount === 0 ? 'opacity:0.5;pointer-events:none;' : ''}">Import ${checkedCount} day${checkedCount === 1 ? '' : 's'}</button>
    </div>
  `;
  panel.style.display = 'block';
}

// Commit the picker selection: for every selected, empty-in-app date, add its
// appointments to state.data.appointments and create a name-only client for
// any new name. Dates already populated in the app are SKIPPED (never
// overwritten) — that's the agreed merge semantic.
function xlsxCommitImport() {
  if (!_pendingXlsx) return;
  const existingByDate = {};
  for (const a of state.data.appointments) existingByDate[a.date] = (existingByDate[a.date] || 0) + 1;
  const toImport = _pendingXlsx.filter(d =>
    d.selected && d.appts.length > 0 && !(existingByDate[d.dateISO] > 0)
  );
  if (!toImport.length) { return; }

  const added = [];
  toImport.forEach(d => d.appts.forEach((a, i) => added.push({
    id: uid(), date: d.dateISO, dateLabel: d.dateLabel,
    time: a.time, name: a.name, treatment: a.treatment, notes: a.notes, order: i
  })));

  // Auto-create a name-only client for any new appointment name (same logic
  // as the old single-shot import).
  let created = 0;
  const seen = new Set(state.data.clients.map(c => `${c.firstName} ${c.lastName}`.trim().toLowerCase()));
  added.forEach(a => {
    const key = a.name.trim().toLowerCase();
    if (!key || seen.has(key)) return;
    const parts = a.name.trim().split(/\s+/);
    const firstName = parts.shift() || a.name.trim();
    state.data.clients.push({
      id: uid(), firstName, lastName: parts.join(' '),
      dob: '', phone: '', allergies: '',
      notes: a.notes ? `From appointment ${a.dateLabel}: ${a.notes}` : '',
      rates: {}, clientSince: todayISO()
    });
    seen.add(key);
    created++;
  });
  state.data.appointments = state.data.appointments.concat(added);
  saveData();

  const days = toImport.length;
  _pendingXlsx = null;
  const status = document.getElementById('import-status');
  if (status) {
    status.style.display = 'block';
    status.style.color = '#047857';
    status.textContent = `Imported ${added.length} appointment${added.length === 1 ? '' : 's'} across ${days} day${days === 1 ? '' : 's'} (${created} new client${created === 1 ? '' : 's'} added).`;
  }
  setView('schedule');
}

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return structuredClone(DEFAULT_DATA);
    const parsed = JSON.parse(raw);
    return migrateClinicRates(migrateAllTreatments({ ...structuredClone(DEFAULT_DATA), ...parsed }));
  } catch (e) {
    console.error('Failed to load data', e);
    return structuredClone(DEFAULT_DATA);
  }
}

function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data));
  } catch (e) {
    alert('Could not save — storage may be full. Try deleting old data or contact support.');
  }
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

// Local calendar date as YYYY-MM-DD. Must NOT use toISOString() — that returns the
// UTC date, which is the previous day for timezones ahead of UTC (e.g. NZ UTC+12/13),
// so new treatments/appointments were being dated to "yesterday".
function todayISO() {
  const d = new Date();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${d.getFullYear()}-${m}-${day}`;
}

// ----- Backup recency (device-local; NOT part of the exported data blob) -----
// Records when a backup was last successfully exported or imported on THIS device,
// so we can warn when records exist only here and haven't been copied off lately.
const LAST_BACKUP_KEY = 'drwessels_last_backup';
function markBackupNow() { try { localStorage.setItem(LAST_BACKUP_KEY, new Date().toISOString()); } catch (e) {} }
function daysSinceBackup() {
  const v = localStorage.getItem(LAST_BACKUP_KEY);
  if (!v) return null;                       // never backed up on this device
  const t = new Date(v).getTime();
  if (isNaN(t)) return null;
  return Math.floor((Date.now() - t) / 86400000);
}
// Human phrasing for "how long ago", given the day count from daysSinceBackup().
function backupAgePhrase(days) {
  if (days === null) return 'never';
  if (days <= 0) return 'today';
  if (days === 1) return 'yesterday';
  return `${days} days ago`;
}
const BACKUP_STALE_DAYS = 7;  // show the Today banner once a backup is this old (or missing)

// Accent colour per product, used for the little bar in product breakdowns.
function productColor(p) {
  return { Botox: '#f59e0b', Xeomin: '#0ea5e9', Relfydess: '#8b5cf6', 'Botox Review': '#fcd34d', 'Xeomin Review': '#7dd3fc', 'Relfydess Review': '#c4b5fd', Filler: '#fb7185', SkinVive: '#14b8a6' }[p] || '#d6d3d1';
}

// [startISO, endISO] for a named preset range used by the EOD period summary.
function eodPresetRange(key) {
  const today = todayISO();
  if (key === 'today') return [today, today];
  if (key === '30d') {
    const d = new Date(); d.setDate(d.getDate() - 29);
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return [`${d.getFullYear()}-${m}-${day}`, today];
  }
  if (key === 'year') return [today.slice(0, 4) + '-01-01', today];
  if (key === 'all') {
    const dates = state.data.treatments.map(t => t.date).filter(Boolean).sort();
    return [dates[0] || today.slice(0, 7) + '-01', today];
  }
  // default: this calendar month
  return [today.slice(0, 7) + '-01', today];
}

function formatDate(iso, style = 'short') {
  if (!iso) return '';
  const d = new Date(iso);
  if (style === 'short') return d.toLocaleDateString('en-NZ', { day: 'numeric', month: 'short', year: '2-digit' });
  if (style === 'long') return d.toLocaleDateString('en-NZ', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  if (style === 'full') return d.toLocaleDateString('en-NZ', { day: 'numeric', month: 'long', year: 'numeric' });
  return d.toLocaleDateString('en-NZ');
}

function calculateAge(dob) {
  if (!dob) return '';
  const birth = new Date(dob);
  const now = new Date();
  let age = now.getFullYear() - birth.getFullYear();
  const m = now.getMonth() - birth.getMonth();
  if (m < 0 || (m === 0 && now.getDate() < birth.getDate())) age--;
  return age;
}

function monogram(first, last) {
  return ((first || '').charAt(0) + (last || '').charAt(0)).toUpperCase() || '?';
}

// ================================================================
//   PHOTO STORAGE — IndexedDB (large binary-capable)
// ================================================================
const PHOTO_DB_NAME = 'drwessels_photos';
const PHOTO_STORE = 'photos';
let _photoDB = null;

function openPhotoDB() {
  return new Promise((resolve, reject) => {
    if (_photoDB) { resolve(_photoDB); return; }
    const req = indexedDB.open(PHOTO_DB_NAME, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(PHOTO_STORE)) {
        db.createObjectStore(PHOTO_STORE);
      }
    };
    req.onsuccess = () => { _photoDB = req.result; resolve(_photoDB); };
    req.onerror = () => reject(req.error);
  });
}

async function savePhoto(id, dataUrl) {
  const db = await openPhotoDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(PHOTO_STORE, 'readwrite');
    tx.objectStore(PHOTO_STORE).put(dataUrl, id);
    tx.oncomplete = () => resolve(id);
    tx.onerror = () => reject(tx.error);
  });
}

async function getPhoto(id) {
  if (!id) return null;
  const db = await openPhotoDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(PHOTO_STORE, 'readonly');
    const req = tx.objectStore(PHOTO_STORE).get(id);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}

async function deletePhoto(id) {
  if (!id) return;
  const db = await openPhotoDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(PHOTO_STORE, 'readwrite');
    tx.objectStore(PHOTO_STORE).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function clearAllPhotos() {
  const db = await openPhotoDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(PHOTO_STORE, 'readwrite');
    tx.objectStore(PHOTO_STORE).clear();
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function countPhotos() {
  try {
    const db = await openPhotoDB();
    return new Promise((resolve) => {
      const tx = db.transaction(PHOTO_STORE, 'readonly');
      const req = tx.objectStore(PHOTO_STORE).count();
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => resolve(0);
    });
  } catch { return 0; }
}

// Read every stored photo as an { id: dataUrl } map in ONE transaction — fast
// enough that the export's native share sheet still fires inside iOS's
// user-activation window. Used to bundle photos into a backup.
async function getAllPhotos() {
  const db = await openPhotoDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(PHOTO_STORE, 'readonly');
    const store = tx.objectStore(PHOTO_STORE);
    const keysReq = store.getAllKeys();
    const valsReq = store.getAll();
    let keys = null, vals = null;
    const tryFinish = () => {
      if (keys === null || vals === null) return;
      const out = {};
      for (let i = 0; i < keys.length; i++) out[String(keys[i])] = vals[i];
      resolve(out);
    };
    keysReq.onsuccess = () => { keys = keysReq.result; tryFinish(); };
    valsReq.onsuccess = () => { vals = valsReq.result; tryFinish(); };
    tx.onerror = () => reject(tx.error);
  });
}

// Compress photo to ~1200px on longest edge, JPEG 85% quality
// Keeps photos under ~300KB each - thousands fit easily in IndexedDB
function compressPhoto(file) {
  return new Promise((resolve, reject) => {
    if (!file) { reject(new Error('No file provided')); return; }
    if (!file.type || !file.type.startsWith('image/')) {
      reject(new Error('Not an image file'));
      return;
    }

    // Safety timeout — if something stalls, fail after 30s
    const timeout = setTimeout(() => reject(new Error('Photo processing timed out')), 30000);

    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        try {
          const maxEdge = 1200;
          let w = img.width, h = img.height;
          if (!w || !h) throw new Error('Image has invalid dimensions');
          if (w > h && w > maxEdge) { h = Math.round(h * maxEdge / w); w = maxEdge; }
          else if (h > maxEdge) { w = Math.round(w * maxEdge / h); h = maxEdge; }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          if (!ctx) throw new Error('Could not get canvas context');
          ctx.drawImage(img, 0, 0, w, h);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
          if (!dataUrl || dataUrl.length < 100) throw new Error('Compression produced empty result');
          clearTimeout(timeout);
          resolve(dataUrl);
        } catch (err) {
          clearTimeout(timeout);
          reject(err);
        }
      };
      img.onerror = () => {
        clearTimeout(timeout);
        reject(new Error('Could not decode image — the file may be corrupted'));
      };
      img.src = e.target.result;
    };
    reader.onerror = () => {
      clearTimeout(timeout);
      reject(new Error('Could not read file'));
    };
    try {
      reader.readAsDataURL(file);
    } catch (err) {
      clearTimeout(timeout);
      reject(err);
    }
  });
}
