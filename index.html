// ================================================================
//   APP STATE
// ================================================================
const state = {
  data: loadData(),
  view: 'today',     // 'today' | 'clients' | 'eod' | 'settings' | 'new-client' | 'profile' | 'treatment' | 'rates' | 'schedule' | 'appt-form'
  selectedClientId: null,
  selectedTreatmentId: null,
  editClientId: null,   // when set, the new-client form edits this client instead of creating one
  editApptId: null,     // when set, the appointment form edits this appointment instead of creating one
  dayDate: null,        // day shown on the Today/day view (ISO); null = today. The Today tab resets it to today.
  eodStart: null,       // End-of-Day period summary range start (ISO); null = default (this month)
  eodEnd: null          // End-of-Day period summary range end (ISO); null = today
};

function setView(view, params = {}) {
  // Leaving the treatment editor for another view. An existing treatment
  // auto-saves its edits (the form DOM is still mounted here, so live field
  // values are captured). A new/unsaved treatment is discarded as a cancel —
  // and any photo it wrote to IndexedDB but never committed is cleaned up.
  // (The Save and Delete handlers null _txDraft first, so this is a no-op then.)
  if (state.view === 'treatment' && view !== 'treatment') {
    const draft = window._txDraft;
    if (draft && draft.id !== 'new' && draft._dirty) {
      commitTreatmentDraft(draft);   // existing treatment with real edits → auto-save
      window._txDraft = null;
    } else {
      cleanupAbandonedDraft();        // new (cancel) or unchanged existing → just drop; clean any orphan photo
    }
  }
  // Leaving the client form discards any pending edit target (the Edit button and
  // the "+" set this explicitly on entry, so it's always correct there).
  if (view !== 'new-client') state.editClientId = null;
  // Same for the appointment form (set explicitly when opening to add/edit).
  if (view !== 'appt-form') state.editApptId = null;
  // Opening End of Day always starts fresh on the current month; in-page date
  // changes only re-render, so the chosen range still persists while you're there.
  if (view === 'eod') { state.eodStart = null; state.eodEnd = null; }
  state.view = view;
  if (params.clientId !== undefined) state.selectedClientId = params.clientId;
  if (params.treatmentId !== undefined) state.selectedTreatmentId = params.treatmentId;
  render();
  document.querySelector('.screen')?.scrollTo(0, 0);
}

// The photos currently persisted for a treatment (each slot null for new/unsaved
// ones). Edits happen on a draft, so the saved record still holds the committed
// images — used to know which images to preserve vs. clean up.
function committedPhotos(id) {
  const rec = state.data.treatments.find(x => x.id === id);
  return (rec && rec.photos) ? rec.photos : {};
}
function committedSlotPhotoId(id, slot) {
  return committedPhotos(id)[slot] || null;
}

// A saved treatment nulls out _txDraft itself (see the Save handler), so a
// surviving draft here means the user navigated away without saving. Discard it
// and delete any photo (in any slot) written this session that was never
// committed. The treatment's already-committed images are left untouched.
function cleanupAbandonedDraft() {
  const draft = window._txDraft;
  window._txDraft = null;
  if (!draft || !draft.photos) return;
  const committed = committedPhotos(draft.id);
  for (const s of PHOTO_SLOTS) {
    const id = draft.photos[s.key];
    if (id && id !== committed[s.key]) deletePhoto(id).catch(() => {});
  }
}

// Build a persisted record from an in-progress draft plus the live form fields,
// and commit it to state.data.treatments. Shared by the Save button and by
// auto-save when leaving an existing treatment. Reads tx-notes/tx-batch/
// tx-reconDate from the DOM when mounted, falling back to the draft otherwise.
// Cleans up a previously-committed photo that's been replaced/removed.
// Returns the saved record.
function commitTreatmentDraft(draft) {
  const isMl = isMlProduct(draft.product);
  const isFlat = isFlatFeeProduct(draft.product);
  const standardAreas = isMl ? [mlAreaName(draft.product)] : ['Glabella', 'Frontalis', "Crow's feet", 'Masseters'];
  let totalUnits = 0;
  if (!isFlat) {
    totalUnits = standardAreas.reduce((s, k) => s + (parseFloat(draft.areas?.[k]) || 0), 0);
    if (!isMl && Array.isArray(draft.others)) {
      totalUnits += draft.others.reduce((s, o) => s + (parseFloat(o.units) || 0), 0);
    }
  }
  const rateInfo = getEffectiveRate(draft.clientId, draft.product);
  const rate = draft.rateOverride !== null && draft.rateOverride !== undefined ? draft.rateOverride : rateInfo.rate;

  const notesEl = document.getElementById('tx-notes');
  const batchEl = document.getElementById('tx-batch');
  const reconEl = document.getElementById('tx-reconDate');
  const dateEl = document.getElementById('tx-date');

  const record = {
    ...draft,
    date: (dateEl && dateEl.value) ? dateEl.value : (draft.date || todayISO()),
    totalUnits,
    rate,
    totalCharge: isFlat ? rate : totalUnits * rate,
    notes: notesEl ? notesEl.value : (draft.notes || ''),
    batchNumber: batchEl ? batchEl.value : (draft.batchNumber || ''),
    reconstitutionDate: reconEl ? reconEl.value : (draft.reconstitutionDate || ''),
    photos: {
      before:    draft.photos?.before    || null,
      treatment: draft.photos?.treatment || null,
      review:    draft.photos?.review    || null,
      dynamic:   draft.photos?.dynamic   || null
    },
    strokes: draft.strokes || [],
    others: (draft.others || []).filter(o => o.label || o.units)
  };
  delete record._photoChanged;
  delete record._eraseMode;
  delete record._dirty;
  delete record._review;  // the review draft is persisted as its own linked record (below)
  delete record.photoId; // drop any legacy single-photo field

  const prevPhotos = committedPhotos(draft.id);
  if (draft.id === 'new') {
    record.id = uid();
    state.data.treatments.push(record);
  } else {
    const idx = state.data.treatments.findIndex(x => x.id === draft.id);
    if (idx >= 0) state.data.treatments[idx] = record;
    else state.data.treatments.push(record);
  }
  // Any previously-committed image now unreferenced (replaced/removed) is orphaned — delete it.
  for (const s of PHOTO_SLOTS) {
    const prev = prevPhotos[s.key];
    if (prev && prev !== record.photos[s.key]) deletePhoto(prev).catch(() => {});
  }

  // --- Linked review record (a separate $0-charge follow-up treatment) ---
  // The Review column on the treatment page is saved as its OWN treatment record
  // (product 'X Review', reviewOf=this id, its own ~2-week-later date). Keeping it
  // separate means the Summary/profit/timeline need no changes — a $0-charge review
  // already counts its product as a small cost/loss (see lineCostProfit).
  const rev = draft._review;
  const existingReview = state.data.treatments.find(x => x.reviewOf === record.id);
  if (rev && rev.product) {
    const rAreas = {
      Glabella: parseFloat(rev.areas?.Glabella) || 0,
      Frontalis: parseFloat(rev.areas?.Frontalis) || 0,
      "Crow's feet": parseFloat(rev.areas?.["Crow's feet"]) || 0,
      Masseters: parseFloat(rev.areas?.Masseters) || 0
    };
    // Review "other areas" reuse the treatment's labels, aligned by row index.
    const rOthers = (record.others || []).map((o, i) => ({ label: o.label, units: parseFloat(rev.others?.[i]) || 0 }))
      .filter(o => o.units > 0);
    const reviewUnits = Object.values(rAreas).reduce((s, n) => s + n, 0) + rOthers.reduce((s, o) => s + o.units, 0);
    const reviewRecord = {
      id: existingReview ? existingReview.id : uid(),
      clientId: record.clientId,
      reviewOf: record.id,
      product: rev.product,
      date: rev.date || addDaysISO(record.date, 14),
      areas: rAreas,
      others: rOthers,
      totalUnits: reviewUnits,
      rate: 0,
      totalCharge: 0,
      notes: '',
      photos: { before: null, treatment: null, review: null, dynamic: null },
      strokes: []
    };
    if (existingReview) {
      const ri = state.data.treatments.findIndex(x => x.id === existingReview.id);
      state.data.treatments[ri] = reviewRecord;
    } else {
      state.data.treatments.push(reviewRecord);
    }
  } else if (existingReview) {
    // Review set back to "None" → drop the linked record.
    state.data.treatments = state.data.treatments.filter(x => x.id !== existingReview.id);
  }

  saveData();
  return record;
}

// Best-effort save when the page is hidden or closed mid-edit. iOS Safari rarely
// fires 'beforeunload', so we also listen for 'pagehide' and 'visibilitychange'.
// Only a dirty EXISTING draft is committed (new treatments still cancel). The
// record + photoId are written synchronously to localStorage via saveData(), so
// they survive even a hard close; the photo image is already in IndexedDB. Only
// the async orphan cleanup (deletePhoto) may not finish on close — a minor
// storage leak, not data loss. The draft is left editable in case the page
// resumes (e.g. the user switches back from another app).
function commitDirtyDraftNow() {
  const draft = window._txDraft;
  if (draft && draft.id !== 'new' && draft._dirty) {
    commitTreatmentDraft(draft);
    draft._dirty = false; // committed; re-dirties if editing continues
  }
}
window.addEventListener('pagehide', commitDirtyDraftNow);
window.addEventListener('beforeunload', commitDirtyDraftNow);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') commitDirtyDraftNow();
});

function getClient(id) { return state.data.clients.find(c => c.id === id); }
function getClientTreatments(id) {
  return state.data.treatments
    .filter(t => t.clientId === id)
    .sort((a, b) => b.date.localeCompare(a.date));
}

// ----- Duplicate-client detection & merge -----
// Appointment / Excel imports auto-create name-only clients, so the same person
// can end up with several records. These helpers find clients sharing a name and
// merge them into one, reassigning treatments and filling in any missing details.
function normalizeClientName(c) {
  return `${c.firstName || ''} ${c.lastName || ''}`.trim().replace(/\s+/g, ' ').toLowerCase();
}
function findDuplicateClientGroups() {
  const map = new Map();
  for (const c of state.data.clients) {
    const key = normalizeClientName(c);
    if (!key) continue;                       // skip blank-name records
    if (!map.has(key)) map.set(key, []);
    map.get(key).push(c);
  }
  return [...map.values()].filter(g => g.length >= 2);
}
// Edit distance, capped: anything needing >2 edits returns a big number (early-out).
function levenshtein(a, b) {
  const m = a.length, n = b.length;
  if (Math.abs(m - n) > 2) return 99;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
// Two normalized names look like the SAME person spelt differently — a single typo
// (edit distance 1, e.g. "anna hay"/"anna hey", "annie wan"/"annie wang") or an
// abbreviation/truncation (same first word, each shorter token a prefix of the
// aligned one, e.g. "ada e"/"ada echetebu", "kate fielding"/"kate fielding 27").
function namesSimilar(a, b) {
  if (a === b || Math.min(a.length, b.length) < 5) return false;
  if (levenshtein(a, b) <= 1) return true;
  const ta = a.split(' '), tb = b.split(' ');
  if (ta[0] === tb[0]) {
    const [s, l] = ta.length <= tb.length ? [ta, tb] : [tb, ta];
    if (s.length >= 2 && s.every((t, i) => l[i] && l[i].startsWith(t))) return true;
  }
  return false;
}
// Groups of clients whose names are SIMILAR but not identical (so the exact-match
// finder misses them). Clusters near-duplicate names (union-find), bucketed by first
// letter for speed, and returns the clients behind each cluster of ≥2 distinct names.
function findSimilarClientGroups() {
  const byName = new Map();
  for (const c of state.data.clients) {
    const k = normalizeClientName(c);
    if (!k) continue;
    if (!byName.has(k)) byName.set(k, []);
    byName.get(k).push(c);
  }
  const names = [...byName.keys()];
  const buckets = new Map();
  for (const nm of names) { const b = nm[0]; if (!buckets.has(b)) buckets.set(b, []); buckets.get(b).push(nm); }
  const parent = new Map(names.map(n => [n, n]));
  const find = x => { while (parent.get(x) !== x) { parent.set(x, parent.get(parent.get(x))); x = parent.get(x); } return x; };
  for (const list of buckets.values()) {
    for (let i = 0; i < list.length; i++)
      for (let j = i + 1; j < list.length; j++)
        if (namesSimilar(list[i], list[j])) { const ra = find(list[i]), rb = find(list[j]); if (ra !== rb) parent.set(ra, rb); }
  }
  const clusters = new Map();
  for (const nm of names) { const r = find(nm); if (!clusters.has(r)) clusters.set(r, []); clusters.get(r).push(nm); }
  const groups = [];
  for (const cl of clusters.values()) {
    if (cl.length < 2) continue;                       // only clusters spanning ≥2 distinct spellings
    const members = cl.flatMap(nm => byName.get(nm));
    if (members.length >= 2) groups.push(members);
  }
  return groups;
}
// "Most complete" record — used to pre-select which one to keep.
function clientCompletenessScore(c) {
  return (c.dob ? 1 : 0) + (c.phone ? 1 : 0) + (c.allergies ? 1 : 0)
    + (c.notes ? 1 : 0) + (c.consentPhotoId ? 1 : 0)
    + getClientTreatments(c.id).length * 2;
}
// Merge dupIds into primaryId: move treatments, fill empty fields, keep earliest
// "client since", adopt a consent photo only if the primary has none, drop the rest.
function mergeClients(primaryId, dupIds) {
  const primary = getClient(primaryId);
  if (!primary) return;
  for (const dupId of dupIds) {
    const dup = getClient(dupId);
    if (!dup || dup.id === primaryId) continue;
    // Reassign every treatment from the duplicate onto the primary.
    state.data.treatments.forEach(t => { if (t.clientId === dupId) t.clientId = primaryId; });
    // Fill any blank field on the primary from the duplicate (primary wins when both set).
    ['firstName', 'lastName', 'dob', 'phone', 'allergies', 'notes'].forEach(f => {
      if (!primary[f] && dup[f]) primary[f] = dup[f];
    });
    // Per-product client rate overrides: keep primary's, add any it's missing.
    if (dup.rates) {
      primary.rates = primary.rates || {};
      for (const [p, r] of Object.entries(dup.rates)) if (primary.rates[p] == null) primary.rates[p] = r;
    }
    if (dup.clientSince && (!primary.clientSince || dup.clientSince < primary.clientSince)) {
      primary.clientSince = dup.clientSince;
    }
    // Consent photo: adopt the dup's only if the primary has none; otherwise the
    // dup's image is now unreferenced — delete it so it doesn't orphan in IndexedDB.
    if (!primary.consentPhotoId && dup.consentPhotoId) {
      primary.consentPhotoId = dup.consentPhotoId;
    } else if (dup.consentPhotoId && dup.consentPhotoId !== primary.consentPhotoId) {
      deletePhoto(dup.consentPhotoId).catch(() => {});
    }
    state.data.clients = state.data.clients.filter(c => c.id !== dupId);
  }
  saveData();
}
function getEffectiveRate(clientId, product) {
  const client = getClient(clientId);
  const clinic = state.data.clinicRates[product];
  if (client?.rates?.[product]) {
    return { rate: client.rates[product], source: 'client', clinicDefault: clinic.rate };
  }
  return { rate: clinic.rate, source: 'clinic', clinicDefault: clinic.rate };
}

// ================================================================
//   VIEWS
// ================================================================

function render() {
  const app = document.getElementById('app');
  let html = '';
  // tabActive: which tab to highlight, or null for views that have no menu.
  // The menu is rendered ABOVE the scrolling .screen so it sits pinned at the top.
  let tabActive = null;
  const v = state.view;
  if (v === 'today') { html = viewToday(); tabActive = 'today'; }
  else if (v === 'clients') { html = viewClients(); tabActive = 'clients'; }
  else if (v === 'eod') { html = viewEndOfDay(); tabActive = 'eod'; }
  else if (v === 'settings') { html = viewSettings(); tabActive = ''; }
  else if (v === 'new-client') html = viewNewClient();
  else if (v === 'profile') { html = viewProfile(); tabActive = 'clients'; }
  else if (v === 'treatment') html = viewTreatment();
  else if (v === 'rates') html = viewRates();
  else if (v === 'schedule') html = viewSchedule();
  else if (v === 'appt-form') html = viewAppointmentForm();
  else { html = viewToday(); tabActive = 'today'; }

  app.innerHTML = (tabActive !== null ? tabBar(tabActive) : '') + html;
  attachHandlers();
  loadPhotoThumbnails();
}

// Populate every <img data-photo-id> on the current view from IndexedDB
// (timeline thumbnails AND client-list avatars), drawing injection-site marks on
// a paired <canvas data-strokes> when present. Runs after each render.
function loadPhotoThumbnails() {
  document.querySelectorAll('img[data-photo-id]').forEach(async (img) => {
    const id = img.dataset.photoId;
    try {
      const dataUrl = await getPhoto(id);
      if (dataUrl) {
        img.src = dataUrl;
        img.onload = () => {
          // Draw strokes on the paired canvas, if any
          const canvas = img.parentElement?.querySelector('canvas[data-strokes]');
          if (!canvas) return;
          let strokes = [];
          try { strokes = JSON.parse(canvas.dataset.strokes.replace(/&#39;/g, "'")); } catch {}
          if (!strokes.length) return;
          const rect = canvas.getBoundingClientRect();
          const dpr = window.devicePixelRatio || 1;
          canvas.width = rect.width * dpr;
          canvas.height = rect.height * dpr;
          const ctx = canvas.getContext('2d');
          ctx.scale(dpr, dpr);
          ctx.strokeStyle = '#000';
          ctx.lineWidth = 1.2; // thinner on thumbnail
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          for (const stroke of strokes) {
            if (!stroke.points || stroke.points.length < 2) continue;
            ctx.beginPath();
            const first = stroke.points[0];
            ctx.moveTo(first.x * rect.width, first.y * rect.height);
            for (let i = 1; i < stroke.points.length; i++) {
              ctx.lineTo(stroke.points[i].x * rect.width, stroke.points[i].y * rect.height);
            }
            ctx.stroke();
          }
        };
      }
    } catch (e) { /* ignore */ }
  });
}

// One appointment row: a big tap-to-start-treatment button plus an edit pencil
// (which opens the appointment form). Shared by the Today day view and the full
// Schedule, with slightly different sizing for each.
function apptRowHTML(a, opts = {}) {
  const timeWidth = opts.timeWidth || 72;
  const timeSize = opts.timeSize || 16;
  const nameSize = opts.nameSize || 22;
  const meta = escapeHtml([a.treatment, a.notes].filter(Boolean).join('  ·  ')) || '—';
  return `
    <div class="list-item">
      <button class="appt-start" data-appt-id="${a.id}">
        <div style="width:${timeWidth}px;flex-shrink:0;font-size:${timeSize}px;font-weight:600;color:#92400e;">${escapeHtml(a.time) || '—'}</div>
        <div class="list-content">
          <div class="list-name" style="font-size:${nameSize}px;">${escapeHtml(a.name)}</div>
          <div class="list-meta">${meta}</div>
        </div>
      </button>
      <button class="appt-edit-btn" data-appt-edit="${a.id}" aria-label="Edit appointment">${I.pencil}</button>
    </div>
  `;
}

// Amber "back up your records" banner for the Today screen — shown only when
// there are records on this device and no backup has been made recently (data
// lives only in this browser, so a stale-or-missing backup is the real risk).
function backupBannerHTML() {
  const hasData = state.data.clients.length > 0 || state.data.treatments.length > 0;
  if (!hasData) return '';
  const days = daysSinceBackup();
  if (days !== null && days < BACKUP_STALE_DAYS) return '';
  const msg = days === null
    ? 'Your records exist only on this iPad. Export a backup to keep them safe.'
    : `Last backup ${backupAgePhrase(days)}. Export a fresh copy to keep your records safe.`;
  return `
    <div class="px-6" style="padding-top:12px;">
      <div class="notice warn" style="margin-bottom:0;align-items:flex-start;">
        ${I.alert}
        <div style="flex:1;">
          ${msg}
          <button class="action" data-nav="settings" style="display:block;margin-top:6px;color:#92400e;font-weight:700;font-size:13px;letter-spacing:.04em;padding:0;">Back up now →</button>
        </div>
      </div>
    </div>
  `;
}

// ---------- TODAY / DAY VIEW ----------
// The Today tab is a day view: pick any date and see that day's appointments
// (tap one to start its treatment) plus any treatments recorded that day.
// Defaults to today; the chosen day lives in state.dayDate and the Today tab
// resets it to today.
function viewToday() {
  const day = state.dayDate || todayISO();
  const isToday = day === todayISO();
  const dayTreatments = state.data.treatments.filter(t => t.date === day);
  const dayAppts = (state.data.appointments || [])
    .filter(a => a.date === day)
    .slice()
    .sort(byApptTime);
  const totalBilled = dayTreatments.reduce((sum, t) => sum + (t.totalCharge || 0), 0);
  const clientCount = state.data.clients.length;
  const hasAnyAppts = (state.data.appointments || []).length > 0;

  return `
    <div class="screen today-screen cream-screen">
      <div class="page-header">
        <div class="date">${formatDate(day, 'long')}</div>
        <div class="flex items-center justify-between">
          <h1>${isToday ? 'Today' : 'Schedule'}</h1>
          <button class="action" data-nav="settings" style="font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:#92400e;font-weight:500;padding:4px 8px;">Settings</button>
        </div>
        <div class="input-with-icon" style="margin-top:12px;">
          ${I.calendar}
          <input type="date" id="day-date" class="input" value="${day}" style="font-weight:600;">
        </div>
        <div class="stats" style="margin-top:14px;">
          <div class="stat"><div class="n">${dayAppts.length}</div><div class="l">Booked</div></div>
          <div class="stat"><div class="n">${dayTreatments.length}</div><div class="l">Done</div></div>
          <div class="stat amber"><div class="n">$${totalBilled.toFixed(0)}</div><div class="l">Billed</div></div>
        </div>
      </div>

      <div class="screen-body">
        ${backupBannerHTML()}
        <div class="px-6" style="padding-top:12px;display:flex;align-items:baseline;justify-content:space-between;">
          <div class="label">Appointments</div>
          <div style="display:flex;align-items:baseline;gap:16px;">
            <button class="action" data-appt-new style="font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:#92400e;font-weight:600;padding:2px 0;">+ Add</button>
            ${hasAnyAppts ? `<button class="action" data-nav="schedule" style="font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:#92400e;font-weight:500;padding:2px 0;">All days →</button>` : ''}
          </div>
        </div>
        ${dayAppts.length ? dayAppts.map(a => apptRowHTML(a, { timeWidth: 72, timeSize: 16, nameSize: 24 })).join('') : `
          <div class="empty" style="padding:24px;">
            <div class="empty-body">No appointments ${isToday ? 'today' : 'for this day'}. Tap <strong>+ Add</strong> above${hasAnyAppts ? '' : ' or import day sheets in Settings'}.</div>
          </div>
        `}

        ${dayTreatments.length ? `
          <div class="px-6" style="padding-top:20px;"><div class="label mb-2">Recorded treatments</div></div>
          ${dayTreatments.map(t => {
            const c = getClient(t.clientId);
            const photoId = c ? clientLastPhotoId(c.id) : null;
            return `
              <button class="list-item" style="width:100%;text-align:left;" data-nav="treatment" data-id="${t.id}">
                <div class="avatar">${photoId ? `<img alt="" data-photo-id="${photoId}">` : (c ? monogram(c.firstName, c.lastName) : '?')}</div>
                <div class="list-content">
                  <div class="list-name">${c ? `${c.firstName} ${c.lastName}` : 'Unknown'}</div>
                  <div class="list-meta">${t.product}${isFlatFeeProduct(t.product) ? '' : ` · ${t.totalUnits}${isMlProduct(t.product)?'ml':'u'}`} · $${(t.totalCharge||0).toFixed(0)}</div>
                </div>
                ${I.chevronRight}
              </button>
            `;
          }).join('')}
          ${isToday ? `<div style="padding:24px;">
            <button class="btn btn-dark" style="width:100%;" data-nav="eod">End of Day Summary →</button>
          </div>` : ''}
        ` : ''}

        <div style="padding:24px 24px 40px;" class="text-center">
          <div style="font-size:13px;color:#a8a29e;font-family:'Cormorant Garamond',serif;font-style:italic;">
            ${clientCount} client${clientCount === 1 ? '' : 's'} in database
          </div>
        </div>
      </div>
    </div>
  `;
}

// ---------- CLIENTS ----------
// The client's most recent photo (newest treatment first; prefer Treatment, then
// Before, then review). Null if the client has no photos — caller falls back to initials.
function clientLastPhotoId(clientId) {
  for (const tx of getClientTreatments(clientId)) {
    const p = tx.photos || {};
    const id = p.treatment || p.before || p.review;
    if (id) return id;
  }
  return null;
}

// Core intake fields the relaxed new-client form lets you skip. Used to flag
// clients (e.g. name-only imports) that still need details filled in.
function missingClientFields(c) {
  const m = [];
  if (!c.dob) m.push('date of birth');
  if (!(c.phone && c.phone.trim())) m.push('phone');
  if (!(c.allergies && c.allergies.trim())) m.push('allergies');
  return m;
}
function isClientIncomplete(c) { return missingClientFields(c).length > 0; }

function viewClients() {
  // Alphabetical by surname first, then first name. Displayed surname-first
  // ("Lastname, Firstname") so the list reads A→Z by surname.
  const clients = [...state.data.clients].sort((a, b) => {
    const an = `${a.lastName} ${a.firstName}`.trim().toLowerCase();
    const bn = `${b.lastName} ${b.firstName}`.trim().toLowerCase();
    return an.localeCompare(bn);
  });

  // Section letter for grouping/jumping: surname initial (or first name for
  // single-name clients); non-letters bucket under '#'. The list is already
  // sorted by that key, so a running-letter check yields the section breaks.
  const sectionLetter = (c) => {
    const k = (c.lastName || c.firstName || '').trim();
    const ch = k ? k[0].toUpperCase() : '';
    return /[A-Z]/.test(ch) ? ch : '#';
  };
  const presentLetters = new Set(clients.map(sectionLetter));
  const railLetters = (presentLetters.has('#') ? ['#'] : []).concat('ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split(''));
  const railHtml = `<div class="az-rail">${railLetters.map(L => {
    const on = presentLetters.has(L);
    return `<button class="az-letter${on ? '' : ' az-off'}"${on ? ` data-jump="${L}"` : ' disabled'} aria-label="Jump to ${L}">${L}</button>`;
  }).join('')}</div>`;

  let _lastLetter = null;
  const clientsHtml = clients.map(c => {
    const last = state.data.treatments
      .filter(t => t.clientId === c.id)
      .sort((a, b) => b.date.localeCompare(a.date))[0];
    const txCount = state.data.treatments.filter(t => t.clientId === c.id).length;
    const photoId = clientLastPhotoId(c.id);
    const searchStr = `${c.firstName || ''} ${c.lastName || ''} ${c.phone || ''}`.toLowerCase();
    const letter = sectionLetter(c);
    const header = letter !== _lastLetter ? `<div class="cl-sec" id="cl-sec-${letter}">${letter}</div>` : '';
    _lastLetter = letter;
    return header + `
            <button class="list-item" style="width:100%;text-align:left;" data-nav="profile" data-id="${c.id}" data-search="${escapeHtml(searchStr)}">
              <div class="avatar">${photoId ? `<img alt="" data-photo-id="${photoId}">` : monogram(c.firstName, c.lastName)}</div>
              <div class="list-content">
                <div class="list-name">${c.lastName ? `${c.lastName}, ${c.firstName}` : c.firstName}${isClientIncomplete(c) ? `<span class="badge-incomplete">Incomplete</span>` : ''}</div>
                <div class="list-meta">
                  ${last ? `Last: ${formatDate(last.date)}` : 'No treatments yet'}
                  <span class="dot"></span>${txCount} tx
                </div>
              </div>
              ${I.chevronRight}
            </button>`;
  }).join('');

  return `
    <div class="screen cream-screen">
      <div class="page-header">
        <div class="flex items-center justify-between" style="margin-bottom:16px;">
          <div>
            <div class="date">Database</div>
            <h1>Clients</h1>
          </div>
          <button class="icon-btn" data-nav="new-client">${I.plus}</button>
        </div>
        <div class="input-with-icon">
          ${I.search}
          <input class="input" placeholder="Search ${clients.length} client${clients.length===1?'':'s'}" id="client-search" type="search">
        </div>
      </div>

      <div class="screen-body" id="client-list">
        ${clients.length === 0 ? `
          <div class="empty">
            ${I.user}
            <div class="empty-title" style="margin-top:12px;">No clients yet</div>
            <div class="empty-body">Tap the <strong>+</strong> button above to add your first client.</div>
          </div>
        ` : clientsHtml}
      </div>
      ${clients.length ? railHtml : ''}
    </div>
  `;
}

// ---------- PROFILE ----------
function viewProfile() {
  const c = getClient(state.selectedClientId);
  if (!c) { setView('clients'); return ''; }

  const treatments = getClientTreatments(c.id);
  const totalUnits = treatments.filter(t => !isMlProduct(t.product)).reduce((s, t) => s + (t.totalUnits || 0), 0);
  // Per-toxin breakdown (session count + average units) for the summary box.
  const toxinStats = ['Botox', 'Xeomin', 'Relfydess', 'Botox Review', 'Xeomin Review', 'Relfydess Review'].map(name => {
    const txs = treatments.filter(t => t.product === name);
    const units = txs.reduce((s, t) => s + (t.totalUnits || 0), 0);
    return { name, count: txs.length, avg: txs.length ? Math.round(units / txs.length) : 0 };
  });

  const customRates = c.rates && Object.keys(c.rates).length > 0
    ? Object.entries(c.rates).map(([p, r]) => `${p} $${r}/${state.data.clinicRates[p].label}`).join(', ')
    : 'Using clinic defaults';

  return `
    <div class="screen cream-screen">
      <div class="top-bar">
        <button class="back" data-nav="clients">${I.chevronLeft}</button>
        <div class="title">Client</div>
        <div style="display:flex;gap:2px;">

          <div style="flex:1;min-width:0;">
            <h1 class="serif" style="font-size:32px;font-weight:400;line-height:1.08;">${c.firstName}<br>${c.lastName}</h1>

        <input type="file" id="consent-file-lib" accept="image/*" class="hidden">

        ${(() => {

              <div class="label" style="margin-top:2px;">Lifetime units</div>
            </div>
          </div>
          ${toxinStats.some(s => s.count) ? `
          <div style="margin-top:14px;padding-top:14px;border-top:1px solid #e7e5e4;display:flex;flex-direction:column;gap:9px;">
            ${toxinStats.filter(s => s.count).map(s => `
              <div class="flex items-center justify-between">
                <div style="font-weight:600;font-size:14px;color:#1c1917;">${s.name}</div>
                <div style="font-size:13px;color:#78716c;">${s.count} tx<span style="color:#d6d3d1;margin:0 8px;">·</span><span style="color:#1c1917;font-weight:500;">avg ${s.avg}u</span></div>

        ` : treatments.map((t, i) => {
          // The most recent toxin treatment gets a tappable "+ Review" chip that
          // starts a no-charge follow-up Review (pre-dated ~2 weeks later). Once a
          // review is recorded it becomes the most recent treatment — and a Review
          // product has no REVIEW_CHILD entry — so the chip naturally disappears.
          const reviewProduct = i === 0 ? REVIEW_CHILD[t.product] : null;
          // A nested <button> can't live inside a <button>, so the most recent
          // eligible row is a <div class="timeline-item"> (keeps the connector line
          // — it's still a non-last sibling) with the chip as a real button inside.
          const tag = reviewProduct ? 'div' : 'button';
          return `
          <${tag} class="timeline-item" style="width:100%;text-align:left;background:none;${reviewProduct ? 'cursor:pointer;' : ''}" data-nav="treatment" data-id="${t.id}">
            <div class="timeline-dot ${i===0?'latest':''}"></div>
            <div class="timeline-content">
              <div class="flex items-center justify-between" style="gap:8px;">
                <div class="timeline-date">${formatDate(t.date, 'full')}</div>
                ${reviewProduct ? `<button class="review-chip" data-review-from="${t.id}" style="flex-shrink:0;display:inline-flex;align-items:center;gap:4px;padding:5px 12px;border-radius:999px;background:#fef3c7;color:#92400e;font-size:13px;font-weight:700;border:1px solid #fcd34d;">+ Review</button>` : ''}
              </div>
              <div class="timeline-tx">${t.product}${isMlProduct(t.product) && (t.productDetail||'').trim() ? ` <span style="color:#78716c;">(${escapeHtml(t.productDetail.trim())})</span>` : ''} — <em>${isFlatFeeProduct(t.product) ? '$'+(t.totalCharge||0).toFixed(0) : t.totalUnits+(isMlProduct(t.product)?'ml':'u')}</em></div>
              <div class="timeline-areas">${describeAreas(t)}</div>
            </div>
            ${timelineThumbHTML(t)}
          </${tag}>
        `;}).join('')}
      </div>

      <button class="fab" data-nav="treatment" data-id="new">${I.plus}<span>New treatment</span></button>
    </div>
  `;
}

function describeAreas(t) {
  if (isFlatFeeProduct(t.product)) return '';   // flat-fee services have no injection areas
  if (!t.areas) return '';
  // Per-ml products (Filler/SkinVive) carry a single free-text area in t.areaLabel;
  // the units are stored under the fixed mlAreaName key.
  if (isMlProduct(t.product)) {
    const units = parseFloat(t.areas[mlAreaName(t.product)]) || 0;
    if (units <= 0) return 'No areas recorded';
    return (t.areaLabel || '').trim() || mlAreaName(t.product);
  }
  const parts = [];
  for (const [label, units] of Object.entries(t.areas || {})) {
    if (units && units > 0) parts.push(label);
  }
  return parts.join(', ') || 'No areas recorded';
}

// Markup for one photo slot in the treatment editor. Only the Treatment slot
// (slot.annotate) gets the canvas + pen/erase toolbar + show/hide marks.
function renderPhotoSlot(slot, t) {
  const id = (t.photos || {})[slot.key];
  const annotate = slot.annotate;
  let inner;
  if (id) {
    inner = `
      <div class="photo-stack"${annotate ? ` id="photo-stack-${slot.key}"` : ''}>
        <img id="photo-preview-${slot.key}" alt="${slot.label} photo">
        ${annotate ? `<canvas id="photo-canvas-${slot.key}"></canvas>` : ''}
      </div>
      ${annotate ? `
      <div class="photo-overlay top-left">
        <button class="photo-action" id="photo-toggle-marks" title="Show/hide marks">
          ${I.eye}<span id="marks-toggle-label">Hide marks</span>
        </button>
      </div>` : ''}
      <div class="photo-overlay">
        <button class="photo-action" data-photo-action="replace" data-slot="${slot.key}">
          ${I.camera}<span>Replace</span>
        </button>
        <button class="photo-action danger" data-photo-action="remove" data-slot="${slot.key}">
          ${I.trash}<span>Remove</span>
        </button>
      </div>
      ${annotate ? `
      <div class="photo-toolbar" id="photo-toolbar">
        <button class="tool-btn ${!t._eraseMode?'active':''}" id="tool-pen" title="Pen">${I.pencil}</button>
        <button class="tool-btn ${t._eraseMode?'active':''}" id="tool-erase" title="Erase">${I.eraser}</button>
        <div class="tool-divider"></div>
        <button class="tool-btn" id="tool-undo" title="Undo last stroke">${I.undo}</button>
        <button class="tool-btn" id="tool-clear" title="Clear all marks">${I.clear}</button>
      </div>` : ''}
    `;
  } else {
    inner = `
      <div class="photo-empty">
        ${I.camera}
        <div class="photo-empty-title">${slot.label}</div>
        <div class="photo-empty-hint">Tap below to take or choose</div>
        <div class="photo-btns">
          <button class="btn photo-take-btn" data-photo-action="take" data-slot="${slot.key}">
            ${I.camera}<span>Take photo</span>
          </button>
          <button class="btn photo-pick-btn" data-photo-action="pick" data-slot="${slot.key}">
            Choose from library
          </button>
        </div>
      </div>
    `;
  }
  return `
    <div class="amber-label" style="margin-bottom:6px;">${slot.label}</div>
    <div class="photo-area" id="photo-area-${slot.key}">${inner}</div>
    <input type="file" id="photo-cam-${slot.key}" data-slot="${slot.key}" accept="image/*" capture="environment" class="hidden">
    <input type="file" id="photo-lib-${slot.key}" data-slot="${slot.key}" accept="image/*" class="hidden">
  `;
}

// Representative thumbnail for the treatment-history timeline: prefer the
// annotated Treatment photo (with its marks), else Before, else review.
function timelineThumbHTML(t) {
  const p = t.photos || {};
  const showId = p.treatment || p.before || p.review;
  if (!showId) return '';
  const marks = (showId === p.treatment)
    ? `<canvas data-strokes='${JSON.stringify(t.strokes || []).replace(/'/g, "&#39;")}'></canvas>`
    : '';
  return `<div class="timeline-thumb"><img alt="" data-photo-id="${showId}">${marks}</div>`;
}

// ---------- TREATMENT DETAIL ----------
function viewTreatment() {
  const isNew = state.selectedTreatmentId === 'new' || !state.selectedTreatmentId;
  let t;
  let client;

  if (isNew) {
    client = getClient(state.selectedClientId);
    if (!client) { setView('clients'); return ''; }
    // Reuse the in-progress draft across re-renders so that edits — and a photo
    // that was just added (which calls render()) — survive. Only seed a fresh
    // draft when genuinely starting a new treatment for this client.
    if (window._txDraft && window._txDraft.id === 'new' && window._txDraft.clientId === client.id) {
      t = window._txDraft;
    } else {
      // Seed from last treatment for this client
      const lastTx = getClientTreatments(client.id)[0];
      t = {
        id: 'new',
        clientId: client.id,
        date: todayISO(),
        product: lastTx?.product || 'Botox',
        areas: lastTx ? { ...lastTx.areas } : { Glabella: 0, Frontalis: 0, "Crow's feet": 0, Masseters: 0 },
        others: lastTx?.others ? lastTx.others.map(o => ({ ...o })) : [
          { label: '', units: '' }, { label: '', units: '' }, { label: '', units: '' }
        ],
        areaLabel: lastTx?.areaLabel || '',
        productDetail: lastTx?.productDetail || '',
        rateOverride: null,
        notes: '',
        photos: { before: null, treatment: null, review: null, dynamic: null },
        strokes: []
      };
    }
  } else {
    const saved = state.data.treatments.find(x => x.id === state.selectedTreatmentId);
    if (!saved) { setView('today'); return ''; }
    // Edit a clone so field/photo/annotation changes only commit on Save — the
    // saved record stays untouched until then, so backing out discards
    // everything and leaves no orphaned photos. Reuse the clone across renders.
    if (window._txDraft && window._txDraft.id === saved.id) {
      t = window._txDraft;
    } else {
      t = JSON.parse(JSON.stringify(saved));
      // Load any linked review record into the editable review draft (2nd column).
      const linkedReview = state.data.treatments.find(x => x.reviewOf === saved.id);
      if (linkedReview) {
        t._review = {
          product: linkedReview.product,
          date: linkedReview.date,
          areas: {
            Glabella: linkedReview.areas?.Glabella || 0,
            Frontalis: linkedReview.areas?.Frontalis || 0,
            "Crow's feet": linkedReview.areas?.["Crow's feet"] || 0,
            Masseters: linkedReview.areas?.Masseters || 0
          },
          // Re-align the review's other-area units to this treatment's rows by label.
          others: (saved.others || []).map(o => {
            const m = (linkedReview.others || []).find(r => r.label === o.label);
            return m ? String(m.units) : '';
          })
        };
      } else if (window._pendingReviewProduct && ['Botox','Xeomin','Relfydess'].includes(saved.product)) {
        // Opened via the profile "+ Review" chip → pre-enable the review column.
        let d = addDaysISO(saved.date, 14);
        const today = todayISO();
        if (d > today) d = today;
        t._review = {
          product: window._pendingReviewProduct,
          date: d,
          areas: { Glabella: 0, Frontalis: 0, "Crow's feet": 0, Masseters: 0 },
          others: (saved.others || []).map(() => '')
        };
      }
    }
    window._pendingReviewProduct = null;
    client = getClient(t.clientId);
    if (!t.areas) t.areas = { Glabella: 0, Frontalis: 0, "Crow's feet": 0, Masseters: 0 };
  }

  // Store current editable state in a session object
  window._txDraft = t;

  // Always show at least 3 "Other areas" rows for editing. Saved records strip
  // empty rows (see saveTreatment ~"filter(o => o.label || o.units)"), so a NEW
  // treatment seeded from a prior visit that had none arrives with others:[] —
  // which would render the heading with no rows beneath it. Pad here so both new
  // and existing treatments always show editable rows.
  if (!Array.isArray(t.others)) t.others = [];
  while (t.others.length < 3) t.others.push({ label: '', units: '' });

  const isMl = isMlProduct(t.product);
  const isFlat = isFlatFeeProduct(t.product);
  const rateInfo = getEffectiveRate(client.id, t.product);
  const currentRate = t.rateOverride !== null && t.rateOverride !== undefined ? t.rateOverride : rateInfo.rate;
  const isOverridden = t.rateOverride !== null && t.rateOverride !== undefined;
  const hasClientRate = rateInfo.source === 'client';

  const standardAreas = isMl
    ? [{ name: mlAreaName(t.product), key: mlAreaName(t.product) }]
    : [
        { name: 'Glabella', key: 'Glabella' },
        { name: 'Frontalis', key: 'Frontalis' },
        { name: "Crow's feet", key: "Crow's feet" },
        { name: 'Masseters', key: 'Masseters' }
      ];

  // Flat-fee services (Keloid, Consultation) bill one per-session charge with no
  // unit counting; everything else bills total units × rate.
  let totalUnits = 0;
  if (!isFlat) {
    totalUnits = standardAreas.reduce((sum, a) => sum + (parseFloat(t.areas[a.key]) || 0), 0);
    if (!isMl) {
      totalUnits += (t.others || []).reduce((sum, o) => sum + (parseFloat(o.units) || 0), 0);
    }
  }
  const totalCharge = isFlat ? currentRate : totalUnits * currentRate;
  const unitLabel = isMl ? 'ml' : 'u';
  const photoCount = PHOTO_SLOTS.filter(s => (t.photos || {})[s.key]).length;

  // ---- Review (2-week follow-up) recorded alongside this treatment ----
  // Reviews apply to toxins only. The review is captured here in a second "Review"
  // units column but is stored as a SEPARATE linked treatment record (product
  // 'Botox Review' etc., $0 charge, its own date, reviewOf=<this id>) so the
  // Summary/profit/timeline all keep working unchanged (a $0-charge review already
  // shows its product cost as a small loss). t._review is the in-progress draft.
  const BASE_PRODUCTS = ['Botox', 'Xeomin', 'Relfydess', 'Filler', 'SkinVive', 'Keloid', 'Consultation'];
  const box1Options = BASE_PRODUCTS.includes(t.product) ? BASE_PRODUCTS : [...BASE_PRODUCTS, t.product];
  const isToxin = ['Botox', 'Xeomin', 'Relfydess'].includes(t.product);
  const showReviewControls = isToxin && !isReviewProduct(t.product);
  const reviewOn = showReviewControls && t._review && t._review.product;
  // Keep the review's "other areas" column aligned 1:1 with the treatment's rows.
  if (t._review) {
    if (!Array.isArray(t._review.others)) t._review.others = [];
    while (t._review.others.length < t.others.length) t._review.others.push('');
  }
  const reviewUnits = reviewOn
    ? standardAreas.reduce((s, a) => s + (parseFloat(t._review.areas?.[a.key]) || 0), 0)
      + (t._review.others || []).reduce((s, u) => s + (parseFloat(u) || 0), 0)
    : 0;

  return `
    <div class="screen tx-screen cream-screen">
      <div class="top-bar">
        <button class="back" data-nav="${isNew ? 'profile' : 'today'}" data-id="${client.id}">${I.chevronLeft}</button>
        <div class="title-center">
          <div class="title" style="font-size:24px;letter-spacing:0.04em;font-weight:700;">${client.firstName} ${client.lastName}${client.dob ? ` <span style="color:#78716c;font-weight:600;">(${calculateAge(client.dob)})</span>` : ''}</div>
          <div class="name">${formatDate(t.date, 'full')}</div>
        </div>
        <button class="action" id="save-tx">Save</button>
      </div>

      <div class="screen-body">
        <div id="save-tx-confirm" class="mx-6 mb-4" style="display:none;padding:14px;border:1px solid #fcd34d;background:#fffbeb;border-radius:12px;">
          <div style="font-size:14px;color:#78350f;font-weight:600;line-height:1.5;margin-bottom:12px;">This treatment has 0 units. Save anyway?</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
            <button class="btn" id="save-tx-cancel" style="background:#f5f5f4;color:#1c1917;font-weight:600;">Cancel</button>
            <button class="btn" id="save-tx-go" style="background:#92400e;color:#fafaf9;font-weight:600;">Save anyway</button>
          </div>
        </div>
        <div class="px-6 mb-4">
          <div class="${showReviewControls ? 'field-row' : ''}">
            <div>
              <div class="label mb-2">Product</div>
              <div style="position:relative;">
                <select class="input" id="product-select" style="appearance:none;-webkit-appearance:none;padding-right:40px;font-weight:700;">
                  ${box1Options.map(p => `
                    <option value="${p}" ${p===t.product?'selected':''}>${p}</option>
                  `).join('')}
                </select>
                <div style="position:absolute;right:16px;top:50%;transform:translateY(-50%);pointer-events:none;color:#a8a29e;">${I.chevronDown}</div>
              </div>
            </div>
            ${showReviewControls ? `
            <div>
              <div class="label mb-2">Review</div>
              <div style="position:relative;">
                <select class="input" id="review-select" style="appearance:none;-webkit-appearance:none;padding-right:40px;font-weight:700;">
                  <option value="" ${!reviewOn?'selected':''}>None</option>
                  ${REVIEW_PRODUCTS.map(p => `
                    <option value="${p}" ${(t._review&&t._review.product)===p?'selected':''}>${p}</option>
                  `).join('')}
                </select>
                <div style="position:absolute;right:16px;top:50%;transform:translateY(-50%);pointer-events:none;color:#a8a29e;">${I.chevronDown}</div>
              </div>
            </div>
            ` : ''}
          </div>
        </div>

        ${isMl ? `
        <div class="px-6 mb-4">
          <div class="label mb-2">Product used</div>
          <input type="text" class="input" id="tx-product-detail" value="${escapeHtml(t.productDetail||'')}" placeholder="e.g. Juvederm Voluma" autocapitalize="words">
        </div>
        ` : ''}

        <div class="px-6 mb-4">
          <div class="${reviewOn ? 'field-row' : ''}">
            <div>
              <div class="label mb-2">Treatment date</div>
              <input type="date" class="input" id="tx-date" value="${t.date || todayISO()}" max="${todayISO()}">
            </div>
            ${reviewOn ? `
            <div>
              <div class="label mb-2">Review date</div>
              <input type="date" class="input" id="tx-review-date" value="${t._review.date || todayISO()}" max="${todayISO()}">
            </div>
            ` : ''}
          </div>
        </div>

        ${!isFlat ? `
        <div class="px-6 mb-4">
          ${isMl ? `
            <div class="label mb-2">Batch number</div>
            <input type="text" class="input" id="tx-batch" value="${t.batchNumber||''}" placeholder="e.g. C2847" autocapitalize="characters">
          ` : `
            <div class="field-row">
              <div>
                <div class="label mb-2">Batch number</div>
                <input type="text" class="input" id="tx-batch" value="${t.batchNumber||''}" placeholder="e.g. C2847" autocapitalize="characters">
              </div>
              <div>
                <div class="label mb-2">Reconstitution</div>
                <input type="date" class="input" id="tx-reconDate" value="${t.reconstitutionDate||''}" max="${todayISO()}">
              </div>
            </div>
          `}
        </div>
        ` : ''}

        ${isNew && getClientTreatments(client.id).length > 0 ? `
          <div class="mx-6 notice ok">
            ${I.check}<span>Pre-filled from last visit (${formatDate(getClientTreatments(client.id)[0].date)}). Adjust as needed.</span>
          </div>
        ` : ''}

        <div class="mx-6 card mb-4">
          ${isFlat ? `
          <div class="billing" style="margin-top:0;padding-top:0;border-top:none;">
            <div class="flex items-center justify-between mb-3">
              <div class="amber-label">Flat fee — ${t.product}</div>
              ${isOverridden ? `<button class="rate-edit-btn" id="reset-rate" style="font-size:13px;letter-spacing:.15em;text-transform:uppercase;color:#78716c;font-weight:700;">${I.rotate} Reset</button>` : ''}
            </div>
            <div class="rate-row">
              <span class="muted">Fee charged</span>
              <div class="flex items-center gap-2">
                ${isOverridden ? `<span class="rate-badge override">Custom</span>` : (hasClientRate ? `<span class="rate-badge client">Client</span>` : '')}
                <span style="font-weight:700;${isOverridden?'color:#78350f;':''}">$</span>
                <input type="number" id="tx-rate-input" class="rate-input" value="${currentRate.toFixed(2)}" min="0" step="0.01" inputmode="decimal" style="width:92px;">
              </div>
            </div>
            ${(isOverridden || hasClientRate) ? `
              <div class="rate-context" id="rate-context">${isOverridden ? `Default: $${rateInfo.clinicDefault.toFixed(2)}` : `Clinic default: $${rateInfo.clinicDefault.toFixed(2)}`}</div>
            ` : ''}
            <div class="total-charge">
              <div><div class="amber-label">Total charge</div></div>
              <div class="big">$<span id="total-charge-big">${Math.floor(totalCharge)}</span><span class="cents">.<span id="total-charge-cents">${(totalCharge.toFixed(2)).split('.')[1]}</span></span></div>
            </div>
          </div>
          ` : `
          ${reviewOn ? `
          <div style="display:grid;grid-template-columns:1fr 92px 92px;align-items:flex-end;column-gap:8px;">
            <div class="amber-label">Summary</div>
            <div style="text-align:right;">
              <div class="amber-label" style="color:#78716c;">Treatment</div>
              <div class="serif" style="font-size:24px;font-weight:700;"><span id="total-units">${totalUnits}</span><span style="font-size:13px;color:#78716c;font-style:italic;font-weight:700;"> u</span></div>
            </div>
            <div style="text-align:right;">
              <div class="amber-label">Review</div>
              <div class="serif" style="font-size:24px;font-weight:700;color:#92400e;"><span id="review-units">${reviewUnits}</span><span style="font-size:13px;color:#78716c;font-style:italic;font-weight:700;"> u</span></div>
            </div>
          </div>
          ` : `
          <div style="display:grid;grid-template-columns:1fr 1fr;align-items:baseline;column-gap:12px;">
            <div class="amber-label">${isMl ? 'Area' : 'Summary'}</div>
            <div class="serif" style="font-size:28px;font-weight:700;"><span id="total-units">${totalUnits}</span> <span style="font-size:15px;color:#78716c;font-style:italic;font-weight:700;">${isMl?'ml':'units'}</span></div>
          </div>
          `}

          <div class="mt-3">
            ${isMl ? `
              <div class="area-row" data-area="${standardAreas[0].key}">
                <input type="text" class="other-label-input" id="tx-area-label" value="${escapeHtml(t.areaLabel||'')}" placeholder="Area — e.g. Lips, Cheeks, Chin" autocapitalize="words">
                <div class="flex items-center gap-2">
                  <input type="number" class="area-input area-units-input" data-key="${standardAreas[0].key}" value="${t.areas[standardAreas[0].key]||''}" placeholder="0" min="0" step="0.1" inputmode="decimal">
                  <span class="area-value ${(t.areas[standardAreas[0].key]||0)===0?'muted':''}">${unitLabel}</span>
                </div>
              </div>
            ` : standardAreas.map(a => `
              <div class="area-row" data-area="${a.key}"${reviewOn?' style="grid-template-columns:1fr 92px 92px;column-gap:8px;"':''}>
                <span class="area-label ${(t.areas[a.key]||0)===0?'muted':''}">${a.name}</span>
                <div class="flex items-center gap-2" style="justify-content:flex-end;">
                  <input type="number" class="area-input area-units-input" data-key="${a.key}" value="${t.areas[a.key]||''}" placeholder="0" min="0" step="1" inputmode="decimal">
                  <span class="area-value ${(t.areas[a.key]||0)===0?'muted':''}">${unitLabel}</span>
                </div>
                ${reviewOn ? `
                <div class="flex items-center gap-2" style="justify-content:flex-end;">
                  <input type="number" class="area-input review-units-input" data-key="${a.key}" value="${t._review.areas?.[a.key]||''}" placeholder="0" min="0" step="1" inputmode="numeric">
                  <span class="area-value ${(t._review.areas?.[a.key]||0)===0?'muted':''}">u</span>
                </div>
                ` : ''}
              </div>
            `).join('')}

            ${!isMl ? `
              <div style="font-size:13px;letter-spacing:0.2em;text-transform:uppercase;color:#78716c;font-weight:700;margin-top:14px;margin-bottom:4px;">Other areas</div>
              ${(t.others || []).map((o, i) => `
                <div class="other-row"${reviewOn?' style="grid-template-columns:1fr 92px 92px;column-gap:8px;"':''}>
                  <div class="other-left">
                    <span class="other-prefix">${i+1}.</span>
                    <input type="text" class="other-label-input other-label" data-index="${i}" value="${o.label||''}" placeholder="${['e.g. DAO','e.g. Mentalis','e.g. Bunny lines'][i]||'e.g. area'}">
                  </div>
                  <div class="other-units" style="justify-content:flex-end;">
                    <input type="number" class="area-input other-units-input" data-index="${i}" value="${o.units||''}" placeholder="0" min="0" step="1" inputmode="numeric">
                    <span class="u ${!o.units?'u-empty':''}">u</span>
                  </div>
                  ${reviewOn ? `
                  <div class="other-units" style="justify-content:flex-end;">
                    <input type="number" class="area-input review-other-input" data-index="${i}" value="${t._review.others?.[i]||''}" placeholder="0" min="0" step="1" inputmode="numeric">
                    <span class="u ${!t._review.others?.[i]?'u-empty':''}">u</span>
                  </div>
                  ` : ''}
                </div>
              `).join('')}
            ` : ''}
          </div>

          <div class="billing">
            <div class="flex items-center justify-between mb-3">
              <div class="amber-label">Billing</div>
              ${isOverridden ? `<button class="rate-edit-btn" id="reset-rate" style="font-size:13px;letter-spacing:.15em;text-transform:uppercase;color:#78716c;font-weight:700;">${I.rotate} Reset</button>` : ''}
            </div>
            <div class="rate-row">
              <span class="muted">${reviewOn ? 'Treatment units' : `Total ${isMl?'volume':'units'}`}</span>
              <span style="font-weight:700;"><span id="billing-units">${totalUnits}</span>${unitLabel}</span>
            </div>
            ${reviewOn ? `
            <div class="rate-row">
              <span class="muted">Review units</span>
              <span style="font-weight:700;"><span id="billing-review-units">${reviewUnits}</span>u <span style="font-weight:400;color:#a8a29e;font-size:13px;">no charge</span></span>
            </div>
            ` : ''}
            <div class="rate-row">
              <span class="muted">Rate per ${isMl?'ml':'unit'}</span>
              <div class="flex items-center gap-2">
                ${isOverridden ? `<span class="rate-badge override">Override</span>` : (hasClientRate ? `<span class="rate-badge client">Client</span>` : '')}
                <span style="font-weight:700;${isOverridden?'color:#78350f;':''}">$</span>
                <input type="number" id="tx-rate-input" class="rate-input" value="${currentRate.toFixed(2)}" min="0" step="0.01" inputmode="decimal" style="width:92px;">
              </div>
            </div>
            ${(isOverridden || hasClientRate) ? `
              <div class="rate-context" id="rate-context">
                ${isOverridden
                  ? `Client: $${rateInfo.rate.toFixed(2)} · Clinic: $${rateInfo.clinicDefault.toFixed(2)}`
                  : `Clinic default: $${rateInfo.clinicDefault.toFixed(2)}/${isMl?'ml':'unit'}`}
              </div>
            ` : ''}

            <div class="total-charge">
              <div>
                <div class="amber-label">Total charge</div>
                <div style="font-size:13px;color:#78716c;margin-top:2px;font-weight:700;"><span id="charge-formula">${totalUnits}${unitLabel} × $${currentRate.toFixed(2)}</span></div>
              </div>
              <div class="big">$<span id="total-charge-big">${Math.floor(totalCharge)}</span><span class="cents">.<span id="total-charge-cents">${(totalCharge.toFixed(2)).split('.')[1]}</span></span></div>
            </div>
          </div>
          `}
        </div>

        ${lanreeCfg().enabled ? `
        <div class="px-6 mb-4">
          <button class="btn" id="send-lanree" style="width:100%;background:#92400e;color:#fafaf9;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;">${I.trending} Send to Lanree sheet</button>
          <div id="lanree-send-status" style="display:none;font-size:14px;margin-top:10px;font-weight:600;line-height:1.5;"></div>
        </div>` : ''}

        <div class="mx-6 card mb-4">
          <div class="label mb-2">Notes</div>
          <textarea class="input textarea" id="tx-notes" placeholder="Clinical notes, observations, follow-up plan...">${t.notes||''}</textarea>
        </div>

        <div class="px-6 mb-2" style="display:flex;align-items:center;justify-content:space-between;">
          <div class="label">Photos</div>
          ${photoCount >= 2 ? `<button class="action" id="compare-photos" style="font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#92400e;font-weight:700;padding:2px 0;">${I.compare} Compare</button>` : ''}
        </div>
        <div class="mx-6 mb-3" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start;">
          <div>${renderPhotoSlot(PHOTO_SLOTS.find(s => s.key === 'before'), t)}</div>
          <div>${renderPhotoSlot(PHOTO_SLOTS.find(s => s.key === 'treatment'), t)}</div>
          <div>${renderPhotoSlot(PHOTO_SLOTS.find(s => s.key === 'dynamic'), t)}</div>
          <div>${renderPhotoSlot(PHOTO_SLOTS.find(s => s.key === 'review'), t)}</div>
        </div>

// ---------- END OF DAY ----------
// Per-product Cost & Profit for the Summary breakdowns.
//   cost   = total units × the clinic's cost per unit (clinicRates[p].cost).
//            Flat-fee services (Keloid/Consultation) have 0 units so this is $0,
//            matching their $0 cost.
//   profit = (charge ÷ 1.15) × 0.75 − cost — matches the Lanree spreadsheet's
//            "To Dr" column. Strip 15% GST off the charge (→ "After 15% Tax"), keep
//            75% (Lanree Aesthetic takes a 25% commission for supplying clients via
//            their booking system, recalls and end-of-month charging → "Clinic 75%"),
//            THEN subtract the full product cost — the clinic absorbs 100% of cost,
//            commission applies to revenue only. LANREE_KEEP is that 0.75 share.
//            A $0-charge review naturally yields −cost (a loss), as the sheet shows.
const LANREE_KEEP = 0.75;
function lineCostProfit(product, units, revenue) {
  const r = state.data.clinicRates[product];
  const costPerUnit = (r && r.cost) || 0;
  const cost = units * costPerUnit;
  const profit = (revenue / 1.15) * LANREE_KEEP - cost;
  return { cost, profit };
}
// Display helpers for a profit value: a loss (negative — e.g. a $0-charge review
// that consumed product) shows as "−$12" in red; zero/positive as "$12" in green.
function profitColor(p) { return p < 0 ? '#dc2626' : '#047857'; }
function profitText(p) { return (p < 0 ? '−$' : '$') + Math.abs(p).toFixed(0); }
// Footnote shown under the Profit breakdowns so the maths is transparent.
const PROFIT_FORMULA_NOTE = `<div style="font-size:12px;color:#a8a29e;font-style:italic;line-height:1.5;margin-top:8px;">Profit = (charge ÷ 1.15) × 0.75 − cost — strip 15% GST, keep 75% after Lanree's 25% commission, then subtract product cost. $0-charge reviews show the product cost as a loss.</div>`;

function viewEndOfDay() {
  const today = todayISO();
  const txs = state.data.treatments.filter(t => t.date === today);
  const gross = txs.reduce((s, t) => s + (t.totalCharge || 0), 0);

  const byProduct = {};
  txs.forEach(t => {
    if (!byProduct[t.product]) byProduct[t.product] = { count: 0, units: 0, revenue: 0 };
    byProduct[t.product].count++;
    byProduct[t.product].units += t.totalUnits || 0;
    byProduct[t.product].revenue += t.totalCharge || 0;
  });
  // Day totals for the cost/profit columns — sum the per-line values (profit is
  // piecewise: charged lines use the Lanree formula, $0-charge lines are −cost).
  let dayCost = 0, dayProfit = 0;
  Object.entries(byProduct).forEach(([p, d]) => {
    const cp = lineCostProfit(p, d.units, d.revenue);
    dayCost += cp.cost; dayProfit += cp.profit;
  });

  // Period summary: a selectable date range (defaults to this calendar month).
  const [defStart, defEnd] = eodPresetRange('month');
  const rStart = state.eodStart || defStart;
  const rEnd = state.eodEnd || defEnd;
  // Which preset (if any) the current range matches, for chip highlighting.
  const presets = [['today', 'Today'], ['month', 'This month'], ['30d', 'Last 30 days'], ['year', 'This year'], ['all', 'All time']];
  const activePreset = (presets.find(([k]) => {
    const [s, e] = eodPresetRange(k);
    return s === rStart && e === rEnd;

  const rangeTxs = state.data.treatments.filter(t => t.date >= rStart && t.date <= rEnd);
  const rangeGross = rangeTxs.reduce((s, t) => s + (t.totalCharge || 0), 0);
  const rangeUnits = rangeTxs.reduce((s, t) => s + (t.totalUnits || 0), 0);
  const rangePatients = new Set(rangeTxs.map(t => t.clientId)).size;

  const rangeByProduct = {};
  rangeTxs.forEach(t => {
    if (!rangeByProduct[t.product]) rangeByProduct[t.product] = { units: 0, revenue: 0 };
    rangeByProduct[t.product].units += t.totalUnits || 0;
    rangeByProduct[t.product].revenue += t.totalCharge || 0;
  });
  let rangeCost = 0, rangeProfit = 0;
  Object.entries(rangeByProduct).forEach(([p, d]) => {
    const cp = lineCostProfit(p, d.units, d.revenue);
    rangeCost += cp.cost; rangeProfit += cp.profit;
  });

  return `

        <button class="back" data-nav="today">${I.chevronLeft}</button>
        <div class="title serif" style="font-size:36px;font-weight:400;text-transform:none;letter-spacing:0;color:#1c1917;">Summary</div>

      </div>

      <div class="screen-body px-6">
        <div class="mb-4">
          <div class="date">${formatDate(today, 'full')}</div>
        </div>


        ${Object.keys(byProduct).length > 0 ? `
          <div class="mb-4">
            <div class="flex items-center justify-between mb-2">

            </div>
            <div class="card" style="padding:0;">
              <div style="display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid #e7e5e4;">

                <div class="label" style="width:64px;text-align:right;">Charge</div>
                <div class="label" style="width:64px;text-align:right;">Cost</div>
                <div class="label" style="width:64px;text-align:right;">Profit</div>
              </div>
              ${Object.entries(byProduct).map(([p, d], i, arr) => {
                const { cost, profit } = lineCostProfit(p, d.units, d.revenue);
                return `
                <div class="bd-row" data-bd="${escapeHtml(p)}" data-bd-start="${today}" data-bd-end="${today}" style="padding:12px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;${i<arr.length-1?'border-bottom:1px solid #f5f5f4;':''}">

                  <div style="flex:1;min-width:0;">
                    <div style="font-size:16px;font-weight:600;">${p}</div>
                    <div style="font-size:13px;color:#78716c;">${d.count} treatment${d.count===1?'':'s'}${isFlatFeeProduct(p) ? '' : ` · ${d.units}${isMlProduct(p)?'ml':'u'}`}</div>

                  <div style="width:64px;text-align:right;font-size:15px;color:#78716c;">$${cost.toFixed(0)}</div>
                  <div style="width:64px;text-align:right;font-size:15px;font-weight:600;color:${profitColor(profit)};">${profitText(profit)}</div>

        })()}

        ${(() => {
          const exact = findDuplicateClientGroups();

          if (!exact.length && !similar.length) return '';
          let gi = -1;
          const renderGroup = (g) => {
            gi++;

            return `
                <div class="dup-group" style="border-top:1px solid #e7e5e4;margin-top:12px;padding-top:12px;">

                    <label style="display:flex;align-items:flex-start;gap:10px;padding:7px 0;">

          return `
          <div class="mb-4">
            <div class="label mb-2">Duplicate clients</div>
            <div class="card">
              ${exact.length ? `
              <div style="font-size:14px;color:#44403c;line-height:1.5;">
                <strong style="color:#1c1917;">${exact.length}</strong> name${exact.length===1?'':'s'} with more than one record (identical names). Choose which record to keep — its details fill any gaps and all treatments move onto it.
              </div>
              ${exact.map(renderGroup).join('')}` : ''}
              ${similar.length ? `
              <div style="font-size:14px;color:#44403c;line-height:1.5;${exact.length?'border-top:2px solid #e7e5e4;margin-top:16px;padding-top:16px;':''}">
                <strong style="color:#1c1917;">${similar.length}</strong> set${similar.length===1?'':'s'} of <strong>similar</strong> names (likely typos/abbreviations from the import — e.g. “Hay”/“Hey”). <span style="color:#b45309;font-weight:600;">Check each carefully</span> — only merge if they are truly the same person.
              </div>
              ${similar.map(renderGroup).join('')}` : ''}
              <div id="dup-confirm" style="display:none;margin-top:14px;padding:14px;border:1px solid #fcd34d;background:#fffbeb;border-radius:12px;">

                  <button class="btn" id="dup-merge-go" style="background:#92400e;color:#fafaf9;font-weight:600;">Merge records</button>
                </div>
              </div>
              <div id="dup-status" style="display:none;font-size:13px;margin-top:10px;font-weight:600;color:#047857;"></div>
            </div>
          </div>`;
        })()}

        <div class="mb-4">
          <button class="btn" id="reset-data" style="width:100%;background:#fee2e2;color:#991b1b;font-weight:500;">Erase all data</button>
          <div id="reset-confirm" style="display:none;margin-top:10px;padding:14px;border:1px solid #fca5a5;background:#fef2f2;border-radius:12px;">
            <div style="font-size:14px;color:#7f1d1d;font-weight:600;line-height:1.5;margin-bottom:12px;">Erase ALL clients, treatments, appointments and photos? This cannot be undone — make sure you have exported a backup first.</div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
              <button class="btn" id="reset-cancel" style="background:#f5f5f4;color:#1c1917;font-weight:600;">Cancel</button>
              <button class="btn" id="reset-confirm-go" style="background:#991b1b;color:#fafaf9;font-weight:600;">Erase everything</button>

          <div id="reset-status" style="display:none;font-size:12px;margin-top:10px;font-weight:500;"></div>

        <div class="notice warn">
          ${I.alert}

            <strong>Back up regularly.</strong> Data is stored in your browser only. Clearing Safari data will delete everything. Export a backup weekly and save to Files or email it to yourself.

        <div style="text-align:center;font-size:11px;color:#a8a29e;margin-top:20px;font-family:'Cormorant Garamond',serif;font-style:italic;">Build ${APP_BUILD}</div>

        <input type="file" id="import-file" accept="application/json" class="hidden">

  `;
}

// ---------- SCHEDULE (imported appointments) ----------
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[ch]));
}

function viewSchedule() {
  const byDate = {};
  (state.data.appointments || []).forEach(a => { (byDate[a.date] = byDate[a.date] || []).push(a); });
  const dates = Object.keys(byDate).sort();
  return `
    <div class="screen cream-screen">
      <div class="top-bar">
        <button class="back" data-nav="today">${I.chevronLeft}</button>
        <div class="title-center"><div class="title">Schedule</div></div>
        <button class="action" data-appt-new style="color:#92400e;font-weight:600;">+ Add</button>
      </div>
      <div class="screen-body">
        ${dates.length === 0 ? `
          <div class="empty">
            ${I.calendar}
            <div class="empty-title" style="margin-top:12px;">No appointments yet</div>
            <div class="empty-body">Tap <strong>+ Add</strong> above to book one, or import your day sheets in Settings.</div>
          </div>
        ` : dates.map(date => {
          const list = byDate[date].slice().sort(byApptTime);
          const label = escapeHtml(list[0].dateLabel || formatDate(date, 'full'));
          return `
            <div class="px-6" style="padding-top:16px;">
              <h3 class="serif" style="font-size:20px;font-weight:500;margin-bottom:2px;">${label}</h3>
              <div style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#78716c;margin-bottom:8px;">${list.length} appointment${list.length===1?'':'s'}</div>
            </div>
            ${list.map(a => apptRowHTML(a, { timeWidth: 62, timeSize: 13, nameSize: 18 })).join('')}
          `;
        }).join('')}
      </div>
    </div>
  `;
}
