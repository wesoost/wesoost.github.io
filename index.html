// ---------- Appointment Form Handlers ----------
function setupAppointmentForm() {
  const nameEl = document.getElementById('appt-name');
  const saveBtn = document.getElementById('save-appt');
  const check = () => {
    const ok = !!nameEl.value.trim();
    saveBtn.classList.toggle('disabled', !ok);
    return ok;
  };
  nameEl.addEventListener('input', check);

  saveBtn.addEventListener('click', () => {
    if (!check()) return;
    const date = document.getElementById('appt-date').value || todayISO();
    const time = formatTime24(document.getElementById('appt-time').value);  // '' if no time set
    const name = nameEl.value.trim();
    const treatment = document.getElementById('appt-treatment').value.trim();
    const notes = document.getElementById('appt-notes').value.trim();
    const editing = state.editApptId
      ? (state.data.appointments || []).find(a => a.id === state.editApptId)
      : null;
    if (editing) {
      // dateLabel cleared so the Schedule header falls back to the (possibly new) date.
      Object.assign(editing, { date, time, name, treatment, notes, dateLabel: '' });
    } else {
      state.data.appointments = state.data.appointments || [];
      const sameDay = state.data.appointments.filter(a => a.date === date).length;
      state.data.appointments.push({
        id: uid(), date, dateLabel: '', time, name, treatment, notes, order: sameDay
      });
    }
    saveData();
    state.editApptId = null;
    state.dayDate = date;       // land on the day this appointment belongs to
    setView('today');
  });

  // On-screen confirm panel rather than native confirm(): iOS Safari suppresses
  // confirm() in this app's context, so the delete silently did nothing. See
  // [[ios-no-dialog-after-await]].
  document.getElementById('delete-appt')?.addEventListener('click', () => {
    const panel = document.getElementById('delete-appt-confirm');
    if (panel) panel.style.display = 'block';
  });
  document.getElementById('delete-appt-cancel')?.addEventListener('click', () => {
    const panel = document.getElementById('delete-appt-confirm');
    if (panel) panel.style.display = 'none';
  });
  document.getElementById('delete-appt-go')?.addEventListener('click', () => {
    state.data.appointments = (state.data.appointments || []).filter(a => a.id !== state.editApptId);
    saveData();
    state.editApptId = null;
    setView('today');
  });

  check();
}

// Tapping an appointment starts a new treatment for that client — matching an
// existing client by name, or auto-creating a name-only client if none matches
// yet (the same way the Excel import does, with NO confirm prompt, so manually
// added appointments behave the same as imported ones). The new-treatment page's
// back button returns to the client's profile.
function startTreatmentFromAppointment(appt) {
  const full = (appt.name || '').trim();
  if (!full) return;
  let client = state.data.clients.find(c =>
    `${c.firstName} ${c.lastName}`.trim().toLowerCase() === full.toLowerCase());
  if (!client) {
    const parts = full.split(/\s+/);
    const firstName = parts.shift() || full;
    client = {
      id: uid(), firstName, lastName: parts.join(' '),
      dob: '', phone: '', allergies: '',
      notes: appt.notes ? `From appointment ${(appt.dateLabel || '').trim()}: ${appt.notes}`.trim() : '',
      rates: {}, clientSince: todayISO()
    };
    state.data.clients.push(client);
    saveData();
  }
  setView('treatment', { clientId: client.id, treatmentId: 'new' });
}

// Holds a prepared backup File if a first Export tap couldn't open the iOS share
// sheet (lost user-activation while reading photos); the next tap shares it.
let _backupFile = null;

// Holds a parsed backup awaiting the user's on-screen confirm. We can't use a
// native confirm() here: it's reached from FileReader.onload (after the async
// read), outside the tap gesture, so iOS Safari silently suppresses it — which
// made Import Backup appear to do nothing. See [[ios-no-dialog-after-await]].
let _pendingImport = null;

// Holds parsed day-sheets from the Lanree .xlsx awaiting the user's per-day
// pick. Each entry { dateISO, dateLabel, appts:[…], selected:boolean }. The
// picker (#xlsx-confirm) lets the user tick which days to import; only days
// whose ISO date has zero existing appointments in the app are importable
// (the merge mode is "fill empty dates only — never overwrite").
let _pendingXlsx = null;

// Holds a pending duplicate-client merge ({ primaryId, dupIds }) awaiting the
// user's on-screen confirm in the Settings "Duplicate clients" card.
let _pendingMerge = null;

function setupSettings() {
  // Populate the photo count asynchronously
  countPhotos().then(n => {
    const el = document.getElementById('photo-count-display');
    if (el) el.textContent = n;
  });

  // Device-storage readout. With 2,000+ imported photos in IndexedDB, the user
  // can drift toward Safari's per-origin limit; if storage fills, the browser
  // may EVICT the photo store. Show how much is used vs. the quota, warn when
  // high, and offer navigator.storage.persist() (which, once granted, tells the
  // browser not to auto-clear this origin's data). All async + best-effort:
  // older WebKit lacks the StorageManager API, so we degrade gracefully.
  async function renderStorageEstimate() {
    const el = document.getElementById('storage-readout');
    if (!el) return;
    if (!navigator.storage || !navigator.storage.estimate) {
      el.innerHTML = '<span style="color:#a8a29e;font-style:italic;font-family:\'Cormorant Garamond\',serif;">Storage usage isn’t reported by this browser. Keep exporting regular backups.</span>';
      return;
    }
    let usage = 0, quota = 0, persisted = false;
    try {
      const est = await navigator.storage.estimate();
      usage = est.usage || 0; quota = est.quota || 0;
      if (navigator.storage.persisted) persisted = await navigator.storage.persisted();
    } catch (e) {
      el.innerHTML = '<span style="color:#a8a29e;font-style:italic;font-family:\'Cormorant Garamond\',serif;">Could not read storage usage.</span>';
      return;
    }
    const fmt = (bytes) => {
      const mb = bytes / (1024 * 1024);
      return mb >= 1024 ? (mb / 1024).toFixed(1) + ' GB' : mb.toFixed(mb < 100 ? 1 : 0) + ' MB';
    };
    const pct = quota ? Math.min(100, Math.round((usage / quota) * 100)) : 0;
    const warn = pct >= 80;
    const caution = pct >= 60;
    const barColor = warn ? '#dc2626' : caution ? '#b45309' : '#047857';
    el.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:baseline;font-weight:600;color:#44403c;margin-bottom:6px;">
        <span>Device storage</span>
        <span style="color:${barColor};">${fmt(usage)}${quota ? ' of ' + fmt(quota) + ' (' + pct + '%)' : ''}</span>
      </div>
      <div style="height:8px;background:#e7e5e4;border-radius:99px;overflow:hidden;">
        <div style="height:100%;width:${pct}%;background:${barColor};border-radius:99px;"></div>
      </div>
      ${warn ? `<div class="notice warn" style="margin-top:12px;align-items:flex-start;">Storage is nearly full. Export a backup now — if the device runs out of space the browser may delete your photos. Consider removing very old photo records.</div>` : ''}
      <div style="font-size:13px;margin-top:10px;font-family:'Cormorant Garamond',serif;font-style:italic;color:${persisted ? '#047857' : '#78716c'};">
        ${persisted ? '✓ Storage is protected — the browser won’t auto-clear your data.' : 'Storage is not protected yet. Tap below so the browser won’t automatically clear your records.'}
      </div>
      ${persisted ? '' : '<button class="btn" id="persist-storage" style="width:100%;margin-top:8px;background:#f5f5f4;color:#1c1917;font-weight:500;">Protect storage from clearing</button>'}
    `;
    document.getElementById('persist-storage')?.addEventListener('click', async () => {
      try { if (navigator.storage.persist) await navigator.storage.persist(); } catch (e) {}
      renderStorageEstimate();
    });
  }
  renderStorageEstimate();

  document.getElementById('save-clinic-rates')?.addEventListener('click', () => {
    // Charge to client (rate) and cost to clinic, per product. Both allow 0 (e.g.
    // a free consultation), so the guard is >= 0, not > 0.
    document.querySelectorAll('.settings-rate').forEach(inp => {
      const v = parseFloat(inp.value);
      if (!isNaN(v) && v >= 0 && state.data.clinicRates[inp.dataset.product]) {
        state.data.clinicRates[inp.dataset.product].rate = v;
      }
    });
    document.querySelectorAll('.settings-cost').forEach(inp => {
      const v = parseFloat(inp.value);
      if (!isNaN(v) && v >= 0 && state.data.clinicRates[inp.dataset.product]) {
        state.data.clinicRates[inp.dataset.product].cost = v;
      }
    });
    saveData();
    alert('Clinic rates saved.');
  });

  // Share via the native sheet (Save to Files / Mail), or download on desktop.
  // Returns true if handled (shared / dismissed / downloaded), false if the
  // share was refused (e.g. iOS dropped the activation) so the caller can retry.
  async function deliverBackup(file, show) {
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], title: "Dr Wessel's Aesthetics backup" });
        markBackupNow();
        show('Backup saved.');
        return true;
      } catch (e) {
        if (e && e.name === 'AbortError') { show(''); return true; } // user dismissed
        return false; // refused — likely lost activation during preparation
      }
    }
    // Desktop / no file-share support: normal download.
    try {
      const url = URL.createObjectURL(file);
      const a = document.createElement('a');
      a.href = url; a.download = file.name;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 10000);
      markBackupNow();
      show('Backup downloaded.');
      return true;
    } catch (e) {
      show('Could not export backup: ' + (e.message || e), true);
      return true;
    }
  }

  document.getElementById('export-data')?.addEventListener('click', async () => {
    const status = document.getElementById('backup-status');
    const show = (msg, err) => {
      if (!status) return;
      if (!msg) { status.style.display = 'none'; return; }
      status.style.display = 'block';
      status.style.color = err ? '#991b1b' : '#047857';
      status.textContent = msg;
    };

    // Second tap after an activation-loss: the file is already built, so share
    // it now — this tap is a fresh gesture with no await before share().
    if (_backupFile) {
      const ok = await deliverBackup(_backupFile, show);
      if (ok) _backupFile = null;
      else show('Could not save — please tap once more.', true);
      return;
    }

    show('Preparing backup (including photos)…');
    let file;
    try {
      const photos = await getAllPhotos();
      const json = JSON.stringify({ ...state.data, photos, _format: 'drwessels-backup-v2' });
      file = new File([json], `drwessels-backup-${todayISO()}.json`, { type: 'application/json' });
    } catch (e) {
      show('Could not prepare backup: ' + (e.message || e), true);
      return;
    }

    const ok = await deliverBackup(file, show);
    if (!ok) {
      _backupFile = file;  // keep it; the next tap shares with a fresh gesture
      show('Backup ready — tap “Export backup” again to save it.');
    }
  });

  // Records-only backup: clients/treatments/rates/appointments WITHOUT photos.
  // state.data holds only small photo-id strings (the image bytes live in
  // IndexedDB), so the file is a few MB and emailable. No getAllPhotos() read
  // before share(), so user-activation is preserved and the _backupFile retry
  // dance isn't needed. Imports via the normal path (photos absent → existing
  // photos left untouched, see import handler).
  document.getElementById('export-records')?.addEventListener('click', async () => {
    const status = document.getElementById('backup-status');
    const show = (msg, err) => {
      if (!status) return;
      if (!msg) { status.style.display = 'none'; return; }
      status.style.display = 'block';
      status.style.color = err ? '#991b1b' : '#047857';
      status.textContent = msg;
    };
    let file;
    try {
      const json = JSON.stringify({ ...state.data, _format: 'drwessels-backup-records-v1' });
      file = new File([json], `drwessels-records-${todayISO()}.json`, { type: 'application/json' });
    } catch (e) {
      show('Could not prepare backup: ' + (e.message || e), true);
      return;
    }
    await deliverBackup(file, show);
  });

  document.getElementById('import-data')?.addEventListener('click', () => {
    document.getElementById('import-file').click();
  });

  // --- Import photos (additive photo pack) — attaches historical photos onto
  // existing treatments by id, writing images to IndexedDB. Does NOT replace data.
  // iOS-safe: on-screen status only (no native dialogs), no confirm needed since
  // it's purely additive. See [[ios-no-dialog-after-await]].
  const ppStatus = (msg, err) => {
    const s = document.getElementById('photopack-status');
    if (!s) return;
    if (!msg) { s.style.display = 'none'; return; }
    s.style.display = 'block'; s.style.color = err ? '#b91c1c' : '#047857'; s.textContent = msg;
  };
  document.getElementById('import-photopack')?.addEventListener('click', () => {
    document.getElementById('photopack-file')?.click();
  });
  document.getElementById('photopack-file')?.addEventListener('change', (e) => {
    const f = e.target.files[0];
    e.target.value = '';
    if (!f) return;
    ppStatus('Reading ' + f.name + '…');
    const reader = new FileReader();
    reader.onerror = () => ppStatus('Could not read that file.', true);
    reader.onload = async (ev) => {
      let pack;
      try {
        pack = JSON.parse(ev.target.result);
        if (!pack._format || !pack._format.startsWith('drwessels-photopack') || !pack.photos || !Array.isArray(pack.assign))
          throw new Error('Not a photo-pack file');
      } catch (err) { ppStatus('Could not import: ' + (err.message || err), true); return; }
      ppStatus('Importing photos…');
      try {
        const byId = new Map(state.data.treatments.map(t => [t.id, t]));
        let saved = 0, attached = 0, missing = 0;
        for (const id in pack.photos) {
          try { await savePhoto(id, pack.photos[id]); saved++; } catch (_) { /* skip bad image */ }
        }
        for (const a of pack.assign) {
          const t = byId.get(a.treatmentId);
          if (!t) { missing++; continue; }
          if (!t.photos) t.photos = { before: null, treatment: null, review: null, dynamic: null };
          t.photos[a.slot] = a.photoId;
          attached++;
        }
        saveData();
        render();
        ppStatus(`Added ${saved} photo${saved===1?'':'s'} onto ${attached} treatment slot${attached===1?'':'s'}${missing?` (${missing} skipped — treatment not found)`:''}.`);
      } catch (err) { ppStatus('Could not import photos: ' + (err.message || err), true); }
    };
    reader.readAsText(f);
  });

  document.getElementById('import-appts')?.addEventListener('click', () => {
    document.getElementById('import-xlsx-file')?.click();
  });
  // On-screen status, NOT alert/confirm: iOS Safari suppresses native dialogs
  // called after an await (outside the tap gesture), which silently aborts.
  const xlsxShowStatus = (msg, err) => {
    const status = document.getElementById('import-status');
    if (!status) return;
    if (!msg) { status.style.display = 'none'; return; }
    status.style.display = 'block';
    status.style.color = err ? '#991b1b' : '#047857';
    status.textContent = msg;
  };
  const xlsxHidePicker = () => {
    _pendingXlsx = null;
    const panel = document.getElementById('xlsx-confirm');
    if (panel) { panel.style.display = 'none'; panel.innerHTML = ''; }
  };

  document.getElementById('import-xlsx-file')?.addEventListener('change', async (e) => {
    const f = e.target.files[0];
    e.target.value = '';
    if (!f) return;
    xlsxHidePicker();
    xlsxShowStatus('Reading ' + f.name + '…');
    try {
      const days = await parseLanreeAppointments(await f.arrayBuffer());
      if (!days.length) { xlsxShowStatus('No dated day-sheets found in that workbook.', true); return; }
      // Default-select dates that are today-or-future AND not already populated in the
      // app — matches the old "future days you haven't loaded yet" mental model. The
      // user can re-tick past days from the picker.
      const today = todayISO();
      const existingByDate = {};
      for (const a of state.data.appointments) existingByDate[a.date] = (existingByDate[a.date] || 0) + 1;
      _pendingXlsx = days.map(d => ({
        ...d,
        selected: d.dateISO >= today && !(existingByDate[d.dateISO] > 0) && d.appts.length > 0
      }));
      xlsxShowStatus('');   // hide the "Reading…" line; the picker speaks for itself
      renderXlsxPicker();
    } catch (err) {
      console.error('Appointment import failed:', err);
      xlsxShowStatus('Could not read that file: ' + (err.message || err), true);
    }
  });

  // Delegated handler for picker rows + presets + Cancel + Import — one listener,
  // survives re-renders of the panel innerHTML.
  document.getElementById('xlsx-confirm')?.addEventListener('click', (e) => {
    if (!_pendingXlsx) return;
    const preset = e.target?.closest?.('[data-xlsx-preset]')?.dataset?.xlsxPreset;
    if (preset) {
      const today = todayISO();
      const existing = {};
      for (const a of state.data.appointments) existing[a.date] = true;
      _pendingXlsx.forEach(d => {
        const blocked = existing[d.dateISO] || d.appts.length === 0;
        if (blocked) { d.selected = false; return; }
        if (preset === 'all')    d.selected = true;
        if (preset === 'none')   d.selected = false;
        if (preset === 'future') d.selected = d.dateISO >= today;
      });
      renderXlsxPicker();
      return;
    }
    if (e.target?.id === 'xlsx-cancel') { xlsxHidePicker(); return; }
    if (e.target?.closest?.('#xlsx-go')) { xlsxCommitImport(); return; }
  });
  document.getElementById('xlsx-confirm')?.addEventListener('change', (e) => {
    if (!_pendingXlsx) return;
    const cb = e.target?.closest?.('.xlsx-day-check');
    if (!cb) return;
    const day = _pendingXlsx.find(d => d.dateISO === cb.dataset.iso);
    if (day) { day.selected = cb.checked; renderXlsxPicker(); }
  });

  // Choosing a backup file READS + validates it, then shows the on-screen
  // confirm panel (#import-confirm). The actual replace happens when the user
  // taps "Replace all data" below — a real tap gesture, so no suppressed dialog.
  const importSetStatus = (msg, err) => {
    const s = document.getElementById('backup-status');
    if (!s) return;
    if (!msg) { s.style.display = 'none'; return; }
    s.style.display = 'block';
    s.style.color = err ? '#991b1b' : '#047857';
    s.textContent = msg;
  };

  document.getElementById('import-file')?.addEventListener('change', (e) => {
    const f = e.target.files[0];
    e.target.value = '';
    if (!f) return;
    importSetStatus('Reading ' + f.name + '…');
    const reader = new FileReader();
    reader.onerror = () => importSetStatus('Could not read that file. Please try again.', true);
    reader.onload = (ev) => {
      let imported;
      try {
        imported = JSON.parse(ev.target.result);
        if (!imported.clients || !imported.treatments) throw new Error('Not a valid backup file');
      } catch (err) {
        importSetStatus('Could not import file: ' + (err.message || err), true);
        return;
      }
      _pendingImport = imported;
      const photoCount = (imported.photos && typeof imported.photos === 'object') ? Object.keys(imported.photos).length : 0;
      const msgEl = document.getElementById('import-confirm-msg');
      if (msgEl) msgEl.textContent =
        `Import ${imported.clients.length} client${imported.clients.length===1?'':'s'}, ${imported.treatments.length} treatment${imported.treatments.length===1?'':'s'}${photoCount ? ` and ${photoCount} photo${photoCount===1?'':'s'}` : ''}? This REPLACES all data currently on this device.`;
      importSetStatus('');  // hide the "Reading…" line; the confirm panel now shows
      const panel = document.getElementById('import-confirm');
      if (panel) panel.style.display = 'block';
    };
    reader.readAsText(f);
  });

  document.getElementById('import-cancel')?.addEventListener('click', () => {
    _pendingImport = null;
    const panel = document.getElementById('import-confirm');
    if (panel) panel.style.display = 'none';
    importSetStatus('Import cancelled.');
  });

  document.getElementById('import-confirm-go')?.addEventListener('click', async () => {
    const imported = _pendingImport;
    if (!imported) return;
    _pendingImport = null;
    const panel = document.getElementById('import-confirm');
    if (panel) panel.style.display = 'none';
    importSetStatus('Importing…');
    try {
      // Restore the bundled photos into IndexedDB first so they resolve once the
      // UI re-renders. A bad image is skipped rather than aborting.
      const photos = (imported.photos && typeof imported.photos === 'object') ? imported.photos : null;
      let restored = 0;
      if (photos) {
        for (const id in photos) {
          try { await savePhoto(id, photos[id]); restored++; } catch (err) { /* skip */ }
        }
      }
      const { photos: _omitPhotos, _format, ...data } = imported;
      state.data = migrateClinicRates(migrateAllTreatments({ ...structuredClone(DEFAULT_DATA), ...data }));
      saveData();
      markBackupNow();   // the file just imported is itself an off-device copy
      render();
      // On-screen confirmation (not alert(): iOS suppresses dialogs after await).
      importSetStatus(`Imported ${state.data.clients.length} clients, ${state.data.treatments.length} treatments${restored ? `, ${restored} photos` : ''}.`);
    } catch (err) {
      importSetStatus('Could not import file: ' + (err.message || err), true);
    }
  });

  // Erase uses an on-screen confirm panel, not chained native confirm() dialogs:
  // iOS Safari only allows one dialog per user gesture, so the second confirm()
  // was silently suppressed and the erase aborted with no feedback. See
  // [[ios-no-dialog-after-await]].
  const resetSetStatus = (msg, err) => {
    const s = document.getElementById('reset-status');
    if (!s) return;
    if (!msg) { s.style.display = 'none'; return; }
    s.style.display = 'block';
    s.style.color = err ? '#991b1b' : '#047857';
    s.textContent = msg;
  };

  document.getElementById('reset-data')?.addEventListener('click', () => {
    const panel = document.getElementById('reset-confirm');
    if (panel) panel.style.display = 'block';
    resetSetStatus('');
  });

  document.getElementById('reset-cancel')?.addEventListener('click', () => {
    const panel = document.getElementById('reset-confirm');
    if (panel) panel.style.display = 'none';
  });

  document.getElementById('reset-confirm-go')?.addEventListener('click', async () => {
    const panel = document.getElementById('reset-confirm');
    if (panel) panel.style.display = 'none';
    resetSetStatus('Erasing…');
    try {
      await clearAllPhotos();
    } catch (err) {
      // Photos failing to clear shouldn't block the data reset — log and continue.
      console.warn('clearAllPhotos failed:', err);
    }
    state.data = structuredClone(DEFAULT_DATA);
    saveData();
    try { localStorage.removeItem('welcomed'); } catch {}
    render();
    resetSetStatus('All data erased.');
  });

  // --- Duplicate-client merge (on-screen confirm, iOS-safe: no native dialog) ---
  const dupConfirm = document.getElementById('dup-confirm');
  document.querySelectorAll('.dup-merge-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const group = btn.closest('.dup-group');
      const checked = group?.querySelector('input[type="radio"]:checked');
      if (!checked) return;
      const primary = getClient(checked.value);
      if (!primary) return;
      // Merge exactly the records shown in THIS group (works for exact- and
      // similar-name groups alike — don't re-derive by name).
      const dups = [...group.querySelectorAll('input[type="radio"]')]
        .map(r => r.value).filter(v => v !== primary.id).map(getClient).filter(Boolean);
      if (!dups.length) return;
      const totalTx = dups.reduce((s, c) => s + getClientTreatments(c.id).length, 0);
      const nm = `${primary.firstName || ''} ${primary.lastName || ''}`.trim();
      _pendingMerge = { primaryId: primary.id, dupIds: dups.map(c => c.id) };
      const msg = document.getElementById('dup-confirm-msg');
      if (msg) msg.textContent = `Keep one record of “${nm}” and merge in ${dups.length} other${dups.length === 1 ? '' : 's'}. ${totalTx} treatment${totalTx === 1 ? '' : 's'} will move onto the kept record, and the extra ${dups.length} record${dups.length === 1 ? '' : 's'} will be removed. This cannot be undone — make sure you have a backup.`;
      if (dupConfirm) { dupConfirm.style.display = 'block'; dupConfirm.scrollIntoView({ block: 'nearest' }); }
    });
  });
  document.getElementById('dup-cancel')?.addEventListener('click', () => {
    _pendingMerge = null;
    if (dupConfirm) dupConfirm.style.display = 'none';
  });
  document.getElementById('dup-merge-go')?.addEventListener('click', () => {
    if (!_pendingMerge) return;
    const removed = _pendingMerge.dupIds.length;
    mergeClients(_pendingMerge.primaryId, _pendingMerge.dupIds);
    _pendingMerge = null;
    render();
    const status = document.getElementById('dup-status');
    if (status) { status.style.display = 'block'; status.textContent = `Merged — ${removed} duplicate record${removed === 1 ? '' : 's'} removed.`; }
  });
}

// ================================================================
//   LANREE EXCEL SYNC  (Microsoft Graph → OneDrive workbook)
//   Pushes a treatment row into the matching day-tab of the Lanree
//   workbook in OneDrive. See the [[lanree-excel-push]] memory for the
//   sheet layout. Auth = MSAL.js v2 (PKCE, personal Microsoft account),
//   loaded from CDN ON DEMAND so the rest of the app still works fully
//   offline when sync isn't set up.
// ================================================================
const LANREE_CFG_KEY = 'drwessels_lanree';
const GRAPH = 'https://graph.microsoft.com/v1.0';
const MSAL_SCOPES = ['Files.ReadWrite'];

function lanreeCfg() {
  const def = { clientId: '', itemId: '', fileName: '', query: 'Lanree', enabled: false, account: '', folderId: '' };
  try { return { ...def, ...(JSON.parse(localStorage.getItem(LANREE_CFG_KEY) || '{}')) }; }
  catch { return def; }
}
function saveLanreeCfg(patch) {
  const next = { ...lanreeCfg(), ...patch };
  localStorage.setItem(LANREE_CFG_KEY, JSON.stringify(next));
  return next;
}

// ---- Pure helpers (no network — unit-testable) ----

// App date (YYYY-MM-DD) → Lanree day-tab name "D MMM YY" (no leading-zero day,
// 3-letter month, 2-digit year). "2026-06-06" → "6 Jun 26".
const LANREE_MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function formatLanreeTab(iso) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
  if (!m) return '';
  return `${+m[3]} ${LANREE_MONTHS[+m[2] - 1]} ${m[1].slice(2)}`;
}

// App product → the spelling used in the Lanree sheet's Treatment column.
// VERIFY against a live sheet before trusting (esp. the Review variants).
const LANREE_PRODUCT_MAP = {
  'Botox': 'Botox', 'Xeomin': 'Xeomin', 'Relfydess': 'Relfydess',
  'Filler': 'Fillers', 'SkinVive': 'SkinVive',
  'Keloid': 'Kelloid', 'Consultation': 'Consultation',
  'Botox Review': 'Botox R', 'Xeomin Review': 'Xeomin R', 'Relfydess Review': 'Relfydess R'
};
function lanreeProductName(p) { return LANREE_PRODUCT_MAP[p] || p; }

// What goes in Units(E) and Charge/unit(G). Flat-fee services bill one fee, so
// units=1 and the fee sits in Charge/unit (E×G = the fee).
function lanreeRowValues(record) {
  if (isFlatFeeProduct(record.product)) return { units: 1, charge: record.totalCharge || 0 };
  return { units: record.totalUnits || 0, charge: record.rate || 0 };
}

// Lanree col A stores slot time as hour.minute-decimal (9:30→9.3, 9:15→9.15).
function lanreeTimeDecimal(timeStr) {
  const mins = parseApptTime(timeStr);          // minutes since midnight, or NaN
  if (isNaN(mins)) return NaN;
  return Math.floor(mins / 60) + (mins % 60) / 100;
}

// From the day-tab's A:D values (rows of [time, name, notes, treatment]) pick the
// sheet row to write: the matching empty time slot, else the first empty slot.
// firstDataRow = the sheet row number of values[0]. Returns null if the day is full.
function findLanreeRow(values, slotDecimal, firstDataRow) {
  const isEmpty = (r) => !String(r && r[1] != null ? r[1] : '').trim();   // col B (name) blank
  if (!isNaN(slotDecimal)) {
    for (let i = 0; i < values.length; i++) {
      const t = parseFloat(values[i] && values[i][0]);
      if (!isNaN(t) && Math.abs(t - slotDecimal) < 0.005 && isEmpty(values[i])) return firstDataRow + i;
    }
  }
  for (let i = 0; i < values.length; i++) if (isEmpty(values[i])) return firstDataRow + i;
  return null;
}

// ---- MSAL (sign-in) ----
// Load MSAL from our OWN site first (same origin as the app — always reachable,
// works offline once cached), falling back to the CDN only if that 404s.
const MSAL_SRCS = [
  'msal-browser.min.js',
  'https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.4/lib/msal-browser.min.js'
];
let _msalLoadP = null;
function loadMsal() {
  if (window.msal) return Promise.resolve();
  if (_msalLoadP) return _msalLoadP;
  _msalLoadP = new Promise((resolve, reject) => {
    let i = 0;
    const tryNext = () => {
      if (i >= MSAL_SRCS.length) { _msalLoadP = null; reject(new Error('Could not load the sign-in library — are you online?')); return; }
      const s = document.createElement('script');
      s.async = true;
      s.src = MSAL_SRCS[i++];
      s.onload = () => resolve();
      s.onerror = () => { s.remove(); tryNext(); };
      document.head.appendChild(s);
    };
    tryNext();
  });
  return _msalLoadP;
}

let _msalApp = null;
async function getMsalApp() {
  const cfg = lanreeCfg();
  if (!cfg.clientId) throw new Error('Add your Client ID in Settings first.');
  await loadMsal();
  if (_msalApp && _msalApp.__cid === cfg.clientId) return _msalApp;
  _msalApp = new msal.PublicClientApplication({
    auth: {
      clientId: cfg.clientId,
      authority: 'https://login.microsoftonline.com/consumers',   // personal Microsoft accounts
      redirectUri: location.origin + location.pathname
    },
    cache: { cacheLocation: 'localStorage' }
  });
  _msalApp.__cid = cfg.clientId;
  return _msalApp;
}

// Complete a pending redirect sign-in (called once at boot). Safe no-op otherwise.
async function lanreeBootAuth() {
  if (!lanreeCfg().clientId) return;
  try {
    const app = await getMsalApp();
    const res = await app.handleRedirectPromise();
    const acct = (res && res.account) || app.getAllAccounts()[0];
    if (acct && acct.username !== lanreeCfg().account) saveLanreeCfg({ account: acct.username });
  } catch (e) { console.warn('Lanree auth boot:', e.message); }
}

// Start interactive sign-in (navigates away; returns via lanreeBootAuth on reload).
async function lanreeConnect() {
  const app = await getMsalApp();
  const acct = app.getAllAccounts()[0];
  if (acct) return acct;                              // already signed in
  await app.loginRedirect({ scopes: MSAL_SCOPES });   // navigates away
}

// A Graph access token via the silent flow (throws if not signed in / expired).
async function lanreeToken() {
  const app = await getMsalApp();
  const account = app.getAllAccounts()[0];
  if (!account) throw new Error('Not signed in — tap Connect in Settings.');
  try {
    const r = await app.acquireTokenSilent({ scopes: MSAL_SCOPES, account });
    return r.accessToken;
  } catch (e) {
    throw new Error('Microsoft session expired — tap Connect in Settings to sign in again.');
  }
}

// ---- Graph ----
async function graph(path, token, opts = {}) {
  const res = await fetch(GRAPH + path, {
    ...opts,
    headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json', ...(opts.headers || {}) }
  });
  if (!res.ok) {
    let detail = '';
    try { detail = ((await res.json()) || {}).error?.message || ''; } catch {}
    const err = new Error(detail || `Graph error ${res.status}`);
    err.status = res.status;
    throw err;
  }
  return res.status === 204 ? null : res.json();
}

// Locate the workbook in OneDrive and store its driveItem id. Tries, in order:
// (1) exact path at the drive root (instant — no search-index lag, which matters
// for a just-created test copy); (2) by name inside a known folder (the real
// file's folder, where the test copy also lives); (3) a whole-drive search.
async function lanreeResolveFile() {
  const cfg = lanreeCfg();
  const token = await lanreeToken();
  const want = (cfg.fileName || '').toLowerCase();
  const adopt = (item) => { saveLanreeCfg({ itemId: item.id, fileName: item.name, folderId: (item.parentReference && item.parentReference.id) || cfg.folderId || '' }); return item; };

  // 1) Exact path at the drive root.
  if (cfg.fileName) {
    try { return adopt(await graph(`/me/drive/root:/${encodeURIComponent(cfg.fileName)}?$select=id,name,parentReference`, token)); }
    catch (e) { if (e.status !== 404) throw e; }
  }
  // 2) By name inside a known folder — the last-known folder, or (if none) the
  // folder of the currently-stored item, since a test copy sits beside the original.
  let folderId = cfg.folderId;
  if (want && !folderId && cfg.itemId) {
    try { const cur = await graph(`/me/drive/items/${cfg.itemId}?$select=parentReference`, token); folderId = (cur.parentReference && cur.parentReference.id) || ''; } catch {}
  }
  if (want && folderId) {
    try {
      const kids = await graph(`/me/drive/items/${folderId}/children?$select=id,name,parentReference`, token);
      const hit = (kids.value || []).find(f => f.name.toLowerCase() === want);
      if (hit) return adopt(hit);
    } catch {}
  }
  // 3) Whole-drive search (may lag for brand-new files).
  const data = await graph(`/me/drive/root/search(q='${encodeURIComponent(cfg.query || 'Lanree')}')?$select=id,name,parentReference`, token);
  const xlsx = (data.value || []).filter(f => /\.xlsx$/i.test(f.name));
  if (!xlsx.length) throw new Error(`No .xlsx matching “${cfg.query}” in your OneDrive yet — a brand-new file can take a few minutes to be searchable.`);
  return adopt((want && xlsx.find(f => f.name.toLowerCase() === want)) || xlsx[0]);
}

const lanreeWsPath = (itemId, name) => `/me/drive/items/${itemId}/workbook/worksheets('${encodeURIComponent(name)}')`;

// Push one treatment record into its day-tab. Returns {ok, message} or throws.
async function pushTreatmentToLanree(record) {
  if (!lanreeCfg().clientId) throw new Error('Set up Lanree sync in Settings first.');
  const token = await lanreeToken();
  let itemId = lanreeCfg().itemId;
  if (!itemId) itemId = (await lanreeResolveFile()).id;

  const sheetName = formatLanreeTab(record.date);
  if (!sheetName) throw new Error('This treatment has no valid date.');

  // The day-tab must already exist (you copy the Template each morning).
  try { await graph(lanreeWsPath(itemId, sheetName), token); }
  catch (e) {
    if (e.status === 404) throw new Error(`Tab “${sheetName}” doesn’t exist yet — create it from the Template in Excel, then try again.`);
    throw e;
  }

  // Read the slot grid (rows 4–30: time + name + notes + treatment) to pick a row.
  const FIRST = 4, LAST = 30;
  const range = await graph(`${lanreeWsPath(itemId, sheetName)}/range(address='${encodeURIComponent('A' + FIRST + ':D' + LAST)}')`, token);
  const values = range.values || [];

  const client = getClient(record.clientId);
  const fullName = client ? `${client.firstName} ${client.lastName}`.trim() : '';
  // Match the client's booked appointment time on this date → slot decimal.
  let slot = NaN;
  const appt = (state.data.appointments || []).find(a => a.date === record.date && fullName &&
    (a.name || '').trim().toLowerCase() === fullName.toLowerCase());
  if (appt) slot = lanreeTimeDecimal(appt.time);

  const row = findLanreeRow(values, slot, FIRST);
  if (!row) throw new Error(`No open slot left on “${sheetName}”.`);

  const { units, charge } = lanreeRowValues(record);
  // Write Name(B), Treatment(D), Units(E), Charge/unit(G). Cost/unit(F) and the
  // computed columns (H–L) are left to the sheet's own formulas.
  const put = (col, val) => graph(`${lanreeWsPath(itemId, sheetName)}/range(address='${col}${row}')`, token,
    { method: 'PATCH', body: JSON.stringify({ values: [[val]] }) });
  await put('B', fullName);
  await put('D', lanreeProductName(record.product));
  await put('E', units);
  await put('G', charge);

  return { ok: true, message: `Added ${fullName || 'client'} to “${sheetName}”, row ${row}.`, sheetName, row };
}

// ---- Settings wiring ----
function setupLanree() {
  const statusEl = document.getElementById('lanree-status');
  if (!statusEl) return;   // not on the Settings screen
  const cfg = lanreeCfg();
  const setStatus = (msg, ok) => {
    statusEl.textContent = msg;
    statusEl.style.color = ok === false ? '#b91c1c' : (ok ? '#047857' : '#78716c');
  };

  (async () => {
    if (!cfg.clientId) { setStatus('Not set up yet — paste your Client ID, then Save.'); return; }
    try {
      const app = await getMsalApp();
      const acct = app.getAllAccounts()[0];
      if (acct) setStatus(`Connected as ${acct.username}${cfg.fileName ? ` · file: ${cfg.fileName}` : ''}.`, true);
      else setStatus('Client ID saved — tap Connect to sign in.');
    } catch (e) { setStatus(e.message, false); }
  })();

  document.getElementById('lanree-save')?.addEventListener('click', () => {
    const clientId = document.getElementById('lanree-clientid').value.trim();
    const fileName = document.getElementById('lanree-filename').value.trim();
    const query = fileName ? fileName.replace(/\.xlsx$/i, '') : 'Lanree';
    saveLanreeCfg({ clientId, fileName, query, itemId: '' });   // reset itemId → re-resolve next time
    setStatus('Saved. Tap Connect, then “Find / confirm file”.', true);
  });

  document.getElementById('lanree-connect')?.addEventListener('click', async () => {
    const clientId = document.getElementById('lanree-clientid').value.trim();
    if (!clientId) { setStatus('Enter the Client ID first.', false); return; }
    saveLanreeCfg({ clientId });
    setStatus('Opening Microsoft sign-in…');
    try { const a = await lanreeConnect(); if (a) setStatus(`Already connected as ${a.username}.`, true); }
    catch (e) { setStatus(e.message, false); }
  });

  document.getElementById('lanree-findfile')?.addEventListener('click', async () => {
    // Adopt whatever's typed in the file field and force a fresh lookup, so the
    // user doesn't have to remember to tap Save first to re-point the file.
    const fileName = document.getElementById('lanree-filename').value.trim();
    const query = fileName ? fileName.replace(/\.xlsx$/i, '') : 'Lanree';
    // Keep itemId/folderId so resolve can derive the folder and find the copy
    // as a sibling of the currently-known file; resolve overwrites them on success.
    saveLanreeCfg({ fileName, query });
    setStatus('Looking for the file…');
    try { const f = await lanreeResolveFile(); setStatus(`Found “${f.name}”. Ready to send.`, true); }
    catch (e) { setStatus(e.message, false); }
  });

  document.getElementById('lanree-enabled')?.addEventListener('change', (e) => {
    saveLanreeCfg({ enabled: e.target.checked });
  });
}

      </div>

      localStorage.setItem('welcomed', 'yes');

});
