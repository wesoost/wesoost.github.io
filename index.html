// ================================================================
//   EVENT HANDLERS
// ================================================================
function attachHandlers() {
  // Navigation buttons
  document.querySelectorAll('[data-nav]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      const nav = el.dataset.nav;
      const id = el.dataset.id;
      if (nav === 'profile') setView('profile', { clientId: id });
      else if (nav === 'treatment') {
        if (id === 'new') {
          setView('treatment', { clientId: state.selectedClientId, treatmentId: 'new' });
        } else {
          setView('treatment', { treatmentId: id });
        }
      }
      else if (nav === 'rates') setView('rates', { clientId: id || state.selectedClientId });
      else if (nav === 'new-client') { state.editClientId = null; setView('new-client'); } // "+" always means a fresh client
      else if (nav === 'today') { state.dayDate = todayISO(); setView('today'); } // the Today tab/back buttons always land on today
      else setView(nav);
    });
  });

  // Clients list search
  if (state.view === 'clients') setupClients();
  // End of Day period summary range controls
  if (state.view === 'eod') setupEndOfDay();
  // New Client form
  if (state.view === 'new-client') setupNewClientForm();
  // Profile delete
  if (state.view === 'profile') setupProfile();
  // Treatment detail
  if (state.view === 'treatment') setupTreatment();
  // Rates
  if (state.view === 'rates') setupRates();
  // Settings
  if (state.view === 'settings') { setupSettings(); setupLanree(); }
  // Schedule
  if (state.view === 'schedule') setupSchedule();
  // Appointment add/edit form
  if (state.view === 'appt-form') setupAppointmentForm();
  // Today / day view: appointment taps + the date picker
  if (state.view === 'today') {
    setupSchedule();   // wires the appointment row taps + add/edit shown for the day
    const dayInput = document.getElementById('day-date');
    if (dayInput) dayInput.addEventListener('change', (e) => {
      state.dayDate = e.target.value || todayISO();
      render();
    });
  }
}

// ---------- End of Day Handlers ----------
// Period summary range: preset chips set both ends; the From/To pickers allow any
// custom range. Each change updates state and re-renders the view.
function setupEndOfDay() {
  document.querySelectorAll('[data-eod-preset]').forEach(btn => {
    btn.addEventListener('click', () => {
      const [s, e] = eodPresetRange(btn.dataset.eodPreset);
      state.eodStart = s;
      state.eodEnd = e;
      render();
    });
  });

  const startInput = document.getElementById('eod-start');
  const endInput = document.getElementById('eod-end');
  if (startInput) startInput.addEventListener('change', () => {
    if (!startInput.value) return;
    state.eodStart = startInput.value;
    // Keep the range coherent: never let the start run past the end.
    if (state.eodEnd && startInput.value > state.eodEnd) state.eodEnd = startInput.value;
    render();
  });
  if (endInput) endInput.addEventListener('change', () => {
    if (!endInput.value) return;
    state.eodEnd = endInput.value;
    if (state.eodStart && endInput.value < state.eodStart) state.eodStart = endInput.value;
    render();
  });

  // Tap a product row (day or period breakdown) → client-name breakdown pop-up.
  document.querySelectorAll('[data-bd]').forEach(row => {
    row.addEventListener('click', () => {
      openProductBreakdown(row.dataset.bd, row.dataset.bdStart, row.dataset.bdEnd);
    });
  });
}

// Pop-up listing every client who had `product` between startISO..endISO (inclusive),
// with their units, visit count, charge and profit — plus a totals footer. Profit is
// summed per-client via lineCostProfit (linear), so it matches the Summary table.
function openProductBreakdown(product, startISO, endISO) {
  const txs = state.data.treatments.filter(t =>
    t.product === product && t.date >= startISO && t.date <= endISO);

  const byClient = {};
  txs.forEach(t => {
    const id = t.clientId || '_none';
    if (!byClient[id]) byClient[id] = { units: 0, revenue: 0, count: 0 };
    byClient[id].units += t.totalUnits || 0;
    byClient[id].revenue += t.totalCharge || 0;
    byClient[id].count++;
  });
  const rows = Object.entries(byClient).map(([id, d]) => {
    const c = getClient(id);
    const name = c ? (`${c.firstName || ''} ${c.lastName || ''}`.trim() || 'Unnamed client') : 'Unknown client';
    const { profit } = lineCostProfit(product, d.units, d.revenue);
    return { clientId: c ? c.id : null, name, profit, ...d };
  }).sort((a, b) => b.revenue - a.revenue || b.units - a.units);

  const totUnits = rows.reduce((s, r) => s + r.units, 0);
  const totRev = rows.reduce((s, r) => s + r.revenue, 0);
  const totProfit = rows.reduce((s, r) => s + r.profit, 0);

  const isMl = isMlProduct(product), isFlat = isFlatFeeProduct(product);
  const unitStr = (u) => isFlat ? '' : `${u}${isMl ? 'ml' : 'u'} · `;
  const rangeLabel = startISO === endISO ? formatDate(startISO, 'full')
    : `${formatDate(startISO)} – ${formatDate(endISO)}`;

  document.getElementById('product-breakdown')?.remove();
  const overlay = document.createElement('div');
  overlay.id = 'product-breakdown';
  overlay.className = 'bd-overlay';
  overlay.innerHTML = `
    <div class="bd-sheet">
      <div class="bd-head">
        <div class="bd-titles">
          <div class="bd-product"><span style="width:6px;height:22px;border-radius:3px;background:${productColor(product)};display:inline-block;flex-shrink:0;"></span>${escapeHtml(product)}</div>
          <div class="bd-range">${rangeLabel} · ${rows.length} client${rows.length === 1 ? '' : 's'}</div>
        </div>
        <button class="bd-close" id="bd-close" aria-label="Close">✕</button>
      </div>
      <div class="bd-list">
        ${rows.length ? rows.map(r => `
          <div class="bd-client"${r.clientId ? ` data-cid="${escapeHtml(r.clientId)}"` : ''}>
            <div style="flex:1;min-width:0;">
              <div class="bd-name">${escapeHtml(r.name)}</div>
              <div class="bd-sub">${unitStr(r.units)}${r.count} visit${r.count === 1 ? '' : 's'}</div>
            </div>
            <div class="bd-amt">
              <div class="bd-charge">$${r.revenue.toFixed(0)}</div>
              <div class="bd-profit" style="color:${profitColor(r.profit)};">${profitText(r.profit)}</div>
            </div>
            ${r.clientId ? '<div class="bd-go" aria-hidden="true">›</div>' : ''}
          </div>
        `).join('') : '<div style="padding:34px 0;text-align:center;color:#a8a29e;">No treatments in this period.</div>'}
      </div>
      <div class="bd-foot">
        <div class="bd-name">Total${isFlat ? '' : ` · ${totUnits}${isMl ? 'ml' : 'u'}`}</div>
        <div class="bd-amt">
          <div class="bd-charge">$${totRev.toFixed(0)}</div>
          <div class="bd-profit" style="color:${profitColor(totProfit)};">${profitText(totProfit)}</div>
        </div>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  const close = () => overlay.remove();
  overlay.querySelector('#bd-close').addEventListener('click', close);
  // Tap the dark scrim (outside the sheet) to dismiss.
  overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
  // Tap a client row → open that client's profile (their treatment history).
  // DIRECT per-row listeners, not delegation: iOS Safari only reliably fires a
  // click on a non-<button> element when the handler is bound to it directly
  // (delegated bubbling from a tapped <div> is unreliable). Rows for unknown/
  // unlinked clients have no data-cid, so they stay inert.
  overlay.querySelectorAll('.bd-client[data-cid]').forEach(row => {
    row.addEventListener('click', () => {
      close();
      setView('profile', { clientId: row.dataset.cid });
    });
  });
}

// ---------- Clients List Handlers ----------
// Live-filters the rendered client list in place as the user types, matching on
// name and phone. Filtering the DOM (rather than re-rendering) keeps the input
// focused between keystrokes.
function setupClients() {
  const input = document.getElementById('client-search');
  const list = document.getElementById('client-list');
  if (!input || !list) return;

  input.addEventListener('input', () => {
    const q = input.value.trim().toLowerCase();
    const items = list.querySelectorAll('.list-item');
    let visible = 0;
    items.forEach(item => {
      const match = !q || (item.dataset.search || '').includes(q);
      item.style.display = match ? '' : 'none';
      if (match) visible++;
    });

    // Section headers + A–Z rail are for browsing the full list — hide them
    // while a search query is narrowing it, restore when the query is cleared.
    const browsing = !q;
    list.querySelectorAll('.cl-sec').forEach(h => h.style.display = browsing ? '' : 'none');
    const railEl = document.querySelector('.az-rail');
    if (railEl) railEl.style.display = browsing ? '' : 'none';

    // Show a "no matches" note when a query hides every client.
    let note = document.getElementById('client-no-results');
    if (q && visible === 0) {
      if (!note) {
        note = document.createElement('div');
        note.id = 'client-no-results';
        note.className = 'empty';
        note.innerHTML = `${I.search}<div class="empty-title" style="margin-top:12px;">No matches</div><div class="empty-body">No clients match your search.</div>`;
        list.appendChild(note);
      }
      note.style.display = '';
    } else if (note) {
      note.style.display = 'none';
    }
  });

  // A–Z rail: tap a letter (or slide a finger down the rail) to jump to that
  // section. Direct handlers on the rail; letters with no clients are disabled
  // so they don't fire. scrollIntoView scrolls the .screen container.
  const rail = document.querySelector('.az-rail');
  if (rail) {
    const jump = (L, smooth) => {
      const sec = document.getElementById('cl-sec-' + L);
      if (sec) sec.scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', block: 'start' });
    };
    rail.addEventListener('click', (e) => {
      const b = e.target.closest('.az-letter[data-jump]');
      if (b) jump(b.dataset.jump, true);
    });
    // Slide to scrub: jump to whichever letter is under the moving touch point.
    rail.addEventListener('touchmove', (e) => {
      const t = e.touches && e.touches[0];
      if (!t) return;
      const el = document.elementFromPoint(t.clientX, t.clientY);
      const b = el && el.closest && el.closest('.az-letter[data-jump]');
      if (b) { e.preventDefault(); jump(b.dataset.jump, false); }
    }, { passive: false });
  }
}

// ---------- New Client Handlers ----------
function setupNewClientForm() {
  const fields = ['nc-firstName', 'nc-lastName', 'nc-dob', 'nc-phone', 'nc-allergies', 'nc-notes'];
  const saveBtn = document.getElementById('save-client');

  function check() {
    // Only a name is required so imported / partial clients can be saved and
    // the rest (DOB, phone, allergies) filled in later.
    const fn = document.getElementById('nc-firstName').value.trim();
    const ln = document.getElementById('nc-lastName').value.trim();
    const valid = !!(fn || ln);
    saveBtn.classList.toggle('disabled', !valid);
    return valid;
  }

  fields.forEach(id => {
    document.getElementById(id).addEventListener('input', check);
  });

  // Allergy quick chips
  document.querySelectorAll('.allergy-tag').forEach(btn => {
    btn.addEventListener('click', () => {
      const ta = document.getElementById('nc-allergies');
      const tag = btn.dataset.tag;
      const current = ta.value.trim();
      ta.value = current ? `${current}, ${tag}` : tag;
      check();
    });
  });

  saveBtn.addEventListener('click', () => {
    if (!check()) return;
    const fields = {
      firstName: document.getElementById('nc-firstName').value.trim(),
      lastName: document.getElementById('nc-lastName').value.trim(),
      dob: document.getElementById('nc-dob').value,
      phone: document.getElementById('nc-phone').value.trim(),
      allergies: document.getElementById('nc-allergies').value.trim(),
      notes: document.getElementById('nc-notes').value.trim()
    };
    const editing = state.editClientId ? getClient(state.editClientId) : null;
    if (editing) {
      Object.assign(editing, fields);   // update in place — keeps id, rates, clientSince
      saveData();
      const id = editing.id;
      state.editClientId = null;
      setView('profile', { clientId: id });
    } else {
      const client = { id: uid(), ...fields, rates: {}, clientSince: todayISO() };
      state.data.clients.push(client);
      saveData();
      setView('profile', { clientId: client.id });
    }
  });

  check();
}

// ---------- Profile Handlers ----------
function setupProfile() {
  document.querySelectorAll('[data-edit-client]').forEach(b => b.addEventListener('click', () => {
    state.editClientId = state.selectedClientId;
    setView('new-client');   // the new-client form renders in edit mode when editClientId is set
  }));

  // Delete uses an on-screen confirm panel, NOT native confirm() — iOS suppresses
  // dialogs (returns false) so the old confirm() made Delete do nothing. See
  // [[ios-no-dialog-after-await]].
  const delBtn = document.getElementById('delete-client-btn');
  const delPanel = document.getElementById('delete-client-confirm');
  if (delBtn && delPanel) {
    delBtn.addEventListener('click', () => {
      const c = getClient(state.selectedClientId);
      if (!c) return;
      const txCount = state.data.treatments.filter(t => t.clientId === c.id).length;
      const name = `${c.firstName || ''} ${c.lastName || ''}`.trim() || 'this client';
      const msg = document.getElementById('delete-client-msg');
      if (msg) msg.textContent = txCount > 0
        ? `Delete ${name} and all ${txCount} treatment record${txCount === 1 ? '' : 's'} (including photos)? This cannot be undone.`
        : `Delete ${name}? This cannot be undone.`;
      delPanel.style.display = 'block';
      delPanel.scrollIntoView({ block: 'nearest' });
    });
    document.getElementById('delete-client-cancel')?.addEventListener('click', () => {
      delPanel.style.display = 'none';
    });
    document.getElementById('delete-client-go')?.addEventListener('click', async () => {
      const c = getClient(state.selectedClientId);
      if (!c) return;
      const clientTxs = state.data.treatments.filter(t => t.clientId === c.id);
      // Clean up every photo (all slots) attached to this client's treatments
      for (const tx of clientTxs) {
        const ph = tx.photos || {};
        for (const s of PHOTO_SLOTS) {
          if (ph[s.key]) await deletePhoto(ph[s.key]).catch(() => {});
        }
      }
      if (c.consentPhotoId) await deletePhoto(c.consentPhotoId).catch(() => {});
      state.data.clients = state.data.clients.filter(x => x.id !== c.id);
      state.data.treatments = state.data.treatments.filter(t => t.clientId !== c.id);
      saveData();
      setView('clients');
    });
  }

  // Consent photo: tapping the thumbnail opens the camera; the captured image is
  // compressed, stored in IndexedDB, and its id saved on the client record
  // (c.consentPhotoId) so it persists and shows next to the client photo. Tapping
  // again retakes/replaces it. (No alert() after await — suppressed on iPad; we
  // show status inside the thumbnail instead. See [[ios-no-dialog-after-await]].)
  const consentThumb = document.getElementById('consent-thumb');
  const consentFile = document.getElementById('consent-file');
  const consentFileLib = document.getElementById('consent-file-lib');
  if (consentThumb && consentFile && consentFileLib) {
    consentThumb.addEventListener('click', () => {
      const client = getClient(state.selectedClientId);
      if (client && client.consentPhotoId) openConsentViewer(state.selectedClientId);  // view full-screen
      else chooseConsentSource();                                                      // none yet → pick source
    });
    // Both inputs (camera + library) commit through the same path.
    const commitConsent = async (file) => {
      const client = getClient(state.selectedClientId);
      if (!file || !client) return;
      consentThumb.innerHTML = '<span style="font-size:10px;color:#92400e;font-family:Inter,sans-serif;">…</span>';
      try {
        const dataUrl = await compressPhoto(file);
        if (!dataUrl) throw new Error('no image data');
        const oldId = client.consentPhotoId || null;
        const photoId = 'consent_' + uid();
        await savePhoto(photoId, dataUrl);
        client.consentPhotoId = photoId;
        saveData();
        if (oldId) deletePhoto(oldId).catch(() => {});
        render();
      } catch (err) {
        console.error('Consent photo error:', err);
        consentThumb.innerHTML = '<span style="font-size:9px;color:#b91c1c;font-family:Inter,sans-serif;line-height:1.2;">Failed<br>tap to retry</span>';
      }
    };
    consentFile.addEventListener('change', (e) => { const f = e.target.files[0]; e.target.value = ''; commitConsent(f); });
    consentFileLib.addEventListener('change', (e) => { const f = e.target.files[0]; e.target.value = ''; commitConsent(f); });
  }

  // "+ Review" chip on the most recent treatment: open that treatment with its
  // Review column pre-enabled (the review is recorded alongside the treatment and
  // saved as a linked $0-charge record — see commitTreatmentDraft). stopPropagation
  // keeps the tap off the row's own data-nav (open-treatment) handler.
  document.querySelectorAll('[data-review-from]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      const tx = state.data.treatments.find(x => x.id === btn.dataset.reviewFrom);
      if (!tx) return;
      const reviewProduct = REVIEW_CHILD[tx.product];
      if (!reviewProduct) return;
      window._pendingReviewProduct = reviewProduct;   // viewTreatment pre-enables the review
      setView('treatment', { treatmentId: tx.id });
    });
  });

  // Timeline thumbnails are populated by loadPhotoThumbnails(), called from render().
}

// Consent photo source picker: an on-screen overlay (NOT native dialogs — iOS
// suppresses those, see [[ios-no-dialog-after-await]]) offering Take photo (camera
// input, capture=environment) or Choose from library (plain file input). Each
// button triggers the matching hidden input within the tap gesture, so iOS opens
// the camera / photo picker reliably. Used for both first capture and retake.
function chooseConsentSource() {
  document.getElementById('consent-source')?.remove();
  const overlay = document.createElement('div');
  overlay.id = 'consent-source';
  overlay.style.cssText = 'position:fixed;inset:0;z-index:1000;background:rgba(28,25,23,.55);display:flex;align-items:flex-end;justify-content:center;';
  overlay.innerHTML = `
    <div style="background:#fafaf9;width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.2);">
      <div style="font-size:15px;font-weight:700;color:#1c1917;text-align:center;margin-bottom:16px;">Consent photo</div>
      <button class="btn" id="consent-src-cam" style="width:100%;background:#92400e;color:#fafaf9;font-weight:600;margin-bottom:10px;">${I.camera} Take photo</button>
      <button class="btn" id="consent-src-lib" style="width:100%;background:#f5f5f4;color:#1c1917;font-weight:600;margin-bottom:10px;">Choose from library</button>
      <button class="btn" id="consent-src-cancel" style="width:100%;background:transparent;color:#78716c;font-weight:500;">Cancel</button>
    </div>`;
  document.body.appendChild(overlay);
  const close = () => overlay.remove();
  overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
  overlay.querySelector('#consent-src-cancel').addEventListener('click', close);
  overlay.querySelector('#consent-src-cam').addEventListener('click', () => {
    close();
    const el = document.getElementById('consent-file');
    if (el) { el.value = ''; el.click(); }
  });
  overlay.querySelector('#consent-src-lib').addEventListener('click', () => {
    close();
    const el = document.getElementById('consent-file-lib');
    if (el) { el.value = ''; el.click(); }
  });
}

// Full-screen viewer for a client's consent photo. Since the app disables native
// pinch-zoom (viewport user-scalable=no), zoom is via +/- buttons and double-tap;
// when zoomed the image overflows a scrollable container so it can be panned.
async function openConsentViewer(clientId) {
  const client = getClient(clientId);
  if (!client || !client.consentPhotoId) return;
  document.getElementById('consent-viewer')?.remove();

  const overlay = document.createElement('div');
  overlay.id = 'consent-viewer';
  overlay.className = 'cv-overlay';
  overlay.innerHTML = `
    <div class="cv-bar">
      <button class="cv-btn" id="cv-close">${I.chevronLeft}<span>Close</span></button>
      <button class="cv-btn" id="cv-retake">${I.camera}<span>Retake</span></button>
    </div>
    <div class="cv-scroll" id="cv-scroll"><img class="cv-img" id="cv-img" alt="Consent photo"></div>
    <div class="cv-zoom">
      <button id="cv-out" aria-label="Zoom out">&minus;</button>
      <button id="cv-fit" class="mid" aria-label="Fit to screen">Fit</button>
      <button id="cv-in" aria-label="Zoom in">+</button>
    </div>
  `;
  document.body.appendChild(overlay);

  const img = overlay.querySelector('#cv-img');
  const scroll = overlay.querySelector('#cv-scroll');
  try {
    const dataUrl = await getPhoto(client.consentPhotoId);
    if (dataUrl) img.src = dataUrl;
  } catch (e) { /* leave blank if it can't load */ }

  let zoom = 1; // 1 = fit to screen
  function apply() {
    if (zoom <= 1) {
      scroll.classList.remove('zoomed');
      img.style.width = ''; img.style.height = '';
    } else {
      scroll.classList.add('zoomed');
      img.style.width = (scroll.clientWidth * zoom) + 'px';
      img.style.height = 'auto';
    }
  }
  overlay.querySelector('#cv-in').addEventListener('click', () => { zoom = Math.min((zoom < 1 ? 1 : zoom) + 0.5, 5); apply(); });
  overlay.querySelector('#cv-out').addEventListener('click', () => { zoom = Math.max(zoom - 0.5, 1); apply(); });
  overlay.querySelector('#cv-fit').addEventListener('click', () => { zoom = 1; apply(); scroll.scrollTo(0, 0); });

  // Double-tap the image toggles between fit and 2.5x
  let lastTap = 0;
  img.addEventListener('click', () => {
    const now = Date.now();
    if (now - lastTap < 300) { zoom = (zoom > 1) ? 1 : 2.5; apply(); scroll.scrollTo(0, 0); }
    lastTap = now;
  });

  overlay.querySelector('#cv-close').addEventListener('click', () => overlay.remove());
  overlay.querySelector('#cv-retake').addEventListener('click', () => {
    overlay.remove();
    chooseConsentSource();
  });
}

// Full-screen before/after comparison. Reads the current treatment draft's photos
// (the Compare button only exists on the treatment page) and shows two panes side
// by side, each with chips to pick which slot it displays. Defaults to the first
// two slots that hold a photo.
async function openComparison() {
  const t = window._txDraft;
  if (!t) return;
  const avail = PHOTO_SLOTS.filter(s => (t.photos || {})[s.key]);
  if (avail.length < 2) return;
  document.getElementById('comparison-viewer')?.remove();

  let leftKey = avail[0].key;
  let rightKey = avail[1].key;

  const client = getClient(t.clientId);
  const title = client ? `${escapeHtml(client.firstName)} ${escapeHtml(client.lastName)}` : 'Comparison';
  const overlay = document.createElement('div');
  overlay.id = 'comparison-viewer';
  overlay.className = 'cmp-overlay';
  overlay.innerHTML = `
    <div class="cv-bar">
      <button class="cv-btn" id="cmp-close">${I.chevronLeft}<span>Close</span></button>
      <div class="cmp-title">${title} · ${formatDate(t.date)}</div>
      <span style="width:84px;flex-shrink:0;"></span>
    </div>
    <div class="cmp-panes">
      <div class="cmp-pane">
        <div class="cmp-chips" id="cmp-chips-left"></div>
        <div class="cmp-img"><img id="cmp-img-left" alt=""></div>
      </div>
      <div class="cmp-pane">
        <div class="cmp-chips" id="cmp-chips-right"></div>
        <div class="cmp-img"><img id="cmp-img-right" alt=""></div>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  // Cache loaded data URLs so re-selecting a slot doesn't re-hit IndexedDB.
  const cache = {};
  async function dataFor(key) {
    const id = (t.photos || {})[key];
    if (!id) return null;
    if (!(id in cache)) { try { cache[id] = await getPhoto(id); } catch (e) { cache[id] = null; } }
    return cache[id];
  }
  function renderChips(side, activeKey) {
    const wrap = overlay.querySelector(side === 'left' ? '#cmp-chips-left' : '#cmp-chips-right');
    wrap.innerHTML = avail.map(s =>
      `<button class="cmp-chip ${s.key === activeKey ? 'active' : ''}" data-side="${side}" data-key="${s.key}">${escapeHtml(s.label)}</button>`
    ).join('');
  }
  async function showPane(side, key) {
    if (side === 'left') leftKey = key; else rightKey = key;
    renderChips(side, key);
    const img = overlay.querySelector(side === 'left' ? '#cmp-img-left' : '#cmp-img-right');
    const url = await dataFor(key);
    img.src = url || '';
  }

  overlay.addEventListener('click', (e) => {
    const chip = e.target.closest('.cmp-chip');
    if (chip) showPane(chip.dataset.side, chip.dataset.key);
  });
  overlay.querySelector('#cmp-close').addEventListener('click', () => overlay.remove());

  showPane('left', leftKey);
  showPane('right', rightKey);
}

// ---------- Treatment Handlers ----------
function setupTreatment() {
  const t = window._txDraft;
  if (!t) return;

  // Before/after comparison overlay (shown only when ≥2 slots have a photo).
  document.getElementById('compare-photos')?.addEventListener('click', () => openComparison());

  // Product select (native select element - works reliably on iOS)
  const productSelect = document.getElementById('product-select');
  productSelect?.addEventListener('change', () => {
    const newProduct = productSelect.value;
    const oldWasMl = isMlProduct(t.product);
    const newIsMl = isMlProduct(newProduct);
    if (oldWasMl !== newIsMl) {
      t.areas = newIsMl ? { [mlAreaName(newProduct)]: 0 } : { Glabella: 0, Frontalis: 0, "Crow's feet": 0, Masseters: 0 };
      if (!newIsMl) { t.areaLabel = ''; t.productDetail = ''; }   // ml-only fields don't apply to toxins/flat
    } else if (newIsMl) {
      // Filler ↔ SkinVive: same shape, but area key differs (Lips vs Cheeks).
      const oldKey = mlAreaName(t.product);
      const newKey = mlAreaName(newProduct);
      if (oldKey !== newKey) {
        t.areas = { [newKey]: t.areas[oldKey] || 0 };
      }
    }
    t.product = newProduct;
    t.rateOverride = null;
    // Reviews only apply to toxins; switching to Filler/SkinVive/Keloid/Consultation
    // (or a Review product itself) drops any in-progress review draft.
    if (!['Botox','Xeomin','Relfydess'].includes(newProduct)) t._review = null;
    render();
  });

  // Review (2-week follow-up) controls — second dropdown + Review units column.
  document.getElementById('review-select')?.addEventListener('change', (e) => {
    const val = e.target.value;
    if (!val) {
      t._review = null;                 // "None"
    } else if (t._review) {
      t._review.product = val;          // switch review product, keep entered units
    } else {
      let d = addDaysISO(t.date || todayISO(), 14);   // default ~2 weeks after the treatment
      const today = todayISO();
      if (d > today) d = today;                        // never a future date
      t._review = {
        product: val,
        date: d,
        areas: { Glabella: 0, Frontalis: 0, "Crow's feet": 0, Masseters: 0 },
        others: (t.others || []).map(() => '')
      };
    }
    t._dirty = true;
    render();
  });
  document.getElementById('tx-review-date')?.addEventListener('change', (e) => {
    if (t._review && e.target.value) t._review.date = e.target.value;
  });
  document.querySelectorAll('.review-units-input').forEach(inp => {
    inp.addEventListener('input', () => {
      if (!t._review) return;
      if (!t._review.areas) t._review.areas = {};
      t._review.areas[inp.dataset.key] = parseFloat(inp.value) || 0;
      recalcTotals();
    });
  });
  document.querySelectorAll('.review-other-input').forEach(inp => {
    inp.addEventListener('input', () => {
      if (!t._review) return;
      if (!Array.isArray(t._review.others)) t._review.others = [];
      t._review.others[parseInt(inp.dataset.index)] = inp.value;
      recalcTotals();
    });
  });

  // Batch number & reconstitution date
  document.getElementById('tx-batch')?.addEventListener('input', (e) => {
    t.batchNumber = e.target.value;
  });
  document.getElementById('tx-reconDate')?.addEventListener('change', (e) => {
    t.reconstitutionDate = e.target.value;
  });
  document.getElementById('tx-date')?.addEventListener('change', (e) => {
    if (e.target.value) t.date = e.target.value;
  });
  document.getElementById('tx-notes')?.addEventListener('input', (e) => {
    t.notes = e.target.value;
  });
  // Filler / per-ml products: free-text "Product used" + free-text area name.
  document.getElementById('tx-product-detail')?.addEventListener('input', (e) => {
    t.productDetail = e.target.value;
  });
  document.getElementById('tx-area-label')?.addEventListener('input', (e) => {
    t.areaLabel = e.target.value;
  });

  // Mark the draft dirty on any form edit, so an existing treatment auto-saves
  // on exit only when something actually changed (a no-op view never rewrites
  // the saved record). Rate/photo/annotation edits set the flag explicitly.
  const screenBody = document.querySelector('.screen-body');
  const markDirty = (e) => { if (!e.target || e.target.type !== 'file') t._dirty = true; };
  screenBody?.addEventListener('input', markDirty);
  screenBody?.addEventListener('change', markDirty);

  // --- PHOTOS (per slot) ---
  if (!Array.isArray(t.strokes)) t.strokes = [];
  if (!t.photos) t.photos = { before: null, treatment: null, review: null };

  // Load each slot's photo from IndexedDB. (No slot is annotated anymore, so the
  // slot.annotate branch below never fires; kept harmless for legacy code paths.)
  PHOTO_SLOTS.forEach(slot => {
    const img = document.getElementById('photo-preview-' + slot.key);
    const id = t.photos[slot.key];
    if (img && id) {
      getPhoto(id).then(dataUrl => {
        if (dataUrl && img) {
          img.src = dataUrl;
          if (slot.annotate) img.onload = () => initCanvas();
        }
      }).catch(e => console.error('Could not load photo', e));
    }
  });

  function initCanvas() {
    const canvas = document.getElementById('photo-canvas-' + ANNOTATED_SLOT);
    if (!canvas) return;
    // Match canvas resolution to displayed size * devicePixelRatio for crisp lines
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    redrawCanvas(canvas);
    attachCanvasEvents(canvas);
  }

  function redrawCanvas(canvas) {
    const ctx = canvas.getContext('2d');
    const rect = canvas.getBoundingClientRect();
    ctx.clearRect(0, 0, rect.width, rect.height);
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 3; // medium pen
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for (const stroke of t.strokes) {
      if (!stroke.points || stroke.points.length < 2) continue;
      ctx.beginPath();
      const first = stroke.points[0];
      ctx.moveTo(first.x * rect.width, first.y * rect.height);
      for (let i = 1; i < stroke.points.length; i++) {
        const pt = stroke.points[i];
        ctx.lineTo(pt.x * rect.width, pt.y * rect.height);
      }
      ctx.stroke();
    }
  }

  function attachCanvasEvents(canvas) {
    let currentStroke = null;
    const rect = () => canvas.getBoundingClientRect();

    function getPoint(e) {
      const r = rect();
      const touch = e.touches ? e.touches[0] : e;
      return {
        x: (touch.clientX - r.left) / r.width,
        y: (touch.clientY - r.top) / r.height
      };
    }

    function findStrokeAt(pt) {
      // Find the topmost stroke whose path passes near the point (for erase)
      const r = rect();
      const threshold = 20 / Math.min(r.width, r.height); // ~20px in normalized coords
      for (let i = t.strokes.length - 1; i >= 0; i--) {
        const s = t.strokes[i];
        for (const p of s.points) {
          const dx = p.x - pt.x;
          const dy = p.y - pt.y;
          if (Math.sqrt(dx * dx + dy * dy) < threshold) return i;
        }
      }
      return -1;
    }

    function handleStart(e) {
      e.preventDefault();
      const pt = getPoint(e);
      if (t._eraseMode) {
        const idx = findStrokeAt(pt);
        if (idx >= 0) {
          t.strokes.splice(idx, 1);
          t._dirty = true;
          redrawCanvas(canvas);
        }
        return;
      }
      currentStroke = { points: [pt] };
      t.strokes.push(currentStroke);
      t._dirty = true;
      drawLastSegment(canvas);
    }

    function handleMove(e) {
      e.preventDefault();
      const pt = getPoint(e);
      if (t._eraseMode) {
        // Allow drag-to-erase
        if (e.type === 'touchmove' || (e.buttons & 1)) {
          const idx = findStrokeAt(pt);
          if (idx >= 0) {
            t.strokes.splice(idx, 1);
            t._dirty = true;
            redrawCanvas(canvas);
          }
        }
        return;
      }
      if (!currentStroke) return;
      currentStroke.points.push(pt);
      drawLastSegment(canvas);
    }

    function handleEnd(e) {
      e.preventDefault();
      currentStroke = null;
    }

    // Touch events (primary on iPad)
    canvas.addEventListener('touchstart', handleStart, { passive: false });
    canvas.addEventListener('touchmove', handleMove, { passive: false });
    canvas.addEventListener('touchend', handleEnd, { passive: false });
    canvas.addEventListener('touchcancel', handleEnd, { passive: false });
    // Pointer events for Mac/trackpad testing
    canvas.addEventListener('pointerdown', handleStart);
    canvas.addEventListener('pointermove', handleMove);
    canvas.addEventListener('pointerup', handleEnd);
    canvas.addEventListener('pointerleave', handleEnd);
  }

  function drawLastSegment(canvas) {
    const stroke = t.strokes[t.strokes.length - 1];
    if (!stroke || stroke.points.length < 2) return;
    const ctx = canvas.getContext('2d');
    const r = canvas.getBoundingClientRect();
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    const a = stroke.points[stroke.points.length - 2];
    const b = stroke.points[stroke.points.length - 1];
    ctx.beginPath();
    ctx.moveTo(a.x * r.width, a.y * r.height);
    ctx.lineTo(b.x * r.width, b.y * r.height);
    ctx.stroke();
  }

  // Toolbar handlers
  document.getElementById('tool-pen')?.addEventListener('click', () => {
    t._eraseMode = false;
    render();
  });
  document.getElementById('tool-erase')?.addEventListener('click', () => {
    t._eraseMode = true;
    render();
  });
  document.getElementById('tool-undo')?.addEventListener('click', () => {
    if (t.strokes.length === 0) return;
    t.strokes.pop();
    t._dirty = true;
    const canvas = document.getElementById('photo-canvas-' + ANNOTATED_SLOT);
    if (canvas) redrawCanvas(canvas);
  });
  document.getElementById('tool-clear')?.addEventListener('click', () => {
    if (t.strokes.length === 0) return;
    if (!confirm('Clear all annotations on this photo?')) return;
    t.strokes = [];
    t._dirty = true;
    const canvas = document.getElementById('photo-canvas-' + ANNOTATED_SLOT);
    if (canvas) redrawCanvas(canvas);
  });
  document.getElementById('photo-toggle-marks')?.addEventListener('click', () => {
    const stack = document.getElementById('photo-stack-' + ANNOTATED_SLOT);
    const label = document.getElementById('marks-toggle-label');
    if (!stack) return;
    const hidden = stack.classList.toggle('marks-hidden');
    if (label) label.textContent = hidden ? 'Show marks' : 'Hide marks';
  });

  async function handlePhotoFile(file, inputEl, slot) {
    // Always reset the input value so the same file can be picked again
    if (inputEl) inputEl.value = '';

    if (!file) return;
    if (!PHOTO_SLOTS.some(s => s.key === slot)) return;

    // Always reference the canonical draft object, not a stale closure
    const draft = window._txDraft;
    if (!draft) {
      alert('Something went wrong — please tap Save first, then try adding the photo.');
      return;
    }
    if (!draft.photos) draft.photos = { before: null, treatment: null, review: null };

    // On-screen status (scoped to this slot's photo area) so we can see failures
    function showStatus(msg, isError) {
      const procId = 'photo-processing-' + slot;
      document.getElementById(procId)?.remove();
      const area = document.getElementById('photo-area-' + slot);
      if (!area) return;
      const overlay = document.createElement('div');
      overlay.id = procId;
      overlay.style.cssText = `position:absolute;inset:0;background:rgba(28,25,23,0.88);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;color:${isError?'#fca5a5':'#e7e5e4'};font-family:'Cormorant Garamond',serif;font-size:16px;text-align:center;padding:24px;`;
      const dismissId = 'dismiss-error-' + slot;
      overlay.innerHTML = `<div style="font-style:italic;line-height:1.4;">${msg}</div>${isError?`<button id="${dismissId}" style="margin-top:16px;padding:8px 18px;border-radius:999px;background:#fff;color:#1c1917;font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;font-family:Inter,sans-serif;">Dismiss</button>`:''}`;
      area.appendChild(overlay);
      if (isError) {
        document.getElementById(dismissId)?.addEventListener('click', () => overlay.remove());
      }
    }

    try {
      showStatus('Processing photo…');

      // Step 1: compress
      let dataUrl;
      try {
        dataUrl = await compressPhoto(file);
      } catch (e) {
        showStatus(`Could not process photo:<br><span style="font-size:13px;color:#fecaca;">${e.message||'unknown error'}</span>`, true);
        return;
      }
      if (!dataUrl) {
        showStatus('Photo processing produced no data. Try a different photo.', true);
        return;
      }

      // Step 2: save to IndexedDB.
      // Don't overwrite this slot's committed image — if the draft still points at
      // it (or has none yet), allocate a fresh id so the original survives until
      // Save. Reuse an existing in-session temp otherwise.
      const committed = committedSlotPhotoId(draft.id, slot);
      const current = draft.photos[slot];
      const photoId = (current && current !== committed) ? current : 'photo_' + uid();
      try {
        await savePhoto(photoId, dataUrl);
      } catch (e) {
        showStatus(`Could not save photo:<br><span style="font-size:13px;color:#fecaca;">${e.message||'storage error'}</span><br><br><span style="font-size:12px;color:#e7e5e4;">Storage may be full. Try deleting old photos or exporting a backup and erasing data.</span>`, true);
        return;
      }

      // Step 3: commit to draft and re-render
      draft.photos[slot] = photoId;
      if (slot === ANNOTATED_SLOT) draft.strokes = []; // new Treatment photo = fresh annotations
      draft._photoChanged = true;
      draft._dirty = true;
      render();
    } catch (e) {
      console.error('Unexpected photo error:', e);
      showStatus(`Unexpected error:<br><span style="font-size:13px;color:#fecaca;">${e.message||e}</span>`, true);
    }
  }

  function triggerPhotoInput(prefix, slot) {
    const inp = document.getElementById(prefix + slot);
    if (inp) { inp.value = ''; inp.click(); }
  }

  async function removeSlotPhoto(slot) {
    const annotated = slot === ANNOTATED_SLOT;
    if (!confirm(annotated ? 'Remove this photo and all annotations?' : 'Remove this photo?')) return;
    const draft = window._txDraft;
    if (!draft || !draft.photos) return;
    // Delete now only if it's an uncommitted in-session capture; a committed image
    // is kept and removed on Save, so backing out can undo this.
    const current = draft.photos[slot];
    if (current && current !== committedSlotPhotoId(draft.id, slot)) {
      await deletePhoto(current).catch(() => {});
    }
    draft.photos[slot] = null;
    if (annotated) draft.strokes = [];
    draft._dirty = true;
    render();
  }

  // Take / Choose / Replace / Remove — delegated by data-slot so every slot works.
  document.querySelectorAll('[data-photo-action]').forEach(btn => {
    btn.addEventListener('click', () => {
      const slot = btn.dataset.slot;
      switch (btn.dataset.photoAction) {
        case 'take': triggerPhotoInput('photo-cam-', slot); break;
        case 'pick': triggerPhotoInput('photo-lib-', slot); break;
        case 'replace':
          if (confirm('Replace photo?\n\nTap OK to take a new photo with camera, or Cancel to choose from library.')) triggerPhotoInput('photo-cam-', slot);
          else triggerPhotoInput('photo-lib-', slot);
          break;
        case 'remove': removeSlotPhoto(slot); break;
      }
    });
  });
  document.querySelectorAll('input[type="file"][data-slot]').forEach(inp => {
    inp.addEventListener('change', (e) => handlePhotoFile(e.target.files[0], e.target, e.target.dataset.slot));
  });

  // Area units
  document.querySelectorAll('.area-units-input').forEach(inp => {
    inp.addEventListener('input', () => {
      const key = inp.dataset.key;
      t.areas[key] = parseFloat(inp.value) || 0;
      recalcTotals();
    });
  });

  // Other rows
  document.querySelectorAll('.other-label').forEach(inp => {
    inp.addEventListener('input', () => {
      const idx = parseInt(inp.dataset.index);
      t.others[idx].label = inp.value;
    });
  });
  document.querySelectorAll('.other-units-input').forEach(inp => {
    inp.addEventListener('input', () => {
      const idx = parseInt(inp.dataset.index);
      t.others[idx].units = inp.value;
      recalcTotals();
    });
  });

  // Rate edit — inline number input (native prompt() is suppressed in the iOS
  // standalone / Files-app web view, so the old "edit" button did nothing). Typing
  // updates the override live; blur re-renders to refresh the badge/Reset/context.
  const rateInput = document.getElementById('tx-rate-input');
  rateInput?.addEventListener('input', () => {
    const v = parseFloat(rateInput.value);
    if (isNaN(v) || v < 0) return;
    t.rateOverride = v;
    t._dirty = true;
    if (isFlatFeeProduct(t.product)) {
      const big = document.getElementById('total-charge-big');
      const cents = document.getElementById('total-charge-cents');
      if (big) big.textContent = Math.floor(v).toLocaleString();
      if (cents) cents.textContent = v.toFixed(2).split('.')[1];
    } else {
      recalcTotals();
    }
  });
  rateInput?.addEventListener('change', () => {
    const v = parseFloat(rateInput.value);
    if (!isNaN(v) && v >= 0) { t.rateOverride = v; t._dirty = true; }
    render();   // refresh Override badge, Reset button and the default-rate context line
  });

  document.getElementById('reset-rate')?.addEventListener('click', () => {
    t.rateOverride = null;
    t._dirty = true;
    render();
  });

  // Save. The 0-units "Save anyway?" check uses an on-screen confirm panel, NOT
  // native confirm() — iOS suppresses confirm() in the standalone/Files-app web
  // view (returns false), which silently blocked saving a 0-unit treatment.
  function doSaveTx() {
    const record = commitTreatmentDraft(t);
    // Committed: clear the draft so the exit hook in setView() doesn't auto-save
    // or treat the now-saved photo as an orphan when we navigate away below.
    window._txDraft = null;
    setView('profile', { clientId: record.clientId });
  }
  const saveConfirm = document.getElementById('save-tx-confirm');
  document.getElementById('save-tx')?.addEventListener('click', () => {
    const isMl = isMlProduct(t.product);
    const standardAreas = isMl ? [mlAreaName(t.product)] : ['Glabella','Frontalis',"Crow's feet",'Masseters'];
    let totalUnits = standardAreas.reduce((s, k) => s + (parseFloat(t.areas[k]) || 0), 0);
    if (!isMl) {
      totalUnits += t.others.reduce((s, o) => s + (parseFloat(o.units) || 0), 0);
    }
    // Flat-fee services and Review products are allowed to save at 0 units
    // silently — a Review is the whole point of a no-charge follow-up visit.
    if (!isFlatFeeProduct(t.product) && !isReviewProduct(t.product) && totalUnits === 0) {
      if (saveConfirm) { saveConfirm.style.display = 'block'; saveConfirm.scrollIntoView({ block: 'center' }); }
      return;
    }
    doSaveTx();
  });
  document.getElementById('save-tx-cancel')?.addEventListener('click', () => {
    if (saveConfirm) saveConfirm.style.display = 'none';
  });
  document.getElementById('save-tx-go')?.addEventListener('click', () => {
    if (saveConfirm) saveConfirm.style.display = 'none';
    doSaveTx();
  });

  // Send-to-Lanree: commit the current draft (so we push the latest values and get
  // a real record id), then write the row into the OneDrive workbook. On-screen
  // status only — no native dialogs (iOS suppresses them; see [[ios-no-dialog-after-await]]).
  document.getElementById('send-lanree')?.addEventListener('click', async () => {
    const st = document.getElementById('lanree-send-status');
    const show = (m, ok) => { if (!st) return; st.style.display = 'block'; st.textContent = m; st.style.color = ok === false ? '#b91c1c' : (ok ? '#047857' : '#78716c'); };
    const btn = document.getElementById('send-lanree');
    if (btn) btn.disabled = true;
    show('Saving and sending to Lanree…');
    try {
      const record = commitTreatmentDraft(window._txDraft || t);
      if (window._txDraft) window._txDraft.id = record.id;   // a later Save updates, not duplicates
      const res = await pushTreatmentToLanree(record);
      show(res.message, true);
    } catch (e) {
      show(e.message || 'Could not send to Lanree.', false);
    } finally {
      if (btn) btn.disabled = false;
    }
  });

  // Delete uses an on-screen confirm panel, NOT native confirm() — iOS suppresses
  // confirm()/prompt() in the standalone / Files-app web view, so the old dialog
  // never appeared and Delete did nothing. See [[ios-no-dialog-after-await]].
  const delConfirm = document.getElementById('delete-tx-confirm');
  document.getElementById('delete-tx')?.addEventListener('click', () => {
    if (delConfirm) { delConfirm.style.display = 'block'; delConfirm.scrollIntoView({ block: 'nearest' }); }
  });
  document.getElementById('delete-tx-cancel')?.addEventListener('click', () => {
    if (delConfirm) delConfirm.style.display = 'none';
  });
  document.getElementById('delete-tx-go')?.addEventListener('click', async () => {
    // Delete every image this treatment references — committed slots plus any
    // uncommitted in-session captures — so nothing is orphaned in IndexedDB.
    const committed = committedPhotos(t.id);
    const ids = new Set();
    for (const s of PHOTO_SLOTS) {
      if (committed[s.key]) ids.add(committed[s.key]);
      if (t.photos && t.photos[s.key]) ids.add(t.photos[s.key]);
    }
    for (const id of ids) await deletePhoto(id).catch(() => {});
    // Drop this treatment AND any linked review record (so no orphan is left behind).
    state.data.treatments = state.data.treatments.filter(x => x.id !== t.id && x.reviewOf !== t.id);
    window._txDraft = null;
    saveData();
    setView('profile', { clientId: t.clientId });
  });

}

function recalcTotals() {
  const t = window._txDraft;
  if (!t) return;
  if (isFlatFeeProduct(t.product)) return;   // flat-fee products have no unit fields to recompute
  const isMl = isMlProduct(t.product);
  const standardAreas = isMl ? [mlAreaName(t.product)] : ['Glabella','Frontalis',"Crow's feet",'Masseters'];
  let totalUnits = standardAreas.reduce((s, k) => s + (parseFloat(t.areas[k]) || 0), 0);
  if (!isMl) {
    totalUnits += t.others.reduce((s, o) => s + (parseFloat(o.units) || 0), 0);
  }
  const rateInfo = getEffectiveRate(t.clientId, t.product);
  const rate = t.rateOverride !== null && t.rateOverride !== undefined ? t.rateOverride : rateInfo.rate;
  const totalCharge = totalUnits * rate;
  const unitLabel = isMl ? 'ml' : 'u';

  document.getElementById('total-units').textContent = totalUnits;
  document.getElementById('billing-units').textContent = totalUnits;
  document.getElementById('charge-formula').textContent = `${totalUnits}${unitLabel} × $${rate.toFixed(2)}`;
  document.getElementById('total-charge-big').textContent = Math.floor(totalCharge).toLocaleString();
  document.getElementById('total-charge-cents').textContent = totalCharge.toFixed(2).split('.')[1];

  // Review column total (a separate no-charge follow-up; charge is unaffected).
  if (t._review && t._review.product) {
    const reviewTotal = ['Glabella','Frontalis',"Crow's feet",'Masseters'].reduce((s, k) => s + (parseFloat(t._review.areas?.[k]) || 0), 0)
      + (t._review.others || []).reduce((s, u) => s + (parseFloat(u) || 0), 0);
    const ru = document.getElementById('review-units');
    const bru = document.getElementById('billing-review-units');
    if (ru) ru.textContent = reviewTotal;
    if (bru) bru.textContent = reviewTotal;
  }

  // Update muted class on area labels/units dynamically
  document.querySelectorAll('.area-row').forEach(row => {
    const key = row.dataset.area;
    const v = parseFloat(t.areas[key]) || 0;
    row.querySelector('.area-label')?.classList.toggle('muted', v === 0);   // ml row has a text input, no .area-label
    row.querySelector('.area-value')?.classList.toggle('muted', v === 0);
  });
}

  document.querySelectorAll('.client-rate-input').forEach(inp => {
    inp.addEventListener('input', () => {

// ---------- Schedule / Appointment list Handlers ----------
// Wires the appointment rows shown on both the Today day view and the full
// Schedule: tapping the row starts a treatment, the pencil edits, and "+ Add"
// opens a blank form (pre-dated to the day currently in view).
function setupSchedule() {
  document.querySelectorAll('.appt-start').forEach(btn => {
    btn.addEventListener('click', () => {
      const appt = (state.data.appointments || []).find(a => a.id === btn.dataset.apptId);
      if (appt) startTreatmentFromAppointment(appt);
    });
  });
  document.querySelectorAll('[data-appt-edit]').forEach(btn => {

      setView('appt-form');
    });
  });
  document.querySelectorAll('[data-appt-new]').forEach(btn => {

      setView('appt-form');
